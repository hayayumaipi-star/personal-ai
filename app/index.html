/* 書き出したJSONを戻す（v4.3）。
   今までは書き出しだけあって、戻す道が無かった。隣に「全部消す」が並んでいるのに。
   **いまの記録は消さない。足すだけ。** 同じものは二重に入れない。 */
$("#btnImport").addEventListener("click", () => $("#impFile").click());
async function importJSON(text, name) {
  const out = $("#expOut");
  let d;
  try { d = JSON.parse(text); } catch { out.innerHTML = '<p class="hint" style="color:var(--alert-ink)">JSONとして読めませんでした。書き出したファイルを選んでください。</p>'; return; }
  if (!d || typeof d !== "object" || Array.isArray(d)) { out.innerHTML = '<p class="hint" style="color:var(--alert-ink)">中身の形が違います。</p>'; return; }
  const arr = k => Array.isArray(d[k]) ? d[k] : [];
  const haveNote = new Set(state.notes.map(n => n.id)), haveHash = new Set(state.notes.map(n => n.hash));
  const haveItem = new Set(state.items.map(i => i.id)), haveKey = new Set(state.items.map(i => i.dedupeKey));
  const haveDoc = new Set(state.docs.map(x => x.id)), haveDocH = new Set(state.docs.map(x => x.hash));
  const notes = arr("notes").filter(n => n && n.id && n.text && !haveNote.has(n.id) && !haveHash.has(n.hash));
  const items = arr("items").filter(i => i && i.id && i.kind && !haveItem.has(i.id) && !(i.dedupeKey && haveKey.has(i.dedupeKey)));
  const docs = arr("docs").filter(x => x && x.id && x.text && !haveDoc.has(x.id) && !haveDocH.has(x.hash));
  const turns = (d.turns && typeof d.turns === "object" && !Array.isArray(d.turns)) ? d.turns : {};
  const days = Object.keys(turns).filter(k => isDate(k) && Array.isArray(turns[k]));
  const hasSettings = d.settings && typeof d.settings === "object";
  if (!notes.length && !items.length && !docs.length && !days.length) {
    out.innerHTML = '<p class="hint">足せるものがありませんでした（すでに全部入っています）。</p>'; return;
  }
  const yes = await askConfirm({
    title: "この控えを読み込みますか？",
    body: `${esc(name || "選んだファイル")}${d.exportedAt ? `（${esc(String(d.exportedAt).slice(0, 10))} の控え）` : ""}から<br>
      原文 ${notes.length}件 ／ 項目 ${items.length}件 ／ 資料 ${docs.length}件 ／ 会話 ${days.length}日分 を足します。<br>
      <strong>いまの記録は消しません。</strong>同じものは二重に入れません。
      ${hasSettings ? "<br>設定（タイムゾーン・見た目など）も控えのものに戻します。" : ""}`,
    yes: "読み込む"
  });
  if (!yes) return;
  out.innerHTML = '<p class="hint">読み込んでいます…</p>';
  for (const n of notes) await putNote(thaw(n));
  for (const i of items) { const it = thaw(i); if (!it.dedupeKey) it.dedupeKey = dedupeKey(it); await putItem(it); }
  for (const x of docs) await putDoc(thaw(x));
  for (const k of days) {
    const byId = new Map();
    for (const t of (state.turns[k] || []).concat(thaw(turns[k]))) if (t && t.id) byId.set(t.id, t);
    const list = Array.from(byId.values()).sort((a, b) => String(a.at || "").localeCompare(String(b.at || ""))).slice(-200);
    state.turns[k] = list; lsWrite();
    if (DB) { try { await DB.doc("turns/" + k).set({ day: k, list }); } catch (e) { dbTrouble(e); } }
  }
  if (hasSettings) { await putSettings(migrateWindow(safeSettings(thaw(d.settings)))); applyTheme(state.settings.theme); }
  renderAll();
  out.innerHTML = `<p class="hint">読み込みました：原文 ${notes.length}件 ／ 項目 ${items.length}件 ／ 資料 ${docs.length}件 ／ 会話 ${days.length}日分。</p>`;
  toast("控えを読み込みました");
}

$("#btnWipe").addEventListener("click", async () => {
  const yes = await askConfirm({
    title: "すべて消しますか？",
    body: `会話 ${Object.values(state.turns).reduce((n, l) => n + l.length, 0)}件、原文 ${state.notes.length}件、項目 ${state.items.length}件を消します。<strong>取り消せません。</strong><br>残しておきたい場合は、先に「記録を書き出す」を押してください。`,
    yes: "すべて消す", danger: true
  });
  if (!yes) return;
  $("#expOut").innerHTML = '<p class="hint">消しています…</p>';
  // 画面に読み込めていない古い記録まで消し切る。消えたかどうかは読み直して確かめる
  let remaining = 0, failed = 0, firstErr = null, usedDb = false;
  for (const c of ["notes", "items", "turns", "docs"]) {
    const r = await wipeCollection(c);
    if (!r.skipped) usedDb = true;
    if (r.remaining > 0) remaining += r.remaining;
    failed += r.failed;
    firstErr = firstErr || r.error;
  }
  /* **消せていないのに、消えたように見せない**（v4.8）。
     保存先に残っているのに手元だけ空にすると、開き直したときに全部戻ってきて
     「押しても消えない」に見える（実機でそう報告された）。
     消し切れなかったときは**何も消さず**、理由を出して止まる。 */
  if (usedDb && (remaining !== 0 || failed)) {
    lastError = `全部消す：保存先に${remaining < 0 ? "不明な数の" : remaining + "件"}残りました`
      + (firstErr ? `（${describeError(firstErr)}）` : "（理由は返ってきていません）");
    renderSettings();
    $("#expOut").innerHTML = `<div class="note bad"><strong>保存先の記録を消せませんでした。</strong>
      ${remaining > 0 ? `まだ ${remaining.toLocaleString()}件 残っています。` : ""}
      消えたように見せないため、<strong>この端末の記録もそのままにしました。</strong><br>
      ${firstErr ? "理由：" + esc(describeError(firstErr)) : ""}<br>
      設定の「最後に起きた不具合」の文をそのまま伝えてください。</div>`;
    toast("保存先の記録は消せませんでした");
    return;
  }
  state.notes = []; state.items = []; state.turns = {}; state.docs = [];
  // 入力中の下書きも残さない（「全部消す」と言った以上、書きかけも消す）
  try { localStorage.removeItem(DRAFT); } catch {}
  $("#say").value = ""; saveDraft();
  lsWrite(); renderAll();
  $("#expOut").innerHTML = `<p class="hint">${usedDb ? "保存先の記録も、読み直して空になったことを確かめました。" : "記録をすべて消しました。"}設定は残してあります。</p>`;
  toast("すべて消しました");
});

/* 古い記録だけを整理する（v4.3）。
   800件を超えたとき「整理を考えてください」と言うのに、道具が「全部消す」しか無かった。
   消すのは**終わった・取り消した項目と、それだけから出来ている原文・会話**だけ。
   やりかけのものは、どれだけ古くても残す。 */
$("#btnTidy").addEventListener("click", async () => {
  const days = +$("#tidyAge").value || 365;
  const tz = state.settings.timezone;
  const cut = dayKey(new Date(Date.now() - days * 86400000), tz);
  const old = iso => validISO(iso) && dayKey(new Date(iso), tz) < cut;
  const items = state.items.filter(i => (i.status === "done" || i.status === "dropped")
    && old(i.completedAt || i.updatedAt || i.createdAt));
  const keepNote = new Set(state.items.filter(i => !items.includes(i)).map(i => i.noteId));
  const notes = state.notes.filter(n => old(n.capturedAt) && !keepNote.has(n.id));
  const turnDays = Object.keys(state.turns).filter(k => k < cut);
  if (!items.length && !notes.length && !turnDays.length) { toast("消せる古い記録はありませんでした"); return; }
  const yes = await askConfirm({
    title: `${$("#tidyAge").selectedOptions[0].textContent}の記録を消しますか？`,
    body: `終わった項目 ${items.length}件 ／ 原文 ${notes.length}件 ／ 会話 ${turnDays.length}日分 を消します。<br>
      <strong>やりかけのものは残します。</strong>取り消せません。先に「記録を書き出す」をおすすめします。`,
    yes: "古い記録を消す", danger: true
  });
  if (!yes) return;
  /* **消せたかどうかを確かめてから言う**（v5.6）。「全部消す」で直したのと同じ穴が、
     ここにはそのまま残っていた（v4.8 の壊れ方の型を参照）。
     直す前はこうだった——**先に手元から消し**、失敗を `catch {}` で握りつぶし、
     無条件に「整理しました」と言う。保存先が書き込みを拒む状態（リンクから開いた画面など）だと、
     画面からは消えるのに保存先には残り、**開き直すと全部戻ってくる**。
     見ているのは「delete を何回呼べたか」ではなく、**1件ずつの成否**。
     そして **消せなかったものは、手元からも消さない**。 */
  const del = deleteFromStore;                        // 消し方は1か所にまとめてある
  const goneItems = [], goneNotes = [], goneDays = [];
  let failed = 0;
  for (const i of items) { if (await del("items/" + i.id)) goneItems.push(i.id); else failed++; }
  for (const n of notes) { if (await del("notes/" + n.id)) goneNotes.push(n.id); else failed++; }
  for (const k of turnDays) { if (await del("turns/" + k)) goneDays.push(k); else failed++; }

  const goneI = new Set(goneItems), goneN = new Set(goneNotes);
  state.items = state.items.filter(x => !goneI.has(x.id));
  state.notes = state.notes.filter(x => !goneN.has(x.id));
  for (const k of goneDays) delete state.turns[k];
  lsWrite(); renderAll(); renderSettings();

  const done = goneItems.length + goneNotes.length + goneDays.length;
  if (failed) {
    $("#expOut").innerHTML = `<div class="note bad"><strong>保存先から消せなかったものがあります。</strong>
      ${done}件は消しましたが、<strong>${failed}件は残っています</strong>。
      その${failed}件は手元からも消していません（消したことにすると、開き直したときに戻ってきます）。<br>
      理由は下の「最後に起きた不具合」に出ています。</div>`;
    toast(`${failed}件を保存先から消せませんでした`);
  } else {
    toast(`${done}件を整理しました`);
  }
});

/* 開きっぱなしでも時計に追いつく（v4.2）。
   これが無いと、翌朝そのまま開いたときに前の日の予定が出たままになる。
   ただし **描き直しは必要なときだけ**。`.tlrow.open`（本人が開いた枠）は
   DOMのクラスなので、描き直すと閉じてしまう。毎分描き直すと邪魔になる。
   描き直すのは「日付が変わった」「進行中の枠が変わった」ときだけ（1日に数回）。 */
let tickDay = null, tickRunning = "";
function runningKey() {
  if (!state.settings) return "";
  const k = dayKey(new Date(), state.settings.timezone);
  if (view.day !== k) return "other";                 // 別の日を見ているなら関係ない
  try {
    const p = planFor(k), now = p.nowMin;
    const b = p.blocks.find(x => x.s <= now && now < x.e);
    return k + "|" + (b ? b.item.id + "@" + b.s : "none");
  } catch { return k + "|?"; }
}
function startClock() {
  if (!state.settings) return;
  tickDay = dayKey(new Date(), state.settings.timezone);
  tickRunning = runningKey();
  setInterval(() => {
    if (!state.settings) return;
    const today = dayKey(new Date(), state.settings.timezone);
    if (today !== tickDay) {
      // 今日を見ていた人だけ、新しい今日へ移す。前の日を見ている人の画面は動かさない。
      const wasOnToday = view.day === tickDay;
      tickDay = today;
      if (wasOnToday) { view.day = today; view.chatDay = today; renderAll(); toast("日付が変わりました。今日に切り替えました"); }
      tickRunning = runningKey();
      return;
    }
    soonWarn();
    refreshNowCard();              // 「あと◯分」を、開いたままでも進める（C）
    gcalDue(GCAL_EVERY_MS);        // 開いたままでも、5分ごとに Googleカレンダーの変更を取りに行く（決まり17）
    const rk = runningKey();
    if (rk !== tickRunning) { tickRunning = rk; if (view.tab === "p-day") renderDay(); }
  }, 60000);
}

/* 開いている間だけの、始まる前の知らせ（v4.3）。
   端末の通知は使えない（このページは閉じていると何も動かない）。
   **できるのは「開いているときに教える」ところまで。** それ以上を約束しない。 */
const warned = new Set();
function soonWarn() {
  if (!state.settings) return;
  const tz = state.settings.timezone, k = dayKey(new Date(), tz);
  if (view.day !== k) return;
  let p; try { p = planFor(k); } catch { return; }
  if (p.nowMin < 0) return;
  for (const b of p.blocks) {
    if (b.sub !== "event") continue;
    const left = b.s - p.nowMin;
    if (left <= 0 || left > 10) continue;
    const id = b.item.id + "@" + b.s;
    if (warned.has(id)) continue;
    warned.add(id);
    toast(`あと${left}分で「${b.item.title}」です（${hhmm(b.s)}）`);
  }
}
