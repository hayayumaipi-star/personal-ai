  state.notes = (cached && cached.notes) || [];
  state.items = rekey((cached && cached.items) || []);
  state.turns = (cached && cached.turns) || {};
  state.docs = (cached && cached.docs) || [];
  state.ready = true;
  renderAll();

  /* **自分のキーを先に効かせる**（v8.2）。`window.claude` が無い場所
     （独立したサイト・アプリの中）では、この下の行で早々に抜けてしまうので、
     ここより後ろに置くと**キーを入れてもAIが動かない**。 */
  applyOwnAI();

  if (typeof window.claude === "undefined" || !window.claude.use) { setSync("local"); return; }
  try { DL = await window.claude.use("downloads"); } catch {}
  try { HOSTSAMPLE = await window.claude.use("sample"); } catch {}
  // 焼き込んだキーが入っているなら、そちらが勝つ（claude.ai の窓口で上書きしない）
  if (!SAMPLEFN) SAMPLEFN = HOSTSAMPLE;
  let db = null;
  try { db = await window.claude.use("db"); } catch {}
  if (!db) { setSync("local"); return; }
  DB = db; state.backend = "db"; setSync("ok");
  try {
    const s = await DB.doc("meta/settings").get();
    if (s.exists) { state.settings = migrateWindow(safeSettings(thaw(s.data()))); applyTheme(state.settings.theme); }
    /* **必ず新しい順に取ること**（v4.0）。`limit` の上限は1000で、
       並び順を指定しないと **ドキュメントidの昇順**になる。id は `Date.now()` から作るので、
       それは「いちばん古い1000件」を意味する。1000件を超えた日から、
       **最近の記録がまるごと読み込まれなくなる**（保存はされているのに画面から消える）。 */
    const [ns, is, ts, ds] = await Promise.all([
      DB.collection("notes").orderBy("createdAt", "desc").limit(READ_LIMIT).get(),
      DB.collection("items").orderBy("createdAt", "desc").limit(READ_LIMIT).get(),
      DB.collection("turns").orderBy("day", "desc").limit(400).get(),
      DB.collection("docs").orderBy("createdAt", "desc").limit(200).get()
    ]);
    /* LifeOS 側が書いた記憶と結果を読む。**無くても落ちない**——
       つながっていない状態でも、アプリはこれまでどおり動くこと。 */
    try {
      const [ms, rs] = await Promise.all([
        DB.collection("lifeos_memory").limit(200).get(),
        DB.collection("lifeos_results").limit(50).get()
      ]);
      state.lifeos.memory = ms.docs.map(d => thaw(d.data()));
      state.lifeos.results = rs.docs.map(d => thaw(d.data()));
    } catch (e) { /* LifeOS 側がまだ無い。それでよい */ }
    // すべて thaw を通す。凍結されたまま state に入れると、以後の更新が全部落ちる。
    // 並びは、これまでどおり古い順に戻しておく（画面側がその前提で並べ替えている）。
    const byCreated = (a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || ""));
    state.notes = ns.docs.map(d => thaw(d.data())).sort(byCreated);
    state.items = rekey(is.docs.map(d => thaw(d.data())).sort(byCreated));
    state.docs = ds.docs.map(d => thaw(d.data())).sort(byCreated);
    state.turns = {};
    for (const d of ts.docs) { const v = thaw(d.data()); if (v && Array.isArray(v.list)) state.turns[d.id] = v.list; }
    lsWrite(); renderAll();
  } catch (e) { dbTrouble(e); }
}

/* =======================================================================
   取り込み（重複を作らない）
   ======================================================================= */
function normNote(t) {
  return t.replace(/\r\n/g, "\n").split("\n")
    .map(l => l.replace(/[ \t　]+/g, " ").trim())
    .join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

/* =======================================================================
   1日を組み立てる（v6.5・本人の指示）
   「6時から11時半までの間で勉強を30分かける2回。その間にお風呂とご飯それぞれ
   30分ずつ使う。他に入れる予定ややった方がいい習慣などを提案して組み立てて。」
   —— これを受け取って、**言われたものを言われた長さで置き、空いた所に提案を足す**。
   決まり8は崩さない：**時刻も並びもコードが決める。AIは文章だけ。**
   提案は**こちらが足したもの**なので `suggested:true` を立て、印を出し、1手で全部消せる。
   ======================================================================= */
/* **「予定を埋めて」も組み立ての依頼**（v8.6・実機で報告）。
   拾っていたのは「組み立てて」「作って」「提案して」だけで、**「埋めて」が抜けていた**。
   そのせいで「8時から10まで適当に予定を埋めて」が、組み立てとして一度も動かなかった。
   足すのは**「スケジュール／予定／一日／日程」が前にあるとき**だけ——
   単独の「埋めて」（穴を埋めて）まで拾わないため。 */
const RE_BUILD_DAY = /(組み立て|組みたて|くみたて|組んで)|((スケジュール|予定|一日|1日|日程).{0,8}(作って|つくって|立てて|考えて|埋めて|うめて))|提案して/;
/* 文のどこに「時刻の範囲」があるかを数える（決まり7e・同じ判定を2か所に書かない）。
   使うのは2つ：①組み立ての時間帯を、依頼の言葉の**直前の範囲**から採るとき
   ②範囲を2つ言われたのに1つしか使えなかったときに、**黙らずに言う**とき。 */
const RE_RANGE_AT = new RegExp(
  "(?:午前|午後|朝|昼|夕方|夜|晩|深夜|夜中)?\\s*\\d{1,2}\\s*[:：時](?!間)(?:\\s*\\d{1,2}\\s*分?|\\s*半)?\\s*(?:から|〜|～|-|–)\\s*"
  + "(?:午前|午後|朝|昼|夕方|夜|晩|深夜|夜中)?\\s*\\d{1,2}\\s*(?:[:：時](?!間)|(?=\\s*まで))", "g");
function rangeSpans(text) {
  const out = []; RE_RANGE_AT.lastIndex = 0;
  for (let m; (m = RE_RANGE_AT.exec(text));) { out.push({ i: m.index, len: m[0].length }); if (m.index === RE_RANGE_AT.lastIndex) RE_RANGE_AT.lastIndex++; }
  return out;
}
const RE_DUR_TIMES = /(\d{1,3})\s*分\s*(?:かける|×|x|X|\*|＊)\s*(\d{1,2})\s*回?/;
const RE_TIMES = /(\d{1,2})\s*回/;
const RE_DAY_RANGE = new RegExp(
  "(午前|午後|朝|昼|夕方|夜|晩|深夜|夜中)?\\s*\\d{1,2}\\s*時\\s*(?:\\d{1,2}\\s*分|半)?\\s*(?:から|〜|～|-|–)\\s*"
  + "(午前|午後|朝|昼|夕方|夜|晩|深夜|夜中)?\\s*\\d{1,2}\\s*時\\s*(?:\\d{1,2}\\s*分|半)?\\s*(?:まで)?\\s*(?:の)?\\s*(?:間|あいだ)?\\s*[でに]?", "g");

/* 提案の持ち札。**これで全部**——ここに無いものは提案しない（勝手に増やさない）。
   `w` は並べる順の重み。`drop` は入りきらないときに**先に落とす順**（大きいほど先に落ちる）。
   `need` が満たされないものは最初から出さない（勉強が無いのに「切り替え・準備」は要らない）。 */
const DAY_FILL = [
  { key: "prep",   title: "切り替え・準備",       min: 10, w: 5,  drop: 5, need: "focus", why: "やる範囲を決めて、通知を切る" },
  { key: "tidy",   title: "片付け・軽い運動",     min: 20, w: 25, drop: 6, need: "meal",  why: "食器を片付けて、散歩かストレッチ" },
  { key: "break",  title: "休憩",                 min: 15, w: 35, drop: 4, need: "focus2", why: "席を離れてひと息" },
  { key: "main",   title: "大事な用事を1つ",       min: 45, w: 40, drop: 7, need: null,   why: "制作・家事・手続きなど。終わりの条件を決める" },
  { key: "ready",  title: "身支度・明日の準備",   min: 20, w: 55, drop: 3, need: "bath",  why: "髪を乾かす、服や持ち物を用意する", night: true },
  { key: "spare",  title: "自由・予備時間",       min: 30, w: 60, drop: 9, need: null,   why: "趣味や、遅れた予定の調整" },
  { key: "review", title: "振り返り・明日の計画", min: 10, w: 70, drop: 2, need: null,   why: "できたことと、明日の最優先を1つずつ書く",
    dayTitle: "今日の計画を立てる", dayWhy: "今日いちばん大事なことを1つ決める", dayW: 7 },
  { key: "relax",  title: "リラックス",           min: 30, w: 75, drop: 8, need: null,   why: "読書や音楽など、区切りをつけやすいもの", night: true },
  { key: "bed",    title: "就寝準備",             min: 30, w: 90, drop: 1, need: null,   why: "歯磨き、トイレ、照明を落とす", night: true }
];
/* **合わない提案を外せるようにする**（v7.1）。持ち札は9つ固定なので、
   暮らしに合わないものが毎回出る（一人暮らしでない人の「片付け」など）。
   「片付けは提案しないで」と言えば外れ、「片付けも提案して」で戻る。
   **勝手に減らさない**——外すかどうかは本人が決める（決まり10「勝手にしぼらない」と同じ）。 */
const SUGGEST_WORDS = [
  [/(切り替え|準備だけ|事前準備)/, "prep"], [/(片付け|かたづけ|軽い運動)/, "tidy"],
  [/(休憩|きゅうけい)/, "break"], [/(大事な用事|大きな用事|メインの用事)/, "main"],
  [/(身支度|明日の準備)/, "ready"], [/(自由|予備)/, "spare"],
  [/(振り返り|ふりかえり|今日の計画)/, "review"], [/(リラックス|くつろ)/, "relax"],
  [/(就寝|寝る準備|寝支度)/, "bed"]
];
/* AIが返してよい「置き場所」の言葉と、その重み（v7.2・本人の提案）。
   **AIに時刻は返させない**（決まり8）。返すのは「だいたいどのあたりか」だけで、
   実際の時刻と並びはコードが決める。ここに無い言葉は真ん中として扱う。
   `drop` は入りきらないときに先に落ちる順（大きいほど先に落ちる）。 */
const FILL_SLOTS = {
  start:   { w: 5,  drop: 5 },   // 始める前の切り替え
  early:   { w: 25, drop: 6 },   // 前半
  middle:  { w: 45, drop: 8 },   // 真ん中
  late:    { w: 62, drop: 7 },   // 後半
  winddown:{ w: 76, drop: 3 },   // 終わりに向けて
  end:     { w: 92, drop: 1 }    // いちばん最後
};
const RE_NO_SUGGEST = /(要らな|いらな|入れないで|提案しないで|提案しなくて|なくていい|無くていい|不要|やめて)/;
const RE_YES_SUGGEST = /(も提案して|また提案して|入れていい|入れて欲しい|入れてほしい|戻して)/;
function suggestKeyIn(sentence) {
  const t = halfWidth(sentence);
  for (const [re, key] of SUGGEST_WORDS) if (re.test(t)) return key;
  return null;
}

/* 本人が言った活動を、一日のどのあたりに置くか。
   **順番はこちらが決めてよい**（「組み立てて」と言われているので）。ただし理由が言えること：
   集中は前半、食事は中盤、入浴は身支度の前。ここに無い言葉は「大事な用事」の後ろに置く。 */
const RE_FOCUS = /(勉強|学習|課題|作業|仕事|レポート|研究|練習|読書)/;
const RE_BATHY = /(風呂|入浴|シャワー)/;
function wantWeight(title, nth) {
  if (RE_FOCUS.test(title)) return 10 + nth * 20;        // 勉強①=10 / 勉強②=30
  if (RE_MEAL.test(title)) return 20 + nth * 20;
  if (RE_BATHY.test(title)) return 50 + nth;
  return 45 + nth;
}

/* 発言から「何を・何分・何回」を取り出す。**言われていない数は作らない。** */
/* 一日の組み立てで拾う活動の語。**ここに無いものは、厳しい門をもう一度通す。**
   `wantsIn` が助詞を削って作る見出しは、文の区切りが無いと簡単に壊れる
   （実機で「勉強を か ける①」「ご飯それぞ れ」になった）。**まず名前で拾う。** */
const DAY_ACTS = [
  [/(勉強|学習|課題|宿題)/, "勉強をする"], [/(研究)/, "研究をする"], [/(練習)/, "練習をする"],
  [/(読書|本を読)/, "読書をする"], [/(作業|仕事|レポート)/, null],
  [/(風呂|入浴|シャワー)/, "お風呂に入る"],
  [/(散歩|ウォーキング)/, "散歩する"], [/(運動|筋トレ|ストレッチ|ヨガ)/, null],
  [/(掃除|片付け|洗濯)/, null], [/(買い物|買物)/, "買い物に行く"]
];
/* 見出しを**言い切りの形**にそろえる（v6.8・本人の指摘）。
   「勉強」だけだと予定表で読みにくい。**言い換えではなく語尾をそろえるだけ**なので、
   中身の語は変わらず `dedupeKey` も `matchOpenTask` も揺れない（決まり7cb と同じ理屈）。
   **AIにやらせない理由も同じ**——AIは同じ発言でも日によって違う見出しを返すので、
   `dedupeKey` が揺れて同じ用事が二重に入る。 */
function actTitle(word, atISO, tz) {
  const w = String(word || "").trim();
  if (!w) return "";
  const meal = mealTitle(w + "を食べる", atISO, tz);        // ご飯・朝昼夕は決まり6i で名前を揃える
  if (meal) return meal;
  for (const [re, made] of DAY_ACTS) if (re.test(w)) return made || (w + "をする");
  if (RE_VERB_END.test(w)) return w;                       // もう言い切りなら触らない
  return w + "をする";
}

function wantsIn(sentence, atISO, tz) {
  let s = halfWidth(sentence), min = null, count = 1;
  const m = s.match(RE_DUR_TIMES);
  if (m) { min = +m[1]; count = +m[2]; s = s.replace(m[0], " "); }
  else {
    min = parseDuration(s);
    const c = s.match(RE_TIMES);
    if (c) { count = clamp(+c[1], 1, 8); s = s.replace(c[0], " "); }
    s = s.replace(/\d{1,3}\s*分\s*(くらい|ほど|程度)?/g, " ").replace(/\d{1,2}\s*時間\s*半?/g, " ");
  }
  s = s.replace(RE_DAY_RANGE, " ")
       .replace(/その\s*(間|あいだ)\s*[にで]?/g, " ")
       .replace(/(それぞれ|ずつ|各|合計|ぜんぶ|全部)/g, " ")
       .replace(/(使う|使いたい|とる|取る|やる|する|入る|入りたい|食べる|かける|確保)[たい]*。?\s*$/, " ");
  const out = [], seen = {};
  const add = (title, n, mealWord) => {
    if (!title || seen[title]) return;
    seen[title] = 1; out.push({ title, min: min || null, count: n, mealWord: mealWord || null });
  };
  /* ① **知っている活動の語を、名前で拾う。** 助詞を削る前に見るので、区切りが無くても壊れない。 */
  for (const part of s.split(/[とや、,・\s]/)) {
    for (const [re] of DAY_ACTS) {
      const hit = part.match(re);
      if (hit) { add(actTitle(hit[1], atISO, tz), count); break; }
    }
    const meal = part.match(/(朝ごはん|朝ご飯|朝食|昼ごはん|昼ご飯|昼食|お昼|ランチ|夜ごはん|夜ご飯|夕飯|夕食|晩ごはん|晩ご飯|ご飯|ごはん|食事)/);
    /* **食事の名前は「置かれる枠の時刻」で決める**（v6.9・朝を測って見つけた）。
       ここで決めると**話した時刻**が基準になり、夜に「明日の朝のご飯」と言うと
       「食事をとる」になった（実測）。仮の名前を置いて、枠が決まってから直す。 */
    if (meal) add(actTitle(meal[1], atISO, tz), 1, meal[1]);
  }
  if (out.length) return out;
  /* ② 知らない言葉のときだけ、助詞を削って拾う。**壊れた形は捨てる**——
     空白が混ざったもの・動詞のかけらが残ったものを予定表に入れない（決まり5「捨てるなら、言う」は
     ここでは効かない。そもそも1件も作らず、組み立て自体を見送る）。 */
  for (let part of s.split(/[とや、,・]/)) {
    part = cleanTitle(part.trim(), null)
      .replace(/^[をにではがも\s]+/, "")
      .replace(/[をにへでがはもの]$/, "")
      .trim();
    if (part.length < 2 || part.length > 14) continue;
    if (/\s/.test(part)) continue;                                  // 空白が残っているのは壊れている
    if (/(かけ|使|ずつ|それぞれ|ください|ほしい|提案|組み立)/.test(part)) continue;
    /* **依頼の言葉そのものを、活動の名前にしない**（v8.6・実測）。
       「10まで適当に予定を埋めて」が「10まで適当に予定を埋めてをする」という
       用事になって予定表に並んだ。判定はもう `RE_BUILD_DAY` が持っている（決まり7e）。 */
    if (RE_BUILD_DAY.test(part)) continue;
    if (/^(これ|それ|あれ|もの|こと|時間|予定|習慣|スケジュール)$/.test(part)) continue;
    add(actTitle(part, atISO, tz), count);
  }
  return out;
}

/* 発言ぜんぶを読んで、組み立ての依頼として成立するかを返す。
   **時間帯が読めなければ組み立てない**（どこへ置くか分からないものを置かない）。 */
function parseDayRequest(note, tz) {
  const text = halfWidth(note.text);
  if (!RE_BUILD_DAY.test(text)) return null;
  /* **時間帯は、範囲を言っている文からだけ読む**（v6.5・作りながら見つけた）。
     全文を `parseWhen` に渡すと、「生産性の高い**1日**を過ごす」の「1日」を
     **10月1日**として拾い、日付も午前/午後の判定もまるごと狂った（実測）。
     決まり「1行に複数の話題があるとき、日時を他の話題に持ち込まない」と同じ理屈。 */
  let w = null;
  const wants = [];
  const sents = [];
  for (const l of splitLines(text)) for (const st of l.sentences) sents.push(st.text);
  /* **長さが2つ以上ある文は、読点で切ってから読む**（v6.8）。
     「読書を20分、散歩を30分」を1つとして読むと、**先に出た20分が両方に付く**（実測）。 */
  const pieces = t => ((t.match(/\d{1,3}\s*分/g) || []).length >= 2
    ? t.split(/[、,]|\s+|(?=その\s*(間|あいだ)に)/).filter(Boolean) : [t]);
  for (const st of sents) {
    if (!w) { const x = parseWhen(st, note.capturedAt, tz); if (x && x.between) w = x; }
    if (RE_BUILD_DAY.test(st)) continue;                // 「提案して」の文からは活動を拾わない
    for (const pc of pieces(st)) for (const x of wantsIn(pc, note.capturedAt, tz)) wants.push(x);
  }
  /* **句点が無いと、全部が1文になる**（v6.8・実機の形）。上の `continue` で
     その1文を飛ばすと、活動を1つも拾えず**組み立てごと消える**（実測）。
     1件も拾えなかったときだけ、依頼の言葉を削ってからもう一度読む。 */
  if (!wants.length) {
    for (const st of sents) {
      const bare = st.replace(/(他に入れる予定|やった方がいい習慣|習慣|など)/g, " ")
        .replace(RE_BUILD_DAY, " ");
      for (const pc of pieces(bare)) for (const x of wantsIn(pc, note.capturedAt, tz)) wants.push(x);
    }
  }
  /* **「の間に」と言っていない範囲も、時間帯として読む**（v8.6・実機で報告）。
     「5時から7時まで勉強して**8時から10まで適当に予定を埋めて**」——
     後半は明らかに「埋めてほしい時間帯」なのに、`between`（「〜の間に」）しか
     見ていなかったので**まるごと落ちていた**（実測）。
     **採るのは、依頼の言葉の直前にある範囲だけ。** この文には範囲が2つあり、
     前の「5時から7時」は**勉強そのものの時刻**で、埋める先ではない。
     **上の道で時間帯が決まったときは、ここへ来ない**——`between` の読み方は1文字も変えない。 */
  let headLen = 0, fillOnly = false;
  if (!w) {
    const bi = text.search(RE_BUILD_DAY);
    const spans = rangeSpans(text);
    let at = -1;
    if (bi >= 0) for (const r of spans) if (r.i < bi) at = r.i;
    if (at >= 0) {
      /* **切り出さずに、前の範囲だけを空白で伏せる**（v8.6・作った直後に実測して直した）。
         最初は `text.slice(at)` を読ませたが、それだと **「明日の」が前に落ちる**ので、
         「明日の夜8時から10時まで予定を埋めて」が**今日**に組み立てられた（実測）。
         日付や「午前・午後」の言葉は範囲の前に付くので、**文はそのまま残す**こと。
         伏せるのは前の範囲だけ。空白に置き換えるので、文字の位置はずれない。 */
      let probe = text;
      for (const r of spans) if (r.i < at) probe = probe.slice(0, r.i) + " ".repeat(r.len) + probe.slice(r.i + r.len);
      const x = parseWhen(probe, note.capturedAt, tz);
      if (x && x.start && x.end) {
        const from = minOfDay(x.start, tz), to = minOfDay(x.end, tz);
        // 日をまたぐ範囲（21:00〜0:00）は時間帯にならない。今までどおり組み立てない
        if (to > from) {
          w = Object.assign({}, x, { between: { from, to } });
          headLen = at; fillOnly = true;
          /* **言われたものは、その時間帯の文からだけ拾う。**
             前半の「勉強」は別の時刻に置くものなので、埋める中身にしない。 */
          wants.length = 0;
          for (const pc of pieces(text.slice(at))) for (const y of wantsIn(pc, note.capturedAt, tz)) wants.push(y);
        }
      }
    }
  }
  if (!w || !w.between) return null;
  /* 「適当に埋めて」は**中身を1つも言っていない**のがふつうなので、そこだけ空を許す。
     ほかの道は今までどおり、1件も拾えなければ組み立てない。 */
  if (!wants.length && !fillOnly) return null;
  let win = [w.between.from, w.between.to], dk = dayKey(new Date(w.start), tz), movedFrom = null;
  /* **範囲は、終わりが過ぎていなければ「これから来る」**（v6.6・本人が「夕方6時」と確認した後に実測）。
     決まり4b は**一点の時刻**を「いちばん近いこれから来るほう」に寄せる。
     ところが **18:30 に「6時から11時半までの間で」と言うと翌日の朝6時**になっていた。
     開始は30分過ぎただけで、23:30 までまだ5時間使える——**飛ぶ必要がない。**
     「今夜こうしよう」と思うのは夕方以降なので、ここがいちばん効く。
     **4b は書き換えない**（あれは一点の時刻の話で、U群が12例で固定している）。
     ここで見るのは「日をまたいで飛んだときだけ、話した日に同じ窓が残っていないか」。 */
  const spokeDay = dayKey(new Date(note.capturedAt), tz);
  /* **日付を言われていたら、今日へ寄せない**（v7.0・朝を測って見つけた）。
     v6.6 の寄せは「日付を言っていないのに翌日へ飛んだ」を直すためのもの。
     ところが門が `dk > spokeDay` だけだったので、
     **「明日の朝6時から11時半まで」を22時に言うと、今日の22:00〜23:30 に組み立てて**いた（実測）。
     本人が「明日」と言っているのだから動かしてはいけない（決まり4b「言われていたら触らない」）。
     判定は既にある `dateSpokenIn` を使う——**同じ判定を2か所に書かない**（決まり7e）。 */
  /* **飛ぶのは翌日だけではない**（v7.9・実機で報告）。
     **06:07 に「6時から11時半までの間で」と言うと、18:00〜23:30 になっていた**（実測）。
     6時が**7分だけ**過ぎていたので決まり4b が ＋12時間へ寄せ、
     v6.6 の引き戻しは **日をまたいだときしか**見ていなかったので、そのまま通った。
     11時半まであと5時間あるのに、朝の予定が夜になる。
     **同じ日の中で飛ぶこともある。** 門を「翌日へ飛んだとき」から
     **「日付を言われていないとき」全部**に広げる——そのうえで
     ①終わりがまだ来ていない ②言われたぶんが入るだけ残っている 窓のうち、
     **いまにいちばん近いもの**を選ぶ。選び方は v6.6 のまま変えない。 */
  if (!dateSpokenIn(w)) {
    const nowMin = minOfDay(note.capturedAt, tz);
    const needMin = wants.reduce((a, x) => a + (x.min || 0) * (x.count || 1), 0);
    const cands = [win, [win[0] + 720, win[1] + 720], [win[0] - 720, win[1] - 720]]
      .filter(c => c[0] >= 0 && c[1] <= 1440 && c[1] > c[0])
      // **言われたぶんが入るだけ残っている**ものだけ。残り30分の窓へ5時間半を押し込まない
      .filter(c => c[1] > nowMin && c[1] - Math.max(c[0], nowMin) >= needMin)
      .sort((a, b) => Math.abs(a[0] - nowMin) - Math.abs(b[0] - nowMin));
    // **日をまたいだときだけ**「明日のことなら言い直して」と知らせる。
    // 同じ日の中で寄せ直したときは、本人が言ったままの時刻に戻しただけなので言わない。
    if (cands.length && (dk !== spokeDay || cands[0][0] !== win[0])) {
      if (dk !== spokeDay) movedFrom = [dk, win];
      win = cands[0]; dk = spokeDay;
    }
  }
  /* **もう始まっている範囲は、いまから組み立てる**（v6.6）。
     20時に「6時から11時半までの間で」と言われて 18:00 から並べると、
     18:00〜20:00 のぶんが**まるごと「過ぎています」**になる（`planFor` は過ぎた所に置かない）。
     欲しいのは「残りの時間で、どう過ごすか」。頭を**いま**へ寄せて、5分刻みに丸める。 */
  let startedAt = null;
  if (dk === dayKey(new Date(note.capturedAt), tz)) {
    const nowMin = minOfDay(note.capturedAt, tz);
    if (nowMin > win[0]) { startedAt = win[0]; win = [Math.ceil(nowMin / 5) * 5, win[1]]; }
  }
  if (win[1] - win[0] < 15) return null;        // 残りが15分を切るなら、組み立てるより言い直してもらう
  // `headLen`＝この時間帯より前に言ったこと。ふつうの読み取りへ回す（決まり0b「発言を捨てない」）
  return { win, wants, dayKey: dk, movedFrom, startedAt, headLen };
}

/* 並べる。**入りきらなければ提案から落とす**（本人が言ったものは落とさない）。
   余った時間は「自由・予備時間」に足す——余りを黙って消さない。 */
function buildDayPlan(req, st, aiFill) {
  const [from, to] = req.win;
  const rows = [];
  const seen = {};
  for (const wnt of req.wants) {
    const n = Math.max(1, Math.min(8, wnt.count || 1));
    for (let i = 0; i < n; i++) {
      const nth = (seen[wnt.title] = (seen[wnt.title] || 0));
      seen[wnt.title]++;
      rows.push({ title: n > 1 ? `${wnt.title}${"①②③④⑤⑥⑦⑧"[i]}` : wnt.title,
        min: clamp(wnt.min || st.defaultEstimate, 5, 480), w: wantWeight(wnt.title, nth),
        mealWord: wnt.mealWord || null, mine: true });
    }
  }
  const kinds = {
    focus: rows.some(r => RE_FOCUS.test(r.title)),
    focus2: rows.filter(r => RE_FOCUS.test(r.title)).length >= 2,
    meal: rows.some(r => RE_MEAL.test(r.title)),
    bath: rows.some(r => RE_BATHY.test(r.title))
  };
  /* **朝の組み立てに「就寝準備」を入れない**（v6.9・朝を測って見つけた）。
     持ち札は夜を前提に作ってあった。朝6時〜11時半で組むと
     **就寝準備・リラックス・身支度が日中に並ぶ**（実測）。
     夜かどうかは**窓の終わりが21時以降か**で決める（言葉ではなく時刻で決める）。
     「区切り」だけは朝にも要るので、文言を入れ替える（振り返り → 今日の計画を立てる）。 */
  const isNight = to >= 21 * 60;
  // 「◯◯は提案しないで」と言われた札は出さない（v7.1）
  const off = prefs(req.dayKey).noSuggest;
  /* **AIが考えた札があれば、そちらを使う**（v7.2・本人の提案）。
     持ち札9つは全員に同じ顔ぶれが出るので、毎回同じ予定表になる。
     AIはその人の話（わたしのこと・開いている用事）を見ているので、中身を任せる。
     **ただし時刻と並びはコードが決める**（決まり8）。AIから受け取るのは
     「名前・長さ・だいたいどのあたり」だけで、検算も全部こちらでやる（決まり9）。
     AIがオフ・失敗・空のときは、今までどおり `DAY_FILL` に戻る（決まり7「AIは任意」）。 */
  const wordsOff = off.flatMap(k => SUGGEST_WORDS.filter(([, kk]) => kk === k).map(([re]) => re));
  /* **本人が言ったものと重なる札は捨てる**（v7.2・作った直後に実測で出た）。
     依頼文で「本人が言った予定と同じものを出さない」と頼んでいるが、
     **禁じただけで守られたと思わない**（決まり9）。実際「勉強をする」が
     本人の枠とは別に、もう1つ提案として入った。 */
  const fill = (aiFill && aiFill.length)
    ? aiFill.filter(f => !wordsOff.some(re => re.test(f.title))
        && !rows.some(r => sameTopic(r.title, f.title)))
    : DAY_FILL.filter(f => (!f.need || kinds[f.need]) && (!f.night || isNight) && !off.includes(f.key))
      // 朝の「計画」は**始めに**置く。夜の「振り返り」と同じ重みだと終わりに来る（実測）
      .map(f => ({ title: (!isNight && f.dayTitle) ? f.dayTitle : f.title, min: f.min,
        w: (!isNight && f.dayW != null) ? f.dayW : f.w,
        why: (!isNight && f.dayWhy) ? f.dayWhy : f.why, drop: f.drop, key: f.key, mine: false }));

  const room = to - from;
  const mineMin = rows.reduce((a, r) => a + r.min, 0);
  let picked = fill.slice(), dropped = [];
  const total = () => mineMin + picked.reduce((a, f) => a + f.min, 0);
  // 入りきらないぶんは、決めた順に提案から落とす（本人が言ったものには触らない）
  while (total() > room && picked.length) {
    picked.sort((a, b) => b.drop - a.drop);
    dropped.push(picked.shift().title);
  }
  const short = Math.max(0, mineMin - room);          // 本人のぶんだけで溢れている量
  // 余りは「自由・予備時間」に足す。無ければ最後の提案を延ばす
  /* 余りは「自由・予備時間」に足す。**ただし膨らませすぎない**（v6.9）。
     朝の組み立てで 1時間50分の「自由・予備時間」になった（実測）。
     入りきらなかったぶんは**空きとして残す**——`planFor` が空き時間として描くので、
     黙って消したことにはならない。 */
  let left = room - total();
  if (left > 0 && picked.length) {
    /* **名前のついた活動を、こちらの都合で長くしない**（v7.5・実機で報告 → v7.7 で徹底）。
       前は「余りを最後の札に全部足す」だったので、AIが「20分」と言った
       **「好きな音楽を聴く」が 1時間30分**になった（実測）。
       本人は一度もそう言っていないし、AIもそうは言っていない（決まり2）。
       **一度は「少しだけなら」と +30分／端数ならし +15分を残したが、本人が「伸ばさないで」
       と決めた**（v7.7）。いま伸ばしてよいのは「自由・予備時間」だけ——
       あれは**もともと中身が無い枠**なので、長さそのものが意味になる。
       残りは空きのままにする。`planFor` が空き時間として描くので、黙って消したことにならない。 */
    // 伸ばしてよいのは「自由・予備時間」だけ（90分まで）。
    // **名前のついた活動は、1分も伸ばさない**（v7.7・本人の指示）。
    const sp = picked.find(f => f.key === "spare");
    if (sp) {
      const take = Math.max(0, Math.min(left, 90 - sp.min));
      sp.min += take; left -= take;
    }
  }
  const all = rows.concat(picked).sort((a, b) => a.w - b.w);
  let at = from;
  for (const r of all) { r.s = at; r.e = at + r.min; at += r.min; }
  return { rows: all, dropped, short, left, win: req.win };
}

/* =======================================================================
   計画づくり（固定予定と移動可能な作業枠を分ける）
   ======================================================================= */
function liveItems() { return state.items.filter(i => i.status !== "dropped"); }

const curMin = tz => { const p = parts(new Date(), tz); return p.h * 60 + p.mi; };

function planFor(key, opts) {
  const st = state.settings, tz = st.timezone, pref = prefs(key);
  // 「今」を知っている計画。過ぎた時間に新しい作業を置かない。
  const isToday = key === dayKey(new Date(), tz);
  const nowMin = (opts && opts.nowMin != null) ? opts.nowMin : (isToday ? curMin(tz) : -1);
  const [ws, wsm] = st.workStart.split(":").map(Number);
  const [we, wem] = st.workEnd.split(":").map(Number);
  const winS = ws * 60 + wsm;
  let winE = we * 60 + wem, winCapped = null;
  if (pref.noEveningWork != null && pref.noEveningWork < winE) { winE = pref.noEveningWork; winCapped = true; }

  // 固定予定。移動と準備も動かせない枠として先に確保する。
  // 日付が壊れている項目は時間割に載せない（1件で画面全体を落とさないため）
  /* **その日に「かかっている」予定を集める**（v4.3）。
     開始日だけで選ぶと「23時から翌1時まで」が翌日の 0:00〜1:00 に出ず、
     空いている扱いのままそこへ作業が置かれる。一日じゅう使える設定にしたぶん、なおさら効く。 */
  const dayS = keyToDate(key, tz).getTime(), dayE = dayS + 86400000;
  const spanOf = i => {
    const s = new Date(i.start).getTime();
    const e = validISO(i.end) ? new Date(i.end).getTime() : s + 3600000;
    return [s, e > s ? e : s + 3600000];
  };
  /* くり返しの予定は、その日のぶんを**この場で組み立てる**（v4.3）。
     項目は1件のまま増やさない（毎週のゼミを52件の記録にしない）。
     組み立てたものは表示用の写しで、id は元のまま。操作は `findItem` が本体に届く。 */
  const repeatOn = liveItems().filter(i => i.kind === "event" && i.status === "open"
      && i.repeat && validISO(i.start) && occursOn(i, key, tz))
    .map(i => {
      const p = parts(new Date(i.start), tz);
      const [ky, km, kd] = key.split("-").map(Number);
      const dur = validISO(i.end) ? (new Date(i.end) - new Date(i.start)) : 3600000;
      const st = zoned(ky, km, kd, p.h, p.mi, tz);
      return Object.assign({}, i, {
        start: st.toISOString(), end: new Date(st.getTime() + dur).toISOString(),
        dayKey: key, occurDay: key
      });
    });
  const onDay = liveItems().filter(i => i.kind === "event" && i.status !== "done" && validISO(i.start)
    && !i.repeat
    && (i.timeUnknown ? dayKey(new Date(i.start), tz) === key
                      : (spanOf(i)[0] < dayE && spanOf(i)[1] > dayS)))
    .concat(repeatOn);
  const timeless = onDay.filter(i => i.timeUnknown);     // 日付だけ分かっている予定
  const events = onDay.filter(i => !i.timeUnknown)
    .map(i => {
      const [ms, me] = spanOf(i);
      return {
        item: i,
        s: ms <= dayS ? 0 : minOfDay(i.start, tz),
        e: me >= dayE ? 24 * 60 : minOfDay(i.end, tz),
        fromPrev: ms < dayS, toNext: me > dayE
      };
    })
    .sort((a, b) => a.s - b.s);

  const blocks = [];
  for (const ev of events) {
    /* 終日の予定は、幅ゼロの帯にして先頭に出す（v4.3）。
       作業時間はふさがない——旅行中でも読書はできる。ふさぎたいときは
       「その日は予定を入れないで」と言えば `lightDay` が効く。 */
    if (ev.item.allDay) {
      blocks.push({ type: "fixed", sub: "allday", s: 0, e: 0, item: ev.item,
        reason: `${ev.item.spanEndKey && ev.item.spanEndKey !== key ? "この日をまたいで続きます。" : ""}終日の予定として置いています。作業の時間はふさいでいません。` });
      continue;
    }
    // 前の日から続いている枠に、移動・準備は付けない（前の日で済んでいる）
    const tv = ev.fromPrev ? 0 : (ev.item.travelMin || 0), pr = ev.fromPrev ? 0 : (ev.item.prepMin || 0);
    if (pr && ev.s - tv - pr >= 0) blocks.push({ type: "fixed", sub: "prep", s: ev.s - tv - pr, e: ev.s - tv, item: ev.item,
      reason: `出発前の準備に${pr}分。直前に慌てないよう先に確保しました。` });
    if (tv && ev.s - tv >= 0) blocks.push({ type: "fixed", sub: "travel", s: ev.s - tv, e: ev.s, item: ev.item,
      reason: `移動に${tv}分かかると言っていたので確保しました。` });
    // 「固定の予定です」は書かない。左の実線の帯と色がそれを言っている（6f）。
    // 書くのは、こちらが勝手に決めた部分だけ。終わりの時刻は聞いていなければ仮置き。
    blocks.push({ type: "fixed", sub: "event", s: ev.s, e: ev.e, item: ev.item,
      fromPrev: ev.fromPrev, toNext: ev.toNext,
      reason: (ev.item.endUnknown ? "終わりの時刻は聞いていないので、1時間で置いています。" : "")
        + (ev.fromPrev ? "前の日から続いています。" : "") + (ev.toNext ? "次の日へ続きます。" : "") });
  }

  /* **仮置きの終わりは、本人が言った時刻に道を譲る**（v4.5・本人の指示）。
     「12時半からご飯食べに行く」の1時間は**こちらの仮置き**。
     「1時から2時まで勉強する」の 13:00 は**本人が言った事実**。
     仮置きが事実を押しのけて重なるのは順序が逆なので、仮置きの側を短くする。
     **始まりは動かさない**（始まりはいつも本人が言っている）。
     10分を切るほど短くなるなら縮めない——それは重なりとして知らせるべきこと。 */
  {
    const fx = blocks.filter(b => b.type === "fixed" && b.e > b.s).sort((a, b) => a.s - b.s);
    for (const b of fx) {
      if (b.sub !== "event" || !b.item.endUnknown) continue;
      let cut = null, by = null;
      for (const o of fx) {
        if (o === b || o.item === b.item) continue;
        if (o.s > b.s && o.s < b.e && (cut == null || o.s < cut)) { cut = o.s; by = o; }
      }
      if (cut == null || cut - b.s < 10) continue;
      b.e = cut;
      b.trimmed = true;
      b.reason = `終わりの時刻は聞いていないので1時間で置いていましたが、`
        + `${hhmm(cut)}からの「${by.item.title}」と重ならないように短くしました。`;
    }
  }

  // 作業時間帯から固定枠を引いた残りが、動かせる枠を置ける場所。
  // 開始は「今」以降。過ぎた時間に新しい作業は置かない。
  const startFloor = nowMin >= 0 ? Math.max(winS, Math.ceil(nowMin / 5) * 5) : winS;
  let free = [[startFloor, winE]];
  for (const b of blocks) {
    const nf = [];
    for (const [a, z] of free) {
      if (b.e <= a || b.s >= z) { nf.push([a, z]); continue; }
      if (b.s > a) nf.push([a, b.s]);
      if (b.e < z) nf.push([b.e, z]);
    }
    free = nf.filter(([a, z]) => z - a >= 10);
  }

  /* **未来の日には、その日までに片づけるものだけを置く**（v4.3）。
     今まではどの日を見ても「開いている用事ぜんぶ」を置いていたので、
     期限の無い30件が今日にも来週にも同じ順で並び、**どの日も同じ顔**になっていた。
     今日は今までどおり全部を対象にする（今日は「残っていること」を見る日でもある）。 */
  const todayKey = dayKey(new Date(), tz);
  const forFuture = key > todayKey;
  const tasks = liveItems().filter(i => i.kind === "task" && i.status !== "done" && !i.repeat
    && (!forFuture || (i.dayKey && i.dayKey <= key) || i.targetDay === key))
    // くり返しの用事（毎月1日の家賃）は、当たる日にだけ出す
    .concat(liveItems().filter(i => i.kind === "task" && i.status === "open" && i.repeat && occursOn(i, key, tz))
      .map(i => Object.assign({}, i, { dayKey: key, occurDay: key, duePrecision: "day" })));
  const scored = tasks.map(t => {
    let bucket, why;
    const days = t.dayKey ? Math.round((keyToDate(t.dayKey, tz) - keyToDate(key, tz)) / 86400000) : 999;
    if (t.targetDay === key && t.dayKey && t.dayKey > key) {
      bucket = 0.5; why = `締切は${t.dayKey.slice(5).replace("-", "/")}。今日中にと言っていたので前倒しです`;
    } else if (t.dayKey && t.dayKey < key) { bucket = 0; why = "期限を過ぎています"; }
    else if (t.dayKey === key) { bucket = 1; why = t.dueIsDeadline ? "今日が期限です" : "今日と言っていました"; }
    else if (t.dayKey && t.dayKey > key) {
      bucket = days <= 7 ? 2 : 4;
      why = t.duePrecision === "week" ? `期限がはっきりしません（${t.dayKey.slice(5).replace("-", "/")}ごろ・要確認）。あと約${days}日` : `期限まであと${days}日`;
    } else { bucket = 3; why = "期限は決まっていません"; }
    return { t, bucket, why, days };
  }).sort((a, b) => a.bucket - b.bucket || a.days - b.days || String(a.t.createdAt).localeCompare(String(b.t.createdAt)));

  /* **置き場所を言われた作業だけ、予定表に置く**（v4.4・本人の指示）。
     「明日、資料を作る。2時間。」には時刻が無い。それを 00:00 から並べるのは
     こちらが勝手に決めた場所で、本人は一度もそう言っていない。
     置き場所とは次のどちらか：
       ① 時刻を言った（`duePrecision:"exact"`。23:59 は「その日まで」の意味なので置き場所ではない）
       ② 時間帯を言った（`preferWindow`＝午前中・午後・夕方以降）
     どちらも無いものは `loose` として返し、画面の「タスク」に貯める。
     **これは「入りきらなかった」ではない。** 置き場所を聞いていないだけなので、
     理由を付けて未配置にもしない（そこに出すと、毎日「入らなかった」と言い続ける）。 */
  const unplaced = [];
  const cursor = free.map(f => f.slice());
  const run = free.map(() => 0);           // 各区間で続けて作業した分数（休憩の判断用）
  const every = clamp(st.breakEveryMin || 90, 30, 240), brk = clamp(st.breakMin || 10, 5, 30);

  /* 「午前中」の始まりは 0:00 ではない（v4.4）。一日じゅう使える設定にしたので、
     [0,720] のままだと「午前中にやる」が **深夜0時**に置かれる。
     これは本人の起床時刻の推測ではなく、**言葉の意味**として 6時からにする。 */
  const WINDOWS = { morning: [6 * 60, 12 * 60], afternoon: [12 * 60, 18 * 60], evening: [17 * 60, 24 * 60] };
  const WINDOW_JA = { morning: "午前中", afternoon: "午後", evening: "夕方以降" };

  const placedAt = t => {
    if (t.duePrecision !== "exact" || !validISO(t.due)) return null;
    if (dayKey(new Date(t.due), tz) !== key) return null;
    const m = minOfDay(t.due, tz);
    return m === 23 * 60 + 59 ? null : m;     // 23:59 は「その日まで」＝置き場所ではない
  };
  /* 置いてよい時間帯。「午前中に」のような言葉のほか、
     「6時から9時の間に」のように**本人が範囲を言った**ものも入る（v4.5）。 */
  const winOf = t => (t.winFrom != null && t.winTo != null && t.winTo > t.winFrom)
    ? [t.winFrom, t.winTo]
    : (t.preferWindow && WINDOWS[t.preferWindow] ? WINDOWS[t.preferWindow] : null);
  /* **置き場所は「その日のどこ」であって、「どの日」ではない**（v4.6）。
     「明日の午前中に資料を作る」を、今日の午前が空いているからといって**今日に置かない**。
     実機で、明日6〜9時の作業が今日の「置かないもの」に理由付きで出た。
     今日に置いてよいのは、その日が期限のもの・期限切れ・今日やりたいと言ったもの・日付の無いもの。 */
  const ownDay = t => !t.dayKey || t.dayKey <= key || t.targetDay === key;
  /* **「この日にやる」と言った日があるなら、枠を置くのはその日だけ**（2026-09-21・実機で報告）。
     「明日までの資料を、できれば今日の午前中に進めたい」と言うと、
     **今日（やると言った日）・明日（締切）・明後日（期限切れ）の3日ぶんに1時間ずつ**
     入っていた（実測）。本人が作業すると言ったのは**1日だけ**で、
     あとの2日はこちらが勝手に足した枠（決まり2「推測を確定にしない」）。
     1時間の仕事が3時間あるように見えるので、その日の残り時間の見え方まで狂う。
     **ただし `targetDay` を過ぎても終わっていないものは、今までどおり置き直す**——
     やり損ねた用事が二度と予定に戻らないほうが困る。
     枠を置かない日でも**消しはしない**。「この日にやること」に、理由を添えて出す
     （決まり6f・「詰め込まず理由を示す」）。 */
  const targetElsewhere = t => !!t.targetDay && t.targetDay !== key && t.targetDay >= todayKey;
  const loose = [], toPlace = [], elsewhere = [];
  for (const s of scored) {
    if (ownDay(s.t) && targetElsewhere(s.t)) { elsewhere.push(s.t); continue; }
    if (ownDay(s.t) && (placedAt(s.t) != null || winOf(s.t))) toPlace.push(s);
    else loose.push(s.t);
  }

  for (const { t, why, bucket } of toPlace) {
    // 「今日は詰めない」と言われている日は、急がないものを今日に置かない
    if (pref.lightDay && bucket >= 2) {
      unplaced.push({ item: t, need: t.remainingMin != null ? t.remainingMin : (t.estimateMin || st.defaultEstimate),
        reason: "今日はこれ以上詰めないでおきます（夜まで作業したくないと言っていたので）" });
      continue;
    }
    const assumed = t.estimateMin == null && t.remainingMin == null;
    // 「あと1時間必要」と言われたら、残りの方を使って組み直す。
    // 0分や壊れた値で幅ゼロの枠を作らないよう、下限を置く。
    const need = Math.max(5, num(t.remainingMin != null ? t.remainingMin : (assumed ? st.defaultEstimate : t.estimateMin), 1, 1440) || st.defaultEstimate);
    const win = winOf(t);
    const winName = (t.winFrom != null && t.winTo != null)
      ? `${hhmm(t.winFrom)}〜${hhmm(t.winTo)}の間` : WINDOW_JA[t.preferWindow];
    const bufNeed = (t.estimateUncertain || pref.buffer) ? Math.min(30, Math.max(15, Math.round(need / 3))) : 0;
    let put = false, missedWindow = false;

    /* 時刻を言われたものは、**言われた時刻に置く**（v4.4）。
       今までは時刻を無視して空いている先頭から詰めていたので、
       「明日14時から資料を作る」が 00:00 に置かれていた。 */
    const at0 = placedAt(t);
    if (at0 != null) {
      const room = cursor.find(iv => iv[0] <= at0 && at0 + need <= iv[1]);
      if (room && (nowMin < 0 || at0 >= nowMin)) {
        blocks.push({ type: "flex", s: at0, e: at0 + need, item: t,
          reason: `${hhmm(at0)}からと言っていました`
            + (assumed ? `。所要時間が書かれていないので${need}分と仮置きしました` : "") });
        // 空き区間を、置いた前後に分ける
        const rest = [];
        if (room[0] < at0) rest.push([room[0], at0]);
        if (at0 + need < room[1]) rest.push([at0 + need, room[1]]);
        const i0 = cursor.indexOf(room);
        cursor.splice(i0, 1, ...rest.length ? rest : [[at0 + need, at0 + need]]);
        run.splice(i0, 1, ...rest.map(() => 0), ...(rest.length ? [] : [0]));
        put = true;
      } else {
        unplaced.push({ item: t, need,
          reason: (nowMin >= 0 && at0 < nowMin)
            ? `${hhmm(at0)}は過ぎています`
            : `${hhmm(at0)}からと言っていましたが、そこは別の予定で埋まっています` });
        continue;
      }
    }
    if (put) { blocks.sort((a, b) => a.s - b.s); continue; }

    // 時間帯を言われたものは、その時間帯の中だけで探す。
    // 外して置くと「午前中に」と言われたのに夜へ置くことになる（本人が言っていない場所）。
    for (const pass of (win ? [win] : [null])) {
    if (put) break;
    for (let k = 0; k < cursor.length; k++) {
      const iv = cursor[k];
      const lo = pass ? Math.max(iv[0], pass[0]) : iv[0];
      const hi = pass ? Math.min(iv[1], pass[1]) : iv[1];
      if (hi - lo < need) continue;
      if (pass && lo > iv[0]) { /* 希望の時間帯が区間の途中から始まる場合はそこから */ }
      if (pass) missedWindow = false; else if (win) missedWindow = true;
      let at = lo;
      // 続けて作業しすぎるようなら、先に休憩を挟む
      if (run[k] >= every && hi - at >= need + brk) {
        blocks.push({ type: "brk", s: at, e: at + brk, item: { id: "brk-" + at, kind: "break", title: "休憩", origin: "user", confirmed: true, status: "open" },
          reason: `${run[k]}分続けたので、アプリ側で${brk}分の休憩を入れました。` });
        at += brk; run[k] = 0;
      }
      blocks.push({
        type: "flex", s: at, e: at + need, item: t,
        reason: why
          + (t.remainingMin != null ? `。残り${durJa(t.remainingMin)}と言っていました` : "")
          + (assumed ? `。所要時間が書かれていないので${need}分と仮置きしました` : "")
          + (win ? `。${winName}にと言っていたので、その中に置きました` : "")
      });
      iv[0] = at + need; run[k] += need; put = true;
      if (bufNeed && iv[1] - iv[0] >= bufNeed) {
        blocks.push({ type: "buf", s: iv[0], e: iv[0] + bufNeed, item: { id: "buf-" + t.id, kind: "buffer", title: "予備時間", origin: "user", confirmed: true, status: "open" },
          reason: t.estimateUncertain ? `「もう少しかかるかも」と言っていたので、${t.title}の予備を取りました。延びなければ空きます。` : `余裕を持たせる設定にしているので予備を取りました。` });
        iv[0] += bufNeed; run[k] += bufNeed;
      }
      break;
    }
    }
    if (!put) {
      const biggest = cursor.reduce((m, iv) => Math.max(m, iv[1] - iv[0]), 0);
      const late = nowMin >= 0 && nowMin >= winE;
      /* **「埋まっている」と「もう過ぎている」を取り違えない**（v6.2・実機で報告）。
         20:45 に「18時から21時の間にお風呂に30分」と言うと、その時間帯は**空っぽ**なのに
         「そこに30分の空きがありません」と出ていた。予定が詰まっていると読めてしまう。
         理由は3つに分ける：①時間帯がまるごと過ぎている ②残りが足りない ③本当に埋まっている。 */
      const winPast = !!win && nowMin >= 0 && nowMin >= win[1];
      /* **「作業に使える帯の外」を「空きがない」と言わない**（v6.2b・実機で報告）。
         朝7時に「夜6時から9時までの間に30分」と言われて、18:00〜21:00 は空っぽなのに
         「そこに30分の空きがありません」と出ていた。本当の理由は、その時間帯が
         **作業に使える帯（`workStart`〜`workEnd`、「夜は入れないで」で縮んだぶんを含む）の外**
         だったこと。理由が違えば、本人の打つ手も変わる（「夜も入れていい」と言えば直る）。 */
      const winOutside = !!win && Math.min(win[1], winE) - Math.max(win[0], winS) <= 0;
      const winFree = win
        ? cursor.reduce((m, iv) => Math.max(m, Math.min(iv[1], win[1]) - Math.max(iv[0], win[0])), 0)
        : 0;
      unplaced.push({
        item: t, need,
        reason: win
          ? winPast
            ? `${winName}にと言っていましたが、その時間はもう過ぎています`
            : winOutside && winCapped
            ? `${winName}にと言っていましたが、「夜は予定を入れないで」と言っていたので${hhmm(winE)}より後には置いていません`
            : winOutside
            ? `${winName}にと言っていましたが、作業に使える時間帯（${hhmm(winS)}〜${hhmm(winE)}）の外です`
            : winFree > 0
            ? `${winName}にと言っていましたが、空いているのは最大${durJa(winFree)}です`
            : `${winName}にと言っていましたが、そこに${durJa(need)}の空きがありません`
          : late
          ? `今日の作業時間（${hhmm(winS)}〜${hhmm(winE)}）は過ぎています`
          : biggest <= 0
          ? `${hhmm(startFloor)}〜${hhmm(winE)}に空きがありません`
          : `必要な${durJa(need)}に対して、空いているのは最大${durJa(biggest)}です`
      });
    }
  }
  blocks.sort((a, b) => a.s - b.s || (a.type === "fixed" ? -1 : 1));

  const freeLeft = cursor.reduce((m, iv) => m + Math.max(0, iv[1] - iv[0]), 0);

  /* **重なっている固定予定を見つける**（v4.3）。今までは黙って重ねて描いていた。
     動かせる作業枠は空きにしか置かないので重ならない。見るのは予定どうしだけ。 */
  const conflicts = [];
  const fixedEv = blocks.filter(b => b.sub === "event").sort((a, b) => a.s - b.s);
  for (let i = 1; i < fixedEv.length; i++) {
    const a = fixedEv[i - 1], b = fixedEv[i];
    if (b.s < a.e) conflicts.push({ a: a.item, b: b.item, s: b.s, e: Math.min(a.e, b.e) });
  }

  return { key, blocks, unplaced, loose, elsewhere, winS, winE, winCapped, freeLeft, events, timeless, pref, nowMin, startFloor, conflicts };
}

/* その日に何が起きたか。history と items から作る（推測はしない） */
function reviewFor(key) {
  const tz = state.settings.timezone;
  const on = iso => iso && dayKey(new Date(iso), tz) === key;
  const done = state.items.filter(i => i.status === "done" && on(i.completedAt));
  const moved = [], est = [], dropped = [];
  for (const i of state.items) {
    for (const h of (i.history || [])) {
      if (!on(h.at)) continue;
      if (/延期/.test(h.what)) moved.push({ i, h });
      else if (/所要時間/.test(h.what)) est.push({ i, h });
      else if (/取り消/.test(h.what)) dropped.push({ i, h });
    }
  }
  const memos = state.items.filter(i => i.kind === "memo" && on(i.createdAt));
  const conds = recentConditions(key);
  return { done, moved, est, dropped, memos, conds };
}

/* recent self-reports only — never treat an old report as today's fact */
function recentConditions(key) {
  const tz = state.settings.timezone;
  return liveItems().filter(i => i.kind === "condition" && i.reportedAt && dayKey(new Date(i.reportedAt), tz) === key)
    .sort((a, b) => String(b.reportedAt).localeCompare(String(a.reportedAt)));
}

function nextAction(plan, nowOverride) {
  const tz = state.settings.timezone;
  const todayKey = dayKey(new Date(), tz);
  const nowMin = nowOverride != null ? nowOverride
    : (plan.key === todayKey ? (() => { const p = parts(new Date(), tz); return p.h * 60 + p.mi; })() : -1);
  const upcoming = plan.blocks.filter(b => b.e > nowMin);
  if (!upcoming.length) return null;
  const b = upcoming[0];
  const reasons = b.reason ? [b.reason] : [];
  const after = upcoming[1];
  if (after) reasons.push(`このあと ${hhmm(after.s)} に「${after.item.title}」があります`);
  const conds = recentConditions(plan.key);
  if (conds.length) reasons.push(`本人の申告：「${conds[0].selfReport}」（${fmtDT(conds[0].reportedAt, tz)}）。体調は数値化せず、そのまま参考にしています`);
  if (plan.unplaced.length) reasons.push(`${plan.unplaced.length}件は今日に置けていません（下に理由）`);
  return { block: b, reasons, nowMin };
}

/* =======================================================================
   描画
   ======================================================================= */
/* どこから来た情報かを、必ず見えるようにする。
   「本人が決めたこと」と「読み取ったままのこと」を混ぜないための唯一の手掛かり。 */
function srcChip(it) {
  /* **アプリが提案して入れたものは、そう言う**（v6.5）。本人が言ったものと混ぜない。
     訂正すれば「本人が訂正」に変わる——そのときはもう提案ではない。 */
  if (it.suggested && !it.corrected && it.origin !== "user") return `<span class="chip src-ai">アプリの提案</span>`;
  if (it.corrected || it.origin === "user") return `<span class="chip src-user">本人が訂正</span>`;
  if (it.confirmed) return `<span class="chip src-user">確認済み</span>`;
  if (it.origin === "ai") return `<span class="chip src-ai">AIが読み取ったまま</span>`;
  return `<span class="chip src-rule">読み取ったまま</span>`;
}
const KIND_JA = { task: "タスク", event: "予定", goal: "目標", condition: "体調（本人の申告）",
  memo: "あとで見返すメモ", preference: "こうしてほしい", break: "休憩", buffer: "予備時間",
  profile: "わたしのこと", idea: "気になっていること" };
const BLOCK_LABEL = { prep: "準備", travel: "移動", event: "", allday: "終日" };

/* 午前とも午後とも読めた時刻の「もう一方」。同じ日なら時刻だけ、違う日なら日付も出す */
function altLabel(it, tz) {
  if (!it || !it.whenAlt) return "";
  const s = fmtDT(it.whenAlt.start, tz);                 // 例「9/13 10:00」
  return it.whenAlt.dayKey === it.dayKey ? s.slice(-5) : s;
}
/* タイムラインの点（`.bdot`・決まり2）を打つかどうか。**点と凡例が同じ判定を見る**（決まり7e）——
   別々に書くと、点は出ているのに凡例に説明が無い（またはその逆）が起きる。 */
function aiGuess(it) { return !!it && it.origin === "ai" && !it.corrected && !it.confirmed; }
function itemHTML(it, opts = {}) {
  const tz = state.settings.timezone;
  const cls = ["item"];
  if (!it.confirmed && !it.corrected && it.status !== "done") cls.push("unconfirmed");
  if (it.status === "done") cls.push("isdone");
  /* **種類の印は、種類が混ざる一覧でだけ出す**（2026-09-26）。「タスク」の欄に並ぶ行に
     「タスク」の印を付けても、見出しと同じことを2回言っているだけ。`opts.noKind` で外す。
     **由来の印（`srcChip`）は外さない**——AIの推測と本人が決めたことの区別（決まり2）。 */
  const bits = [opts.noKind ? "" : `<span class="chip">${KIND_JA[it.kind]}</span>`, srcChip(it)];
  if (it.status === "done") bits.push(`<span class="chip st-done">完了</span>`);
  if (it.status === "dropped") bits.push(`<span class="chip st-drop">取り消し</span>`);
  if (it.kind === "event") bits.push(`<span class="chip fixed">固定</span>`);
  if (it.repeat) bits.push(`<span class="chip">${esc(repeatJa(it.repeat))}</span>`);
  if (it.duePrecision === "week") bits.push(`<span class="chip vague">期限があいまい</span>`);

  if (it.kind === "profile" && it.category && !opts.noCat) bits.push(`<span class="chip">${esc(it.category)}</span>`);
  if (it.docId) bits.push(`<span class="chip">資料から</span>`);
  const noWhen = it.kind === "memo" || it.kind === "preference";
  const when = it.kind === "profile" || it.kind === "idea" || (it.kind === "goal" && !it.due)
    ? `<span class="mono">${fmtDT(it.statedAt || it.createdAt, tz)} に言っていたこと</span>`
    : noWhen ? `<span class="mono">${fmtDT(it.createdAt, tz)}</span>`
    : it.kind === "event"
    ? (it.start
        ? (it.timeUnknown
            ? `<span class="mono">${it.dayKey ? it.dayKey.slice(5).replace("-", "/") : fmtDT(it.start, tz).slice(0, 5)}</span><span class="chip vague">時刻未定</span>`
            : `<span class="mono">${fmtDT(it.start, tz)}${it.end ? "–" + fmtDT(it.end, tz).slice(-5) : ""}</span>`)
          + `${it.travelMin ? `<span>移動${it.travelMin}分</span>` : ""}${it.prepMin ? `<span>準備${it.prepMin}分</span>` : ""}`
        : "")
    : (it.due ? `<span class="mono">${it.duePrecision === "exact" ? fmtDT(it.due, tz) : fmtDT(it.due, tz).slice(0, 5) + (it.duePrecision === "week" ? " ごろ" : " まで")}</span>` : `<span>期限なし</span>`);
  const est = it.kind === "task" && (it.remainingMin != null || it.estimateMin != null)
    ? `<span class="mono">${it.remainingMin != null ? "残り" + durJa(it.remainingMin) : durJa(it.estimateMin)}${it.estimateUncertain ? "＋予備" : ""}</span>` : "";
  if (it.kind === "preference") bits.push(`<span class="chip">${it.scopeDay ? "この日だけ" : "ずっと"}</span>`);
  if (it.kind === "task" && it.winFrom != null && it.winTo != null)
    bits.push(`<span class="chip">${hhmm(it.winFrom)}〜${hhmm(it.winTo)}の間に</span>`);
  else if (it.kind === "task" && it.preferWindow) bits.push(`<span class="chip">${({ morning: "午前中に", afternoon: "午後に", evening: "夕方以降に" })[it.preferWindow]}</span>`);
  const rep = it.kind === "condition" ? `<span class="mono">${fmtDT(it.reportedAt, tz)} の申告</span>` : "";
  if (it.kind === "task" && it.targetDay && it.targetDay !== it.dayKey) bits.push(`<span class="chip">${it.targetDay.slice(5).replace("-", "/")}までに終えたい</span>`);

  /* **1行に5個並べない**（2026-09-24・本人の指示・案C）。
     実測で「完了 / 明日へ / 根拠 / 訂正 / 取り消す」の5個が全部の行に出ていた。
     世の中のアプリは一覧の行にボタンを並べない（Todoist も Things も Apple も）。
     残すのは**よく押すものだけ**で、あとは「…」にたたむ。
     **決まりを1つ変えた**：前は「取り消し・完了は行のボタンから直接できる」と
     書いていたが、取り消しは「…」の中へ移した。**代わりにトーストへ
     「元に戻す」を付けた**ので、押し間違いから戻る道は**むしろ近くなっている**。
     完了は今までどおり行に置く（いちばん押すもの）。 */
  const main = [
    it.status !== "done" && (it.kind === "task" || it.kind === "event") ? `<button class="btn sm pri" data-act="done" data-id="${it.id}" data-day="${esc(it.occurDay || view.day || "")}">${it.kind === "event" ? "終わった" : "完了"}</button>` : "",
    it.status === "done" ? `<button class="btn sm" data-act="undone" data-id="${it.id}">戻す</button>` : "",
    it.kind === "task" && it.status !== "done" ? `<button class="btn sm" data-act="defer" data-id="${it.id}">明日へ</button>` : "",
    it.kind === "profile" && !it.confirmed && !it.corrected && it.status === "open" ? `<button class="btn sm" data-act="confirm" data-id="${it.id}">これで合ってる</button>` : "",
    it.whenAlt && it.status === "open" ? `<button class="btn sm" data-act="usealt" data-id="${it.id}">${esc(altLabel(it, tz))}にする</button>` : "",
    /* 続けたいことは、**いつやるかを決めると続きやすい**（実行意図・Gollwitzer & Sheeran 2006）。
       予定にしたあとは、ボタンではなく「どれだけ続いているか」を出す（`goalNote`）。 */
    it.kind === "goal" && it.status === "open" && !goalPlan(it) ? `<button class="btn sm pri" data-act="goalplan" data-id="${it.id}">予定にする</button>` : "",
    /* 気になっていることは、**やると決めたら1回で**やることにできる（GTD の「いつか／たぶん」の見直し）。
       前は「…」→「訂正」→種類を変える、の3手だった。 */
    it.kind === "idea" && it.status === "open" ? `<button class="btn sm" data-act="ideatask" data-id="${it.id}">やることにする</button>` : ""
  ].filter(Boolean);
  /* **「…」しか無い行は、ボタンを右上の角へ置く**（2026-09-26）。目標・メモ・要望は
     行で押すものが「…」1つだけなので、そのために1行ぶんの高さを取っていた。
     押しどころの大きさ（44px）は変えない。場所を角へ移しただけ。 */
  const lone = !opts.noActions && !main.length;
  if (lone) cls.push("lonemore");
  const acts = opts.noActions ? "" : `<div class="acts${lone ? " corner" : ""}">
    ${main.join("\n    ")}
    <button class="btn sm" data-act="more" data-id="${it.id}" aria-label="そのほかの操作">…</button>
  </div>`;

  const card = `<article class="${cls.join(" ")}">
    <div class="meta">${bits.join("")}</div>
    <div class="ttl">${esc(it.title)}</div>
    <div class="meta">${when}${est ? " · " + est : ""}${rep}</div>
    ${opts.note ? `<div class="hint">${esc(opts.note)}</div>` : ""}
    ${acts}
  </article>`;
  /* なぞって完了・明日へ（案A）。**できるものだけ**包む——
     包んでおいて何も起きないと、壊れているように見える。 */
  const sw = opts.swipe ? swipeActs(it) : { right: null, left: null };
  if (!sw.right && !sw.left) return card;
  return `<div class="swipe" data-swipe="${it.id}">
    ${sw.right ? `<div class="swunder l"><span>✓ 完了</span></div>` : ""}
    ${sw.left ? `<div class="swunder r"><span>明日へ →</span></div>` : ""}
    ${card}</div>`;
}

/* なぞったときに何が起きるか。**ここが唯一の判定**（決まり7e）——
   下地を描くときも、指を離したときも、テストも、全部これを見る。 */
function swipeActs(it) {
  const open = it && it.status === "open";
  return {
    right: open && (it.kind === "task" || it.kind === "event") ? "done" : null,
    left: open && it.kind === "task" ? "defer" : null
  };
}

function blockTitle(b) {
  const lab = b.sub && b.sub !== "event" ? BLOCK_LABEL[b.sub] : null;
  return lab ? `${lab}（${b.item.title}）` : b.item.title;
}
function timelineHTML(plan, na, demo) {
  if (!plan.blocks.length) return `<div class="card empty">まだ予定はありません。<br>チャットで話しかけると、ここに入ります。</div>`;
  let h = `<div class="tl">`, prevEnd = null, nowDrawn = false;
  const now = plan.nowMin;
  /* いまが枠の中に入っているなら、赤い線は引かない（v3.5）。
     線と枠が並ぶと「線より下＝まだ」と読めてしまい、進行中なのか分からなくなる。
     代わりに、その枠に「いま」の印を付ける。線は**空いている時間にいるときだけ**の目印にする。 */
  const nowInBlock = now >= 0 && plan.blocks.some(b => b.s <= now && now < b.e);
  for (const b of plan.blocks) {
    /* 「いま」の線は、**まだ始まっていない枠の手前**に引く（v3.4）。
       「終わりが今より後の枠」の手前に引いていたので、10:06 に 10:00〜10:30 の枠があると
       進行中の枠の上に線が出て、「まだ始まっていない」ように見えていた（本人からの報告）。
       いま進行中の枠は、線より上に置く。強調（`.now`）と開いた状態でそれと分かる。 */
    if (now >= 0 && !nowDrawn && !nowInBlock && b.s >= now) {
      nowDrawn = true;
      h += `<div class="tlrow nowline"><div class="tltime">${hhmm(now)}</div><div><span>いま</span></div></div>`;
    }
    // 空き時間も長さのぶんだけ空ける。ただし3時間空いていても画面3枚分にはしない。
    if (prevEnd != null && b.s - prevEnd >= 15) {
      const gap = b.s - prevEnd;
      h += `<div class="tlrow gaprow"><div class="tltime">${hhmm(prevEnd)}</div>
        <div class="gapline" style="--min:${Math.min(gap, 90)}"><span>空き ${durJa(gap)}</span></div></div>`;
    }
    const isNow = na && na.block === b && na.nowMin >= 0;
    const running = now >= 0 && b.s <= now && now < b.e;   // いま、この枠の中にいる
    const past = now >= 0 && b.e <= now && b.sub !== "allday";   // 終日の帯は薄くしない
    const side = b.sub && b.sub !== "event" ? b.sub : null;
    const cls = b.type === "fixed" ? (side || "fixed") : b.type;
    // 固定か作業枠かは左の帯で分かるので、ラベルは重ねない。
    // 由来は、AIの推測のときだけ小さな点で示す（本人が決めたものと混ざらないように）。
    const dot = (b.type === "brk" || b.type === "buf" || demo) ? ""
      : aiGuess(b.item) ? '<i class="bdot" title="AIが読み取ったもの"></i>' : "";
    const acts = demo || b.type === "brk" || b.type === "buf" ? "" : `<div class="acts">
      ${b.item.kind === "task" ? `<button class="btn sm" data-act="done" data-id="${b.item.id}" data-day="${esc(plan.key || "")}">完了</button>
      ${b.item.repeat ? "" : `<button class="btn sm" data-act="est" data-id="${b.item.id}">所要時間を直す</button>
      <button class="btn sm" data-act="defer" data-id="${b.item.id}">明日へ</button>`}` : ""}
      ${b.sub === "event" ? `<button class="btn sm" data-act="done" data-id="${b.item.id}" data-day="${esc(plan.key || "")}">終わった</button>` : ""}
      ${b.item.repeat ? `<button class="btn sm" data-act="skipday" data-id="${b.item.id}" data-day="${esc(plan.key || "")}">この日はやらない</button>` : ""}
      ${b.item.whenAlt ? `<button class="btn sm" data-act="usealt" data-id="${b.item.id}">${esc(altLabel(b.item, state.settings.timezone))}にする</button>` : ""}
      <button class="btn sm" data-act="evid" data-id="${b.item.id}">根拠</button></div>`;
    // 枠の高さは長さに比例させる。実際の px は CSS（--tlscale）が決めるので、
    // ここで渡すのは「分」だけ。長すぎるものだけ、画面を埋め尽くさないよう頭打ちにする。
    const mins = Math.min(b.e - b.s, 180);
    // 休憩・予備・移動・準備は帯にする。カードにすると10分と2時間が同じ大きさに見えてしまう。
    // どれも「その予定に付いてくる時間」で、操作する対象ではない（根拠は本体の枠にある）。
    const thin = b.type === "brk" || b.type === "buf" || b.sub === "travel" || b.sub === "prep" || b.sub === "allday";
    // 赤い線を消したぶん、「いま」の印はこの枠が引き受ける
    const tag = running ? `<span class="nowtag">いま</span>` : "";
    // アイコンと同じ「時間軸の上の丸」（D）。色の意味は枠の左の帯と同じ（決まり6f）
    const dotCls = ["b", thin ? "d-thin" : b.type === "fixed" ? "d-fix" : "d-flex",
      running ? "d-run" : "", past ? "d-past" : ""].filter(Boolean).join(" ");
    h += `<div class="tlrow ${dotCls} ${isNow ? "open" : ""}">
      <div class="tltime">${b.sub === "allday" ? "終日" : hhmm(b.s)}</div>
      <div class="blk ${cls} ${thin ? "thin" : ""} ${isNow ? "now" : ""} ${running ? "running" : ""} ${past ? "past" : ""}" style="--min:${mins}">
        ${thin
          // 休憩・予備は開いても中身が無いので、押せるようにしない
          ? `<div class="bhead">${tag}<span class="bttl">${esc(blockTitle(b))}</span>
             <span class="bdur">${b.sub === "allday" ? "" : durJa(b.e - b.s)}</span></div>`
          : `<button class="bhead" data-act="blk" aria-expanded="${isNow ? "true" : "false"}">
          ${tag}<span class="bttl">${dot}${esc(blockTitle(b))}</span>
          <span class="bdur">${durJa(b.e - b.s)}${b.sub === "event" && b.item.endUnknown ? "（仮）" : ""}</span>
        </button>
        <div class="bdetail">
          <div class="brange">${hhmm(b.s)}–${hhmm(b.e)}</div>${acts}
        </div>`}
      </div></div>`;
    // 終日の帯は時間軸を進めない（進めると先頭に「空き9時間」が出る）
    if (b.sub !== "allday") prevEnd = Math.max(prevEnd || 0, b.e);
  }
  return h + `</div>`;
}

function renderDay() {
  const tz = state.settings.timezone, key = view.day;
  notifyPlan(key);          // 殻があれば通知を取り直す。無ければ何もしない
  const isToday = key === dayKey(new Date(), tz);
  $("#dLabel").innerHTML = fmtDay(key, tz) + (isToday ? ' <span class="dow">今日</span>' : "");
  /* 今日を見ているときに「今日」ボタンを出すと、日付の横の「今日」と2つ並ぶ（2026-09-26）。
     戻る先が無いときは出さない。別の日へ動いたら出る。 */
  if ($("#dToday")) $("#dToday").hidden = isToday;
  if ($("#dPick")) $("#dPick").value = key;      // ◀▶を30回押さずに飛べるように（v4.3）
  const host = $("#dayOut");

  const demo = state.notes.length === 0;
  const plan = demo ? demoPlan() : planFor(key);
  const na = nextAction(plan);
  const conds = demo ? [] : recentConditions(key);
  let h = "";

  if (demo) {
    h += `<div class="note info"><strong>これはサンプルです。</strong>「チャット」で話しかけると、自分の一日に変わります。</div>`;
  }

  // 「未確認をまとめて確認する欄」は置かない。
  // 読み取った直後に、会話の返事の「変えたこと」で見えている。同じものを二度見せない。
  // 印（読み取ったまま／本人が訂正）は各項目に残してあるので、区別はつく。

  // 「次にすること」の札はここには出さない。会話の返事に出ている。
  // ただし na は残す——タイムラインの「いまここ」の強調に使う。
  if (!demo && !na && plan.blocks.length && plan.nowMin >= 0) {
    const left = plan.blocks.filter(b => b.item.kind === "task" && b.item.status !== "done").length;
    h += `<div class="note info"><strong>今日の枠はすべて過ぎています。</strong>${left ? `まだ終わっていない作業が${left}件あります。「明日へ」で送るか、完了にしてください。` : "お疲れさまでした。"}</div>`;
  }
  /* 空の日に「置ける予定がありません」をここ（タイムラインの上）にも出していた。
     **下のタイムラインの空の欄と同じことを2回言っていた**ので外した（2026-09-26）。
     道案内は空の欄に1行だけ残す（`timelineHTML`）。 */

  /* 予定どうしが重なっている。**タイムラインより下に出す**（6f）。
     上に出すと、毎回スクロールしないと予定が見えなくなる。 */
  const conflictHTML = (!demo && (plan.conflicts || []).length)
    ? `<div class="note warn" style="margin-top:12px"><strong>予定が重なっています。</strong>
        ${plan.conflicts.map(c => `${hhmm(c.s)}–${hhmm(c.e)}：「${esc(c.a.title)}」と「${esc(c.b.title)}」`).join("<br>")}<br>
        どちらかを動かすか取り消すと、重なりが消えます。こちらでは決めていません。</div>`
    : "";

  // 時刻未定のものは、時間割の「あと」に出す。先に出すと予定表が下に押し下げられる。
  const timelessHTML = (!demo && (plan.timeless || []).length)
    ? `<div class="note info" style="margin-top:12px"><strong>この日にあること（時刻は未定）：</strong>${plan.timeless.map(i => esc(i.title)).join("、")}<br>
      時刻を言われていないので時間割には入れていません。項目の「…」→「訂正」から時刻を入れられます。</div>`
    : "";
  const tlHTML = timelineHTML(plan, na, demo);
  const onlyNext = !demo && plan.pref && plan.pref.nextOnly;

  if (onlyNext) {
    h += `<details class="allplan" style="margin-top:12px"><summary>今日の予定をぜんぶ見る（${plan.blocks.length}件）</summary>
      <div class="legend" style="margin:8px 0 2px">
        <span><i class="lf"></i>固定</span><span><i class="lx"></i>動かせる作業枠</span>
        ${plan.winCapped ? '<span>夜は空けています</span>' : ""}
      </div>${tlHTML}</details>`;
  } else {
    /* **凡例と使い方の案内は、枠があるときだけ**（2026-09-26）。枠が1つも無い日に
       「動かさない予定／動かせる作業」「枠を押すと…」と出しても、指す先が無い。
       凡例の中身は、**その日に実際に出ている種類だけ**にする——
       AIが読み取った枠が無い日に「AIが読み取ったもの」の点を説明しても、画面のどこにも点は無い。
       印そのもの（`.bdot`・決まり2）は外していない。説明を、あるときだけにしただけ。 */
    const hasB = plan.blocks.length > 0;
    const kinds = { fixed: false, flex: false, ai: false };
    for (const b of plan.blocks) {
      if (b.type === "brk" || b.type === "buf" || !b.item) continue;   // 休憩・予備は凡例に無い
      if (b.type === "fixed") kinds.fixed = true; else kinds.flex = true;
      if (aiGuess(b.item)) kinds.ai = true;
    }
    const legend = hasB ? `<div class="legend" style="margin-top:5px">
        ${kinds.fixed ? '<span><i class="lf"></i>動かさない予定</span>' : ""}
        ${kinds.flex ? '<span><i class="lx"></i>動かせる作業</span>' : ""}
        ${kinds.ai ? '<span><i class="ld"></i>AIが読み取ったもの</span>' : ""}
        ${plan.winCapped ? '<span>夜は空けています</span>' : ""}
      </div>` : (plan.winCapped ? `<div class="legend" style="margin-top:5px"><span>夜は空けています</span></div>` : "");
    h += `<div class="sect"><h2>今日の案</h2>${legend}
      ${!hasB || tipDone("openblk") ? "" : `<p class="hint" style="margin-top:4px">枠を押すと、理由と操作が出ます。</p>`}</div>` + tlHTML;
  }
  h += conflictHTML + timelessHTML;

  /* 日付が決まっていない用事は、下の「タスク」に出す。
     ここに重ねると、夕方以降は同じ3件が1画面に2回並ぶ（実際にそうなっていた）。
     この欄は「今日のはずだったのに入らなかったもの」だけにする。 */
  const backlog = demo ? [] : liveItems()
    .filter(i => i.kind === "task" && i.status === "open"
              && (!i.dayKey || i.duePrecision === "week" || i.duePrecision === "none"))
    .sort((a, b) => (a.dayKey || "9999").localeCompare(b.dayKey || "9999")
                 || String(a.createdAt).localeCompare(String(b.createdAt)));
  const backlogIds = new Set(backlog.map(i => i.id));
  /* この欄は「今日やるはずだったのに入らなかったもの」だけにする（v2.8）。
     planFor は先の期限のものも今日の空きに置こうとするので、置けないと
     「3週間後が期限」まで毎日ここに並んでいた。それは今日の話ではないし、
     「この先の予定とタスク」に本当の期限つきで出ている。
     残すのは ①期限が今日以前（今日が期限・期限切れ） ②今日やりたいと言った（targetDay）。
     ほとんどの日は空になる。それが正しい——出たときだけ意味のある警告にする。 */
  const owedToday = i => (i.dayKey && i.dayKey <= key) || i.targetDay === key;
  /* **この日にやること**（v4.4 で作り直した）。
     以前は「入りきらなかったもの」で、`planFor` が置こうとして置けなかったものだけを出していた。
     いまは**時刻を言っていない作業はそもそも置きにいかない**ので、その欄は空のままになり、
     期限が今日のものがどこにも出なくなる。そこで、欄の中身を
     「この日が期限（または期限切れ・今日やりたいと言った）で、予定表に無いもの」に変えた。
     置こうとして置けなかったものは、理由も一緒に出す（「詰め込まず理由を示す」は守る）。
     日付を決めていないものは下の「タスク」に出るので、ここには重ねない。 */
  const inTL = new Set(plan.blocks.filter(b => b.item).map(b => b.item.id));
  const reasonFor = id => (plan.unplaced.find(u => u.item.id === id) || {}).reason || "";
  const owed = demo ? [] : liveItems()
    .filter(i => i.kind === "task" && i.status === "open"
              && !backlogIds.has(i.id) && !inTL.has(i.id) && owedToday(i))
    .sort((a, b) => (a.dayKey || "9999").localeCompare(b.dayKey || "9999"));
  const owedMin = owed.reduce((n, i) => n + (i.remainingMin != null ? i.remainingMin : (i.estimateMin || 0)), 0);

  /* **理由が違えば、本人の打つ手も変わる**（決まり6n）。「時刻を言っていないので」は、
     **本当に時刻も時間帯も言っていないものにだけ**当てはまる。別の日に進めると
     言ったから置いていないものに同じ文を出すと、嘘になる。
     どちらなのかは `planFor` が決める（`elsewhere`）——**同じ判定を2か所に書かない**（決まり7e）。 */
  const elseDay = new Map((plan.elsewhere || []).map(i => [i.id, i.targetDay]));
  /* **なぞる操作は、書いておかないと見つからない**（案A の唯一の弱点）。
     ボタンは残してあるので、読み飛ばしても困らない。1行だけにする（決まり15b）。
     **なぞれる行がある欄の上に、1回だけ出す**（2026-09-26）。前は「この日にやること」の下に
     固定で出していたので、その欄が空（「ありません。」）のとき、**指す先の無い案内**になっていた。
     なぞれるかどうかは `swipeActs` が決める（決まり7e・下地を描く側と同じ判定）。 */
  const swipable = list => list.some(i => { const a = swipeActs(i); return !!(a.right || a.left); });
  const swipeTipHTML = `<p class="hint" style="margin-top:3px">右へなぞると完了、左へなぞると明日へ。</p>`;
  let swipeTip = !demo && !tipDone("swipe");
  const tipHere = list => (swipeTip && swipable(list)) ? (swipeTip = false, swipeTipHTML) : "";
  h += `<div class="sect"><h2>この日にやること</h2>${tipHere(owed)}</div>`;
  if (!owed.length) {
    h += `<div class="card empty">ありません。</div>`;
  } else {
    /* 全部が「時刻を言っていない」ものなら今までどおりの文、混ざっているなら「〜ものは」。
       1件も無ければ書かない——**当てはまらない理由を出さない**（決まり6n）。 */
    const noPlace = owed.filter(i => !elseDay.has(i.id) && !reasonFor(i.id)).length;
    const why = !noPlace ? ""
      : noPlace === owed.length ? "時刻を言っていないので、予定表には置いていません。"
      : "時刻を言っていないものは、予定表には置いていません。";
    h += `<div class="note info">${owed.length}件${owedMin ? `・合わせて <span class="mono">${durJa(owedMin)}</span>` : ""}。${
      why ? `<br><strong>${why}</strong>
      「午前中に」「14時から」のように言うと、上の予定表に入ります。` : ""}</div><div class="stack">`;
    for (const i of owed) {
      const r = reasonFor(i.id), ed = elseDay.get(i.id);
      h += demo ? "" : itemHTML(i, { swipe: true, noKind: true, note: r ? "置けない理由：" + r
        : ed ? `${fmtDayPlain(ed, tz)}に進めると言っていたので、その日の予定表に入れています。` : "" });
    }
    h += `</div>`;
  }

  h += `<div class="sect"><button class="btn" id="btnManual">＋ 自分で足す</button></div>`;

  /* --- 日付が決まっていない「やること」（v2.7） ---
     予定表は日付を必要とするが、これらには日付が無い。
     日付なし（duePrecision:"none"）は `ahead` にも入らないので、今日の案に入らなかった日は
     どこにも出ず、そのまま忘れられていた。スケジュールの一番下に、常に見える場所を作る。
     「今日の案」と重なる分は、行ごとに書かず、見出しの下に件数だけ出す（二度見せない）。 */
  if (!demo) {
    // 今日の案に入っているものは、上のタイムラインに出ている。ここには重ねない。
    // 代わりに件数だけ書いて、一覧が欠けて見えないようにする。
    const inPlan = new Set(plan.blocks.filter(b => b.item).map(b => b.item.id));
    const placed = backlog.filter(i => inPlan.has(i.id)).length;
    const rest = backlog.filter(i => !inPlan.has(i.id));
    // 置けなかった理由は、この欄に持ってくる（「詰め込まず理由を示す」を守る）
    const reasonOf = id => (plan.unplaced.find(u => u.item.id === id) || {}).reason || "";

    h += `<div class="sect"><h2>タスク</h2>
      <p class="hint" style="margin-top:4px">日付を決めていない、やること。${
        placed ? `このうち${placed}件は今日の案に入れています。` : ""}</p>${tipHere(rest.slice(0, 30))}</div>`;
    h += rest.length
      ? `<div class="stack">${rest.slice(0, 30).map(i => {
            const r = reasonOf(i.id);
            return itemHTML(i, { swipe: true, noKind: true, note: r ? "置けない理由：" + r : "" });
          }).join("")}${
          rest.length > 30 ? `<div class="card empty">ほか${rest.length - 30}件</div>` : ""}</div>`
      : `<div class="card empty">${placed ? "すべて今日の案に入れています。" : "ありません。"}</div>`;
  }

  /* --- 予定そのもの以外は、ここから下に畳んでおく --- */
  if (!demo) {
    const rv = reviewFor(key);
    const ahead = liveItems().filter(i => i.status === "open" && ["task", "event"].includes(i.kind) && i.dayKey && i.dayKey > key)
      .sort((a, b) => a.dayKey.localeCompare(b.dayKey));
    const hasReview = rv.done.length || rv.moved.length || rv.est.length || rv.dropped.length;

    if (ahead.length) {
      h += `<details class="allplan" style="margin-top:14px"><summary>この先の予定とタスク（${ahead.length}件）</summary>
        <p class="hint" style="margin:6px 0 8px">この日より先のものです。日付を送れば、その日の案が見られます。</p>
        <div class="stack">${ahead.slice(0, 20).map(i => itemHTML(i)).join("")}
        ${ahead.length > 20 ? `<div class="card empty">ほか${ahead.length - 20}件</div>` : ""}</div></details>`;
    }

    if (conds.length || hasReview) {
      h += `<details class="allplan" style="margin-top:10px"><summary>この日の記録（体調・振り返り）</summary>`;
      if (conds.length) {
        h += `<p class="hint" style="margin:8px 0 6px"><strong>体調（本人の言葉）</strong>　点数も診断も作りません。</p><div class="card stack">`;
        for (const c of conds) h += `<div class="quote">「${esc(c.selfReport)}」<span class="who">${fmtDT(c.reportedAt, tz)} の申告</span></div>`;
        h += `</div>`;
      }
      if (hasReview) {
        h += `<p class="hint" style="margin:12px 0 6px"><strong>振り返り</strong>　実際に起きたことだけです。間違えて押したものは、ここから戻せます。</p><div class="card stack">`;
        if (rv.done.length) h += `<div><b>終わったこと（${rv.done.length}件）</b><div class="stack" style="margin-top:5px">${rv.done.map(i =>
          `<div class="revrow"><span>${esc(i.title)}</span><button class="btn sm" data-act="undone" data-id="${i.id}">未完了に戻す</button></div>`).join("")}</div></div>`;
        if (rv.est.length) h += `<div><b>見積もりと実際のちがい</b><ul class="reasons" style="margin-top:4px">${rv.est.map(x => `<li>${esc(x.i.title)}：${esc(x.h.what)}</li>`).join("")}</ul></div>`;
        if (rv.moved.length) h += `<div><b>後ろに回したこと</b><ul class="reasons" style="margin-top:4px">${rv.moved.map(x => `<li>${esc(x.i.title)}：${esc(x.h.what)}</li>`).join("")}</ul></div>`;
        if (rv.dropped.length) h += `<div><b>やめたこと</b><div class="stack" style="margin-top:5px">${rv.dropped.map(x =>
          `<div class="revrow"><span>${esc(x.i.title)}</span>${x.i.status === "dropped" ? `<button class="btn sm" data-act="undrop" data-id="${x.i.id}">戻す</button>` : ""}</div>`).join("")}</div></div>`;
        h += `</div>`;
      }
      h += `</details>`;
    }
  }

  host.innerHTML = h;
}

function demoPlan() {
