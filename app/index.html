<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI秘書</title>
<style>
:root{
  color-scheme:light;
  --scrim:rgba(0,0,0,.38);
  --paper:#F2F2F7; --surface:#FFFFFF; --surface-2:#E5E5EA;
  --ink:#1C1C1E; --ink-2:#5F5F63; --ink-3:#8E8E93;
  --line:#D9D9DE; --line-strong:#C6C6C8;
  --accent:#0D6E6B; --accent-soft:#E2F2F0; --accent-ink:#0A4E4C;
  --warn:#FF9500; --warn-soft:#FFF1DF; --warn-ink:#8F5200;
  --done:#34C759; --done-soft:#E3F7E8; --done-ink:#1B7030;
  --alert:#FF3B30; --alert-soft:#FFEBE9; --alert-ink:#B3261E;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 6px 20px rgba(0,0,0,.06);
  --r:12px;
  /* **文字の大きさは rem で持つ**（2026-09-24・案⑥「端末の文字サイズに追従させる」）。
     px で書くと、端末やブラウザで既定の文字を大きくしている人に**何も効かない**。
     rem は根（html）の大きさに掛かるので、そこを大きくすれば全部が付いていく。
     **`html` に px の font-size を書かないこと**——書いた瞬間に追従が止まる。
     値は既定（16px）でこれまでと1pxも変わらない：11/12/13/15/17/20 と、入力欄の16。
     入力欄だけ別に持つのは、**16px を下回ると触れた瞬間に拡大する端末がある**ため
     （決まり15e の床）。段を増やさないこと。 */
  --fs-1:.6875rem; --fs-2:.75rem; --fs-3:.8125rem; --fs-4:.9375rem;
  --fs-5:1.0625rem; --fs-6:1.25rem; --fs-in:1rem;
  --f-disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Zen Kaku Gothic New","Noto Sans JP","Yu Gothic",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Roboto Mono","Noto Sans Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --scrim:rgba(0,0,0,.6);
  --paper:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E;
  --ink:#FFFFFF; --ink-2:#A1A1A6; --ink-3:#8E8E93;
  --line:#38383A; --line-strong:#48484A;
  --accent:#4FC3BC; --accent-soft:#14332F; --accent-ink:#8BDBD5;
  --warn:#FF9F0A; --warn-soft:#3A2A0C; --warn-ink:#FFB84D;
  --done:#30D158; --done-soft:#123A1C; --done-ink:#5BE07E;
  --alert:#FF453A; --alert-soft:#3A1614; --alert-ink:#FF8A80;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 20px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --scrim:rgba(0,0,0,.6);
  --paper:#000000; --surface:#1C1C1E; --surface-2:#2C2C2E;
  --ink:#FFFFFF; --ink-2:#A1A1A6; --ink-3:#8E8E93;
  --line:#38383A; --line-strong:#48484A;
  --accent:#4FC3BC; --accent-soft:#14332F; --accent-ink:#8BDBD5;
  --warn:#FF9F0A; --warn-soft:#3A2A0C; --warn-ink:#FFB84D;
  --done:#30D158; --done-soft:#123A1C; --done-ink:#5BE07E;
  --alert:#FF453A; --alert-soft:#3A1614; --alert-ink:#FF8A80;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 6px 20px rgba(0,0,0,.4);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--fs-4);line-height:1.75;
  -webkit-text-size-adjust:100%;overscroll-behavior-y:contain}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;line-height:1.35;margin:0;letter-spacing:-.02em;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0;
  user-select:none;-webkit-user-select:none;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:640px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 108px}
/* **アプリの名前と接続状態を、毎画面の一番上に出さない**（2026-09-26・本人の指示
   「完成版として公開できるよう…アプリの一番上のAI秘書や、この端末のみという表示はいらない」）。
   名前は端末のアプリ一覧に出ている。接続状態は、変わったときだけトーストで知らせる（`dbTrouble`）。
   見出しの帯を消したぶん、画面の一番上から内容が始まる。 */

.eyebrow{font-family:var(--f-disp);font-size:var(--fs-1);font-weight:700;letter-spacing:.16em;
  color:var(--ink-3);text-transform:uppercase}
.sect{margin:22px 0 0}
.sect>.eyebrow{display:block;margin-bottom:7px}
.sect>h2{font-size:var(--fs-6);margin-bottom:5px}
.hint{font-size:var(--fs-3);color:var(--ink-2);line-height:1.65}

.card{background:var(--surface);border:1px solid transparent;border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:var(--f-disp);font-weight:600;font-size:var(--fs-3);letter-spacing:-.01em;
  border:1px solid transparent;border-radius:10px;padding:9px 14px;background:var(--surface-2);
  color:var(--accent-ink);
  min-height:40px;transition:background .12s,opacity .12s}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
/* 押した手ごたえは :active で出す。:hover はマウスのある画面だけ——
   スマホでは押したあと hover が貼りついて、押しっぱなしに見える（v8.5） */
.btn:active{opacity:.55}
.btn.pri:active{filter:brightness(.9);opacity:1}
@media (hover:hover){.btn:hover{opacity:.7}.btn.pri:hover{filter:brightness(1.08)}}
.btn.sm{font-size:var(--fs-2);padding:5px 12px;min-height:32px;border-radius:999px}
/* 会話の時刻の横に添える「原文」。画面幅で大きさを変えるので、インライン style にしない */
.btn.sm.srcbtn{min-height:auto;padding:0 6px;font-size:var(--fs-1)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--alert-ink)}

textarea,input[type=text],input[type=date],input[type=time],input[type=number],
input[type=password],input[type=search],select{
  width:100%;background:var(--surface-2);border:1px solid transparent;border-radius:10px;
  padding:10px 11px;font-family:var(--f-body);font-size:var(--fs-in)}
textarea{min-height:170px;resize:vertical;line-height:1.8}
label.fld{display:block;font-size:var(--fs-1);font-weight:500;color:var(--ink-2);
  font-family:var(--f-disp);letter-spacing:.04em;margin-bottom:3px}

/* provenance chips — the core idea: every fact shows where it came from */
.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-disp);font-size:var(--fs-1);
  font-weight:500;letter-spacing:.03em;padding:1px 7px;border-radius:999px;border:1px solid var(--line-strong);
  color:var(--ink-2);background:transparent;white-space:nowrap;line-height:1.7}
.chip.src-user{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:700}
.chip.src-rule{border-color:var(--line-strong);color:var(--ink-2)}
/* 文字は --warn ではなく --warn-ink。明るいときに --warn × --warn-soft だと 4.24 しか出ない */
.chip.src-ai{border-style:dashed;border-color:var(--warn);color:var(--warn-ink);background:var(--warn-soft)}
.chip.st-done{background:var(--done-soft);border-color:var(--done);color:var(--done-ink)}
/* 取り消しの印は控えめでよいが、読めなくては意味がない（--ink-3 だと 2.98 しか出ない） */
.chip.st-drop{background:var(--surface-2);color:var(--ink-2)}
.chip.vague{background:var(--warn-soft);border-color:var(--warn);color:var(--warn-ink)}
.chip.fixed{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

/* **なぞって完了・明日へ**（2026-09-24・本人の指示・案A）。
   行に5個並んでいたボタンを、指の操作へ逃がす。**ボタンは消さない**——
   なぞる操作は見つけにくいので、知らない人が詰む（案Cの形をそのまま残す）。
   `touch-action:pan-y` が要る。これが無いと、縦スクロールまで奪う。
   色は「塗り・線」に使い、**文字は必ず `-ink`**（決まり15）。 */
.swipe{position:relative;overflow:hidden;border-radius:12px;margin-bottom:8px;touch-action:pan-y}
.swipe .item{margin-bottom:0;position:relative;z-index:1;
  transition:transform .18s cubic-bezier(.32,.72,0,1)}
.swipe.dragging .item{transition:none}
.swunder{position:absolute;top:0;bottom:0;left:0;right:0;display:flex;align-items:center;
  padding:0 15px;font-family:var(--f-disp);font-weight:700;font-size:var(--fs-4);opacity:.55}
.swunder.go{opacity:1}
.swunder.l{justify-content:flex-start;background:var(--done-soft);color:var(--done-ink);
  border-left:6px solid var(--done)}
.swunder.r{justify-content:flex-end;background:var(--warn-soft);color:var(--warn-ink);
  border-right:6px solid var(--warn)}

/* item rows */
.item{background:var(--surface);border:1px solid transparent;border-radius:var(--r);padding:11px 12px;
  display:flex;flex-direction:column;gap:7px}
.item.unconfirmed{border-color:var(--line-strong);border-style:dashed}
.item.isdone .ttl{text-decoration:line-through;color:var(--ink-3)}
.item .ttl{font-family:var(--f-disp);font-weight:500;font-size:var(--fs-4);line-height:1.5}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:var(--fs-2);color:var(--ink-2)}
.meta .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:var(--fs-2)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
/* 押すものが「…」だけの行（目標・メモ・要望）は、角へ置いて1行ぶん詰める（2026-09-26） */
.item.lonemore{position:relative;padding-right:60px}
.acts.corner{position:absolute;top:6px;right:6px;margin:0}

/* evidence */
.evid{font-size:var(--fs-3);color:var(--ink-2);background:var(--surface-2);border-radius:7px;
  padding:7px 9px;border-left:2px solid var(--line-strong)}
.evid mark{background:var(--accent-soft);color:var(--accent-ink);padding:0 2px;border-radius:2px}

/* timeline — 1本の時間軸の上に、長さに比例した枠が並ぶ。
   高さは JS では決めない。`--min`（分）だけ渡して、1分あたりの高さ（--tlscale）を
   CSS 側が持つ。こうすると画面の広さに合わせて縮尺だけを変えられる。
   空き時間も同じ縮尺で高さを持たせること。枠だけ比例して空きが1本の線だと、
   「30分の空き」と「3時間の空き」が同じに見えて、時間の感覚が崩れる。 */
:root{--tlscale:1.45px}
.tl{display:flex;flex-direction:column;gap:0;margin-top:6px;position:relative}
.tl::before{content:"";position:absolute;left:58px;top:8px;bottom:8px;width:1px;
  background:var(--line);pointer-events:none}
.tlrow{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:stretch}
.tltime{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:var(--fs-2);color:var(--ink-2);
  padding-top:11px;text-align:right;white-space:nowrap}
.blk{border-radius:12px;padding:10px 12px;margin-bottom:5px;display:flex;flex-direction:column;gap:6px;
  min-height:max(calc(var(--min,30) * var(--tlscale)), 42px)}
.blk.fixed{background:var(--accent-soft);border:1px solid var(--accent);border-left-width:4px}
.blk.flex{background:var(--surface);border:1px solid var(--line);border-left:4px dashed var(--line-strong)}
.blk.now{box-shadow:0 0 0 2px var(--accent)}
/* 休憩・予備は枠にしない。細い帯にして、短さがそのまま見えるようにする */
.blk.thin{border-radius:10px;padding:0 11px;justify-content:center;gap:0;
  min-height:max(calc(var(--min,10) * var(--tlscale)), 22px)}
.blk.thin .bhead{gap:8px}
.blk.thin .bttl{font-size:var(--fs-3);font-weight:400;color:var(--ink-2)}
.blk.thin .bdur{font-size:var(--fs-1)}
/* 空き時間。長さのぶんだけ本当に空ける */
.tlrow.gaprow{align-items:stretch}
.tlrow.gaprow .tltime{padding-top:0;align-self:center}
.gapline{display:flex;align-items:center;margin:4px 0 5px;padding-left:2px;
  border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
  min-height:max(calc(var(--min,20) * var(--tlscale)), 26px)}
.gapline span{font-family:var(--f-mono);font-size:var(--fs-1);color:var(--ink-3)}
.blk .bttl{font-family:var(--f-disp);font-weight:500;font-size:var(--fs-4);line-height:1.45}
.blk .brange{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:var(--fs-2);color:var(--ink-2)}

/* 見出しの行だけを常に見せ、理由と操作はたたんでおく */
.bhead{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;padding:0;
  font:inherit;color:inherit;cursor:pointer}
.blk.thin .bhead{cursor:default}
.bhead .bttl{flex:1;min-width:0}
/* 「どれくらいかかるか」は枠の高さで感じ取るものだが、数字も読めるようにしておく */
.bhead .bdur{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:var(--fs-2);
  font-weight:500;color:var(--ink-2);white-space:nowrap}
.bdetail{display:none;flex-direction:column;gap:6px;margin-top:7px;
  padding-top:7px;border-top:1px solid var(--line)}
.tlrow.open .bdetail{display:flex}
.blk.past{opacity:.5}
.blk.past .bttl{text-decoration:none}
/* AIが読み取ったもの。本人が決めたものと見分けるための最小の印 */
.bdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--warn);
  margin-right:7px;vertical-align:middle;flex:none}
/* いま進行中の枠。赤い線を消した代わりに、この印が「いま」を引き受ける */
.nowtag{flex:none;align-self:center;font-family:var(--f-disp);font-size:var(--fs-1);font-weight:700;
  letter-spacing:.06em;color:var(--paper);background:var(--accent);border-radius:999px;padding:2px 8px;line-height:1.4}
/* いまの枠は、囲みを**足さずに**枠そのものの色を変える。
   外側に輪を重ねると、固定予定（青い枠）の上に赤い枠が乗って二重に見える（本人からの報告）。
   実線／破線はそのまま残るので、固定か動かせるかの区別は消えない。 */
.blk.running{border-color:var(--alert);box-shadow:none}
.blk.running.past{opacity:1}
/* いまの位置（空いている時間にいるときだけ引く） */
/* **D：アイコンと同じ「時間軸の上の丸」**（2026-09-26・本人の指示「全て取り入れて」）。
   アイコン（一日のタイムライン）は、縦の線の上に丸があり、その横に長さの違う枠が並ぶ。
   予定表も同じ顔にする。**色は今までの決まりのまま**（決まり6f「色を使うのは動かさない予定だけ」）：
   固定＝accent の塗り／動かせる作業＝灰色の輪／休憩・予備・移動＝小さな灰色の点／いま＝赤。 */
.tlrow{position:relative}
.tlrow.b::before{content:"";position:absolute;left:54px;top:14px;width:9px;height:9px;border-radius:50%;
  box-sizing:border-box;background:var(--surface);border:2px solid var(--line-strong);z-index:1;pointer-events:none}
.tlrow.b.d-fix::before{background:var(--accent);border-color:var(--accent)}
.tlrow.b.d-thin::before{width:5px;height:5px;left:56px;top:calc(50% - 5px);border:none;background:var(--line-strong)}
.tlrow.b.d-run::before{background:var(--alert);border-color:var(--alert)}
.tlrow.b.d-past::before{opacity:.45}
.tlrow.nowline{align-items:center;margin:2px 0 6px}
.tlrow.nowline .tltime{padding-top:0;color:var(--alert-ink);font-weight:600}
.tlrow.nowline>div:last-child{position:relative;height:1px;background:var(--alert)}
.tlrow.nowline span{position:absolute;left:0;top:-8px;background:var(--paper);padding-right:7px;
  font-family:var(--f-disp);font-size:var(--fs-1);font-weight:700;color:var(--alert-ink);letter-spacing:.06em}

.next{background:var(--surface);border:1px solid var(--accent);border-radius:var(--r);
  border-top:3px solid var(--accent);padding:13px 14px;display:flex;flex-direction:column;gap:8px}
.next .nt{font-family:var(--f-disp);font-weight:700;font-size:var(--fs-5);line-height:1.45}
.next .nr{font-size:var(--fs-3);color:var(--ink-2);line-height:1.7}
/* B：前に本人が言ったことを、置いた理由として1行だけ（「今日中にと言っていたので前倒しです」） */
.next .nw,.nowcard .ncw{font-size:var(--fs-2);color:var(--accent-ink);line-height:1.6}

/* **C：開いた瞬間の「次はこれだけ」**（2026-09-26）。会話のいちばん下（入力欄のすぐ上）に1枚だけ。
   保存しない——開くたびに、いまの予定表から作る（決まり1「現在状態は保存しない」）。
   形はアイコンと同じ：左に時間軸の丸、右に中身。 */
.nowcard{display:grid;grid-template-columns:14px 1fr;gap:10px;background:var(--surface);border-radius:var(--r);
  padding:13px 14px;margin-top:10px}
.nowcard .ncdot{width:10px;height:10px;border-radius:50%;background:var(--accent);margin-top:6px;justify-self:center}
.nowcard.fin .ncdot{background:var(--done)}
.nowcard .ncbody{display:flex;flex-direction:column;gap:4px;min-width:0}
.nowcard .nct{font-family:var(--f-disp);font-weight:700;font-size:var(--fs-5);line-height:1.45}
.nowcard .ncr{font-size:var(--fs-3);color:var(--ink-2)}
.nowcard .ncdone{font-size:var(--fs-3);color:var(--done-ink)}
.nowcard ul{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.nowcard li{font-size:var(--fs-3);padding-left:18px;position:relative}
.nowcard li::before{content:"✓";position:absolute;left:0;color:var(--done-ink);font-weight:700}
.nowcard .row{margin-top:6px}

/* **A：完了したとき、消える前に「済んだ」が見える**（2026-09-26）。
   前は押した瞬間に行が消えるだけで、うまくいった手ごたえが無かった。
   0.4秒だけ緑に光ってから横へ抜ける。動きを減らす設定の端末では動かさない（下の規則が止める）。 */
.celebrate{animation:donepop .42s ease forwards;pointer-events:none}
.celebrate .blk,.celebrate .item,.celebrate.item{background:var(--done-soft)!important;border-color:var(--done)!important}
@keyframes donepop{0%{transform:none;opacity:1}35%{transform:scale(1.015);opacity:1}100%{transform:translateX(22px);opacity:0}}
.reasons{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px}
.reasons li{font-size:var(--fs-3);color:var(--ink-2);padding-left:14px;position:relative;line-height:1.65}
.reasons li::before{content:"—";position:absolute;left:0;color:var(--ink-3)}

.note{border-radius:8px;padding:9px 11px;font-size:var(--fs-3);line-height:1.7}
.note.warn{background:var(--warn-soft);color:var(--warn-ink)}
.note.info{background:var(--surface-2);color:var(--ink-2)}
.note.bad{background:var(--alert-soft);color:var(--alert-ink)}
.note strong{font-weight:700}

.quote{border-left:3px solid var(--line-strong);padding:4px 0 4px 11px;font-size:var(--fs-3);color:var(--ink)}
.quote .who{display:block;font-size:var(--fs-1);color:var(--ink-3);font-family:var(--f-mono);margin-top:3px}

/* 下までたどっても「どの日の予定か」を見失わないよう、画面の上端に貼り付ける。
   前は見出しの帯の下に貼っていたので `fitTopbar()` が帯の実寸を測っていたが、
   帯を外したので（2026-09-26）測るものが無くなった。上端の切り欠きだけ避ける。 */
.datebar{display:flex;align-items:center;gap:8px;
  position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);padding:6px 0 7px}
.datebar .d{font-family:var(--f-disp);font-weight:700;font-size:var(--fs-5);flex:1}
.datebar .d .dow{font-size:var(--fs-2);color:var(--ink-2);font-weight:500;margin-left:5px}
/* 日付を飛ぶ入口（v4.3）。日付の表示は左のラベルが受け持っているので、
   入力欄そのものは見せない。小さなボタンの上に、透明なまま重ねて置く。 */
.pickwrap{position:relative;display:inline-block;line-height:0}
.pickwrap input[type=date]{position:absolute;inset:0;width:100%;height:100%;
  opacity:0;border:0;padding:0;margin:0;min-height:0;cursor:pointer}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  background:color-mix(in srgb, var(--surface) 80%, transparent);
  -webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom,0px));
  display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 2px;border-radius:8px;
  font-family:var(--f-disp);font-size:var(--fs-1);font-weight:500;color:var(--ink-3);min-height:46px;justify-content:center}
nav.tabs button .ic{display:block;line-height:0}
nav.tabs button .ic svg{width:1.5rem;height:1.5rem;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"] .ic svg{stroke-width:2.2}
nav.tabs button[aria-current="page"]{color:var(--accent-ink);font-weight:700}
nav.tabs button:active{opacity:.5}
@media (min-width:720px){
  nav.tabs{max-width:520px;margin:0 auto 14px;border:1px solid var(--line);border-radius:999px;
    padding:5px;box-shadow:var(--shadow)}
  nav.tabs button{border-radius:999px}
  .wrap{padding-bottom:120px}
}
.panel[hidden]{display:none!important}

/* sheet — 下端のシステムUIにタップを取られないよう、タブバーより上で終える */
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes sheetin{from{transform:translateY(16px);opacity:.4}to{transform:none;opacity:1}}
.sheet{position:fixed;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;
  justify-content:center;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px));
  animation:fadein .16s ease-out}
.sheet .inner{background:var(--surface);width:100%;max-width:640px;max-height:78vh;max-height:78dvh;overflow-y:auto;
  overscroll-behavior:contain;animation:sheetin .22s cubic-bezier(.32,.72,0,1);
  border-radius:16px;padding:10px 15px 14px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 -6px 28px var(--scrim)}
.sheet .foot{position:sticky;bottom:-14px;background:var(--surface);padding:10px 0 4px;margin-top:2px;
  border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet .foot .wide{flex:1 1 100%;justify-content:center;margin-left:0!important}
@media (min-width:720px){.sheet{align-items:center;padding-bottom:0}.sheet .inner{max-height:84vh;max-height:84dvh}}
/* シートが開いている間、後ろの画面を動かさない（v4.3）。
   動くと、閉じたときに全然ちがう場所に戻っていて、どこを見ていたか分からなくなる。 */
body.sheetopen{overflow:hidden}
/* iOS のシートの「つまみ」。下へ引いて閉じられる形だと分かる目印 */
.sheet .inner::before{content:"";flex:none;align-self:center;width:36px;height:5px;
  border-radius:3px;background:var(--line-strong);margin:0 0 4px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);z-index:70;pointer-events:none;
  animation:fadein .14s ease-out;
  bottom:calc(126px + env(safe-area-inset-bottom,0px));
  background:var(--ink);color:var(--paper);font-family:var(--f-disp);font-size:var(--fs-3);font-weight:500;
  padding:9px 15px;border-radius:18px;box-shadow:var(--shadow);text-align:center;
  /* **幅を自分で決めること**（2026-09-24・実機で報告）。`left:50%` だけだと、
     幅の自動計算は**残りの 50vw** までしか使えない（実測：500px の窓で 250px）。
     そこへ「元に戻す」が入ると文字の取り分が 127px しか残らず、
     **「完了にし／ました：／資料を作／る」と4行に折れた**。`max-width:92vw` は
     50vw より広いので、**一度も効いていなかった**。
     角丸を 999px にしないのは決まり15d と同じ理由——`border-radius` は**高さの半分まで育つ**ので、
     折り返すほど大きな楕円になる（写真の形で 31.8px）。**その形では文字までは食っていない**が
     （食い込み 3.9px ＜ 左余白 15px）、見出しの長い用事なら本当に食う
     （実測：200字で角丸 122.8px・食い込み 55px）。18px は1行のとき（34px）にカプセルに見える値。 */
  width:max-content;max-width:min(92vw,440px)}
/* **`hidden` を付けたら、本当に消えること**（2026-09-25・測って見つけた）。
   `[hidden]` の既定は `display:none` だが、**クラス側で `display` を書くと負ける**。
   実際、設定タブの「最後に起きた不具合」は `.card{display:flex}` に打ち消されて、
   **不具合が1件も無いのに 214px ずっと出ていた**（実測）。
   トーストだけ `!important` で守ってあったが、**そこから漏れていた**——
   決まり7e の「同じことをする道が2つあって、片方だけ守られている」そのもの。
   1か所にまとめる。以後 `hidden` を付けた要素は、必ず消える。 */
[hidden]{display:none!important}
/* **消したら、その場で戻せること**（2026-09-24・本人の指示）。
   いままで戻す道は折りたたみの「振り返り」の中にしか無く、**押し間違いが怖かった**。
   怖いままだと行のボタンを減らせないので、**先にここを直す**（案C→案A の順）。
   色は `--ink` / `--paper` の組で作る——トーストの地は明暗で**反転する**
   （明るいとき黒地・暗いとき白地）ので、accent を置くとどちらかで読めなくなる。 */
#toast.hasundo{display:flex;align-items:center;gap:13px;text-align:left}
#toast .tmsg{min-width:0}   /* 折り返してよいのはこちら。無いと flex が縮めてくれない */
#toast .tundo{flex:none;pointer-events:auto;background:var(--paper);color:var(--ink);
  border-radius:999px;padding:0 13px;min-height:34px;display:inline-flex;align-items:center;
  font-family:var(--f-disp);font-size:var(--fs-3);font-weight:700;white-space:nowrap}
#toast .tundo:active{opacity:.6}
.sheet h3{font-size:var(--fs-5)}
/* カードの中の小見出し。インライン style で大きさを書かないこと（画面幅で変えられなくなる） */
.cardttl{font-size:var(--fs-4)}
.errta{min-height:70px;font-family:var(--f-mono)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:var(--fs-1);color:var(--ink-2);align-items:center}
.legend i{display:inline-block;width:16px;height:0;border-top-width:4px;margin-right:4px;vertical-align:middle}
.legend .lf{border-top:4px solid var(--accent)}
.legend .lx{border-top:4px dashed var(--line-strong)}
.legend .ld{width:7px;height:7px;border-radius:50%;background:var(--warn);border:0}
.empty{text-align:center;color:var(--ink-3);font-size:var(--fs-3);padding:18px 10px;line-height:1.8}
/* **空の欄からも始められること**（2026-09-24・案③）。「ありません。」で終わると、
   次に何をすればいいかが画面に無い。ただし**近くに同じ操作があるなら足さない**
   （1画面に同じものを2回出さない）。実測で足りていなかったのは、
   「わたしのこと」の2か所だけだった。 */
.empty .btn{margin-top:11px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- 狭い画面（スマホ）向けの詰め ---- */
@media (max-width:430px){
  .wrap{padding-left:12px;padding-right:12px}
  /* 時刻の欄を詰めて、予定の中身に幅を回す */
  .tlrow{grid-template-columns:44px 1fr;gap:8px}
  .tl::before{left:48px}
  .tlrow.b::before{left:45px;width:7px;height:7px;top:15px}
  .tlrow.b.d-thin::before{left:46px;width:5px;height:5px;top:calc(50% - 5px)}
  .tltime{font-size:var(--fs-1)}
  /* 縮尺だけを下げる。比例は崩さない（1時間 ≈ 78px） */
  :root{--tlscale:1.3px}
  .blk{padding:9px 11px}
  /* 横は詰めて1行に収め、縦は指で押せる高さを確保する */
  /* **押しどころは44px**（2026-09-24・本人の指示・案E）。
     iOS は44pt、Android は48dp を最小にしている。ここは36pxで**8px足りなかった**。
     **行のボタンを3つに減らしてから上げること**（案C→案E の順）——
     5個並んだままで高くすると、指で押せるより先に1行へ収まらなくなる。
     横の padding は詰めたまま。広げると、こんどは横がはみ出す。 */
  /* **幅も44px**。◀ ▶ や「…」は文字が短いので、高さだけ上げると
     **縦長の細い的**になる（実測で36px幅だった）。指は丸いので、両方が要る。 */
  .btn.sm{padding:9px 11px;min-height:44px;min-width:44px;border-radius:999px}
  .btn{min-height:44px}
  /* 会話の時刻に添える「原文」だけは別。本文の邪魔をしない大きさで置く（決まり15e） */
  .btn.sm.srcbtn{padding:4px 8px;min-height:26px;min-width:auto}
  .acts{gap:5px}
  /* たたんである枠は、見出しだけでなく枠全体を押せるようにする */
  .tlrow .bhead{min-height:28px}
  .tlrow:not(.open) .bhead{flex:1}
  .legend{gap:9px}
  .eyebrow{letter-spacing:.12em}
  section>h2{font-size:var(--fs-5)}
  .kinds{grid-template-columns:1fr 1fr;gap:7px}
  .bub{max-width:90%}
  /* 16px を下回ると、入力欄に触れた瞬間に画面が拡大される端末がある */
  .saybar textarea{font-size:var(--fs-in)}
  .turn .extra{max-width:94%}
  .miniplan td{padding:5px 8px}
  .sheet .inner{padding:14px 13px 12px}
}

/* ---- 会話 ---- */
.chathead{display:flex;align-items:center;gap:9px;padding:6px 0 2px}
.chat{display:flex;flex-direction:column;gap:14px;padding:6px 0 4px}
.turn{display:flex;flex-direction:column;gap:6px;max-width:100%}
.turn.me{align-items:flex-end}
.bub{border-radius:13px;padding:9px 12px;max-width:86%;white-space:pre-wrap;line-height:1.75;font-size:var(--fs-4)}
.turn.me .bub{background:var(--accent);color:var(--paper);border-bottom-right-radius:5px}
.turn.ai .bub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.turn .stamp{font-family:var(--f-mono);font-size:var(--fs-1);color:var(--ink-3);padding:0 4px}
.turn.thinking .bub{color:var(--ink-3);letter-spacing:.3em;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}
@media (prefers-reduced-motion:reduce){.turn.thinking .bub{animation:none}}
#reading{color:var(--ink-3);font-size:var(--fs-1)}
/* 「…」で開くシート。**押しどころは48px**——ここは指で押す前提の場所なので、
   行の小さいボタンと同じ大きさにしない（案D・案Eの考え方）。 */
.morelist .btn{width:100%;min-height:48px;justify-content:flex-start;
  padding-left:16px;font-size:var(--fs-4);border-radius:12px}
.turn .extra{width:100%;max-width:86%;display:flex;flex-direction:column;gap:7px}

.changes{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;
  background:var(--surface);padding:8px 10px;font-size:var(--fs-3);display:flex;flex-direction:column;gap:3px}
.changes .eyebrow{margin-bottom:2px}
.changes b{font-weight:700}
.changes .none{color:var(--ink-3)}

.miniplan{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.miniplan .mh{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);
  font-family:var(--f-disp);font-size:var(--fs-2);font-weight:700}
.miniplan table{width:100%;border-collapse:collapse;font-size:var(--fs-3)}
.miniplan td{padding:5px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.miniplan tr:last-child td{border-bottom:none}
.miniplan td.t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap;width:1%}
.miniplan tr.fx td.n{font-weight:700}
.miniplan tr.br td,.miniplan tr.bf td{color:var(--ink-3)}
.miniplan .why{display:block;font-size:var(--fs-1);color:var(--ink-3);margin-top:1px}

.saybar{position:fixed;left:0;right:0;z-index:45;background:var(--paper);border-top:1px solid var(--line);
  padding:8px 14px 4px;display:none;bottom:calc(58px + env(safe-area-inset-bottom,0px))}
body.talking .saybar{display:block}
.saybar-in{max-width:640px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
/* **角丸をカプセル（999px）にしないこと**（2026-09-21・実機で報告）。
   `border-radius` は高さの半分まで育つので、欄が150pxまで伸びると角丸が75pxになり、
   **1行目と最終行の左右の文字が丸みに食われる**（実測：左から21.9px 食い込み、
   文字が始まる13pxより内側）。1行のとき（44px）にカプセルに見える固定値にする。
   こうすると伸びても角丸は22pxのままで、どの行にも食い込まない。 */
.saybar textarea{min-height:42px;max-height:150px;resize:none;line-height:1.6;padding:9px 14px;
  background:var(--surface);border:1px solid var(--line);border-radius:22px;
  scrollbar-width:none;-ms-overflow-style:none}
.saybar textarea::-webkit-scrollbar{display:none;width:0;height:0}
/* **上へ流れた文字があることを、隠さない**（2026-09-21・実機で報告）。
   欄は150pxで頭打ちなので、長く打つと先頭が見えなくなる。
   つまみまで消していると、**上に続きがあること自体が分からない**。
   はみ出しているときだけ出す（ふだんは今までどおり隠す）。 */
.saybar textarea.more{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.saybar textarea.more::-webkit-scrollbar{display:block;width:4px}
.saybar textarea.more::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:2px}
.sendbtn{min-width:42px;min-height:42px;border-radius:999px;font-size:var(--fs-5);padding:0}
.saybar-note{max-width:640px;margin:2px auto 0;font-size:var(--fs-1);color:var(--ink-3);min-height:15px}
/* いま聞いている質問を、入力欄のすぐ上に出す（まだ聞けていないことを埋めるため）。
   `#sayNote` は入力のたびに書き換わるので、そこに置くと打った瞬間に消える。別の場所にする。 */
.saybar-ask{max-width:640px;margin:0 auto 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:7px 10px;
  font-size:var(--fs-3);line-height:1.6;color:var(--ink-2)}
.saybar-ask .q{flex:1 1 180px}
/* **下の余白を固定値にしないこと**（2026-09-21・実機で報告）。
   入力欄が伸びると入力バーも伸びるが、ここが 190px 固定だったので
   **会話の末尾が入力バーの裏に 63px 隠れていた**（実測）。
   バーの実際の高さを `--saybar` で受け取る（`fitSaybar()` が入れる）。
   既定値は1行のときのおおよその高さ——JSが動く前でも破綻しないように。 */
body.talking .wrap{padding-bottom:calc(var(--saybar, 100px) + 58px + env(safe-area-inset-bottom,0px) + 18px)}
@media (min-width:720px){
  .saybar{bottom:calc(74px + env(safe-area-inset-bottom,0px))}
  body.talking .wrap{padding-bottom:calc(var(--saybar, 100px) + 74px + env(safe-area-inset-bottom,0px) + 22px)}
}

/* 移動・準備・休憩・予備。どれも灰色で、主役にしない */
.blk.travel,.blk.prep{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--ink-3)}
.blk.brk{background:var(--surface-2);border:1px solid var(--line);border-left:4px solid var(--line-strong)}
.blk.buf{background:transparent;border:1px dashed var(--line);border-left:4px dashed var(--line-strong)}
.blk.brk .bttl,.blk.buf .bttl{color:var(--ink-2);font-weight:500}
/* 折りたたみは**カードと同じ顔**にする（2026-09-26）。前は細い枠線・角丸8px・高さ32pxで、
   カード（枠線なし・12px）と並ぶと別の部品に見えた。高さ32pxは**押しどころの44pxを割っていた**。
   開閉の印は iOS と同じく右端の山形（▸▾ の文字は Android で字形がばらつく）。 */
details.allplan{border:1px solid transparent;border-radius:var(--r);background:var(--surface);padding:0 14px}
details.allplan[open]{padding-bottom:12px}
details.allplan>summary{cursor:pointer;font-family:var(--f-disp);font-size:var(--fs-4);font-weight:500;list-style:none;
  display:flex;align-items:center;gap:8px;min-height:44px}
details.allplan>summary:active{opacity:.55}
details.allplan>summary::-webkit-details-marker{display:none}
details.allplan>summary::after{content:"";flex:none;margin-left:auto;width:7px;height:7px;
  border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(-45deg);
  transition:transform .15s}
details.allplan[open]>summary::after{transform:rotate(45deg)}
details.unconf{border-color:var(--warn);background:var(--warn-soft)}
details.unconf>summary{color:var(--warn-ink)}
.revrow{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:var(--fs-3);
  padding:4px 0;border-bottom:1px solid var(--line)}
.revrow:last-child{border-bottom:none}
.revrow>span{flex:1;min-width:0}

/* わたしのこと */
.catgroup{display:flex;flex-direction:column;gap:8px}
.qlist{padding:0 14px}
.qrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qrow>div{flex:1;min-width:0;font-size:var(--fs-4);line-height:1.5}
.qrow>.btn{flex:none}
.cathead{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.cathead h3{font-size:var(--fs-3);font-weight:700;font-family:var(--f-disp)}
.cathead .n{font-family:var(--f-mono);font-size:var(--fs-1);color:var(--ink-3)}
.doccard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;display:flex;flex-direction:column;gap:7px}
.doccard .dtitle{font-family:var(--f-disp);font-weight:700;font-size:var(--fs-4)}
.doccard .dpeek{font-size:var(--fs-2);color:var(--ink-2);background:var(--surface-2);border-radius:7px;
  padding:7px 9px;max-height:86px;overflow:hidden;position:relative;white-space:pre-wrap;line-height:1.7}
.doccard .dpeek::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26px;
  background:linear-gradient(to bottom,transparent,var(--surface-2))}
.bar{height:5px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .25s}
.tiny{font-size:var(--fs-1);color:var(--ink-3);font-family:var(--f-mono)}
</style>

<div class="wrap">

<!-- ============ 話す ============ -->
<section class="panel" id="p-chat">
  <div class="chathead">
    <span class="hint" id="chatDay"></span>
    <button class="btn sm" id="btnChatMenu" style="margin-left:auto">…</button>
  </div>
  <div id="chatOut" class="chat"></div>
</section>

<!-- ============ 今日 ============ -->
<section class="panel" id="p-day">
  <div class="datebar sect" style="margin-top:6px">
    <button class="btn sm" id="dPrev" aria-label="前の日">◀</button>
    <span class="d" id="dLabel"></span>

<script>
"use strict";
/* =======================================================================
   AI秘書 v1.8
   原文(notes) / 抽出(items) / 訂正(history) を分けて保存する個人プランナー
   ======================================================================= */

/* 会話タブの「例を入れてみる」。整理していない話し方をそのまま試すための文。 */
const SAMPLE_TALK = `おはよう。昨日寝たのがたぶん1時半くらいで、今日起きたのが8時。ちょっと眠い。朝ごはんはまだ食べてない。今日はあんまり予定を詰めすぎないでほしい。
昨日言ってた資料を作らないと。明日までに相手に送るやつ。1時間くらいでできると思ってたけど、調べることもあるからもうちょっとかかるかも。できれば午前中に進めたい。
あと、友達にAIの構想を送ろうと思ってたんだった。これは今日絶対じゃないけど、忘れないようにしておいて。`;

/* ---------- small utils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const uid = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8);
const norm = s => String(s || "").replace(/\s+/g, "").replace(/[、。．，!！?？]/g, "").toLowerCase();
function hash(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const pad2 = n => String(n).padStart(2, "0");
/* 全角の数字・記号を半角にそろえる。日本語入力では「午後５時」のように全角数字が普通に出る。
   1文字→1文字なので文字数が変わらず、根拠（evidence）の位置はずれない。 */
const halfWidth = s => String(s == null ? "" : s)
  .replace(/[！-～]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
  .replace(/　/g, " ");

/* ---------- timezone-aware clock ----------
   All "今日/明日/来週" resolution happens in the configured zone,
   relative to the note's own capture time — never the render time. */
function tzOffMin(d, tz) {
  const f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hour12: false, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const p = {}; for (const x of f.formatToParts(d)) p[x.type] = x.value;
  const asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
  return (asUTC - d.getTime()) / 60000;
}
function zoned(y, mo, d, h, mi, tz) {
  const guess = Date.UTC(y, mo - 1, d, h, mi, 0);
  let off = tzOffMin(new Date(guess), tz);
  off = tzOffMin(new Date(guess - off * 60000), tz);
  return new Date(guess - off * 60000);
}
/* 保存された日付が壊れていても、画面全体を落とさない（v4.1）。
   1件の不正な値で `Intl` が例外を投げ、タブがまるごと白くなることがあった。
   壊れた1件は無視して、残りは見せる。 */
const validISO = s => { if (!s) return false; const t = new Date(s).getTime(); return !Number.isNaN(t); };
function parts(dt, tz) {
  if (!dt || Number.isNaN(new Date(dt).getTime())) dt = new Date();   // 壊れた値は「いま」として扱う
  const f = new Intl.DateTimeFormat("en-US", { timeZone: tz, hour12: false, weekday: "short", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  const p = {}; for (const x of f.formatToParts(dt)) p[x.type] = x.value;
  const dowMap = { Sun:0, Mon:1, Tue:2, Wed:3, Thu:4, Fri:5, Sat:6 };
  return { y:+p.year, mo:+p.month, d:+p.day, h:(+p.hour)%24, mi:+p.minute, dow: dowMap[p.weekday] };
}
const dayKey = (dt, tz) => { const p = parts(dt, tz); return `${p.y}-${pad2(p.mo)}-${pad2(p.d)}`; };
const keyToDate = (k, tz) => { const [y,m,d] = k.split("-").map(Number); return zoned(y, m, d, 0, 0, tz); };
const DOW_JA = ["日","月","火","水","木","金","土"];
function fmtDay(k, tz) {
  const dt = keyToDate(k, tz), p = parts(dt, tz);
  return `${p.mo}月${p.d}日<span class="dow">(${DOW_JA[p.dow]})</span>`;
}
function fmtDayPlain(k, tz) {
  const p = parts(keyToDate(k, tz), tz);
  const today = dayKey(new Date(), tz);
  const diff = Math.round((keyToDate(k, tz) - keyToDate(today, tz)) / 86400000);
  const rel = diff === 0 ? "今日" : diff === 1 ? "明日" : diff === 2 ? "あさって" : diff === -1 ? "昨日" : null;
  return `${p.mo}/${p.d}(${DOW_JA[p.dow]})${rel ? "＝" + rel : ""}`;
}
function fmtDT(iso, tz) {
  if (!validISO(iso)) return "";
  const p = parts(new Date(iso), tz);
  return `${p.mo}/${pad2(p.d)} ${pad2(p.h)}:${pad2(p.mi)}`;
}
const minOfDay = (iso, tz) => { const p = parts(new Date(iso), tz); return p.h * 60 + p.mi; };
const hhmm = m => `${pad2(Math.floor(m / 60) % 24)}:${pad2(m % 60)}`;
function durJa(m) { if (m == null) return ""; const h = Math.floor(m / 60), r = m % 60; return (h ? h + "時間" : "") + (r ? r + "分" : (h ? "" : "0分")); }

/* =======================================================================
   日本語の日付・時刻・所要時間の読み取り（ルール）
   ・「来週」のように曜日まで言っていないものは日付を確定させない
   ======================================================================= */
const WD = { "日":0,"月":1,"火":2,"水":3,"木":4,"金":5,"土":6 };

function parseWhen(rawText, baseISO, tz) {
  const text = halfWidth(rawText);
  const base = new Date(baseISO), bp = parts(base, tz);
  // --- time of day ---
  let tH = null, tM = 0, tSpan = null, vagueTime = null;
  let pmShift = 0;        // 午後側（＋12時間）に寄せたか。範囲の終わりにも同じだけ効かせる
  let bareHour = false;   // 午前とも午後とも言われていない 1〜11時
  // [:：時] のあとに「間」が続くものは所要時間（3時間）であって時刻ではない
  const tr = text.match(/(午前|午後|朝|昼|夕方|夜|晩)?\s*(\d{1,2})\s*[:：時](?!間)\s*(\d{1,2})?\s*分?(半)?/);
  if (tr) {
    let h = +tr[2]; const mm = tr[3] != null ? +tr[3] : (tr[4] ? 30 : 0);
    if ((tr[1] === "午後" || tr[1] === "夜" || tr[1] === "晩" || tr[1] === "夕方") && h < 12) { h += 12; pmShift = 12; }
    if (tr[1] === "朝" && h === 12) h = 0;
    bareHour = !tr[1] && h >= 1 && h <= 11;
    if (h <= 23 && mm <= 59) { tH = h; tM = mm; tSpan = [tr.index, tr.index + tr[0].length]; }
  }
  if (tH == null) {
    const vm = text.match(/(午前中|朝|昼|昼過ぎ|午後|夕方|夜|晩)/);
    if (vm) vagueTime = vm[1];
  }
  if (/正午/.test(text) && tH == null) tH = 12;

  /* 日付表現は「最初に見つかったもの」ではなく、候補を全部集めてから選ぶ。
     「昨日言ってた資料を明日までに送る」の期限は、昨日ではなく明日だから。 */
  const cands = [];
  const grab = (re, fn) => { const m = text.match(re); if (!m) return; const o = fn(m); if (o) cands.push(Object.assign({ span: [m.index, m.index + m[0].length] }, o)); };

  grab(/(一昨日|おととい)/, () => ({ off: -2, prec: "day" }));
  grab(/(昨日|きのう)/, () => ({ off: -1, prec: "day" }));
  grab(/(明後日|あさって)/, () => ({ off: 2, prec: "day" }));
  grab(/(明日|あした|あす)/, () => ({ off: 1, prec: "day" }));
  grab(/(今日|本日|きょう)/, () => ({ off: 0, prec: "day" }));

  grab(/(今週|来週|再来週|次の週)?\s*の?\s*([日月火水木金土])\s*曜日?/, m => {
    const wk = m[1] === "来週" || m[1] === "次の週" ? 1 : m[1] === "再来週" ? 2 : 0;
    const curIdx = (bp.dow + 6) % 7, tgtIdx = (WD[m[2]] + 6) % 7;
    let off = tgtIdx - curIdx + wk * 7;
    if (!m[1] && off < 0) off += 7;           // 「金曜」だけなら次の金曜
    return { off, prec: "day" };
  });

  grab(/(今週末|週末|来週末|今週|来週|再来週|今月末|月末|今月中|今日中|今年中)/, m => {
    const curIdx = (bp.dow + 6) % 7, w = m[1];
    if (w === "今日中") return { off: 0, prec: "day" };
    if (w === "今週末" || w === "週末") return { off: 5 - curIdx >= 0 ? 5 - curIdx : 12 - curIdx, prec: "week", spanDays: 1 };
    if (w === "来週末") return { off: 12 - curIdx, prec: "week", spanDays: 1 };
    if (w === "今週") return { off: 6 - curIdx, prec: "week", spanDays: 6 - curIdx };
    if (w === "来週") return { off: 13 - curIdx, prec: "week", spanDays: 6 };
    if (w === "再来週") return { off: 20 - curIdx, prec: "week", spanDays: 6 };
    if (w === "今月末" || w === "月末") return { abs: dayKey(new Date(zoned(bp.y, bp.mo + 1, 0, 12, 0, tz)), tz), prec: "day" };
    if (w === "今月中") return { abs: dayKey(new Date(zoned(bp.y, bp.mo + 1, 0, 12, 0, tz)), tz), prec: "week" };
    if (w === "今年中") return { abs: `${bp.y}-12-31`, prec: "week" };
    return null;
  });

  // 「12月25日」「12/25」。長いほうが優先されるので、下の「5日」とぶつからない。
  grab(/(\d{1,2})\s*[月\/]\s*(\d{1,2})\s*日?/, m => {
    const mo = +m[1], d = +m[2];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    let y = bp.y;
    if ((zoned(y, mo, d, 12, 0, tz) - base) / 86400000 < -180) y += 1;   // だいぶ前なら来年
    return { abs: dayKey(new Date(zoned(y, mo, d, 12, 0, tz)), tz), prec: "day" };
  });

  // 「来月の5日」「今月の20日」「5日に」。月が言われていなければ今月、過ぎていれば来月。
  /* 「来月の5日」「今月の20日」「5日に」。月が言われていなければ今月、過ぎていれば来月。
     **その月に無い日は繰り上がらせない**（v4.1）。2月10日の「31日」を素直に作ると
     JS が 3月3日に繰り上げる。日が一致しない月は飛ばして、31日のある次の月にする。 */
  const dayInMonth = (mOff, d) => {
    for (let k = 0; k < 14; k++) {
      const dt = new Date(zoned(bp.y, bp.mo + mOff + k, d, 12, 0, tz));
      if (parts(dt, tz).d === d) return dayKey(dt, tz);        // 繰り上がっていない月だけ採る
    }
    return null;
  };
  grab(/(今月|来月|再来月|来々月)?\s*の?\s*(\d{1,2})\s*日(?!間|以|くらい|ほど)/, m => {
    const d = +m[2];
    if (d < 1 || d > 31) return null;
    const mOff = m[1] === "来月" ? 1 : (m[1] === "再来月" || m[1] === "来々月") ? 2 : 0;
    let key = dayInMonth(mOff, d);
    if (!key) return null;
    if (!m[1] && key < dayKey(base, tz)) key = dayInMonth(1, d) || key;
    return { abs: key, prec: "day" };
  });

  const baseKey = dayKey(base, tz);
  // 選び方：①「まで／中に」が直後にある＝期限を指している ②過去より未来 ③文の前にあるもの
  let out = null, span = null;
  if (cands.length) {
    const kept = cands.filter(c => !cands.some(o => o !== c && o.span[0] <= c.span[0] && c.span[1] <= o.span[1] && (o.span[1] - o.span[0]) > (c.span[1] - c.span[0])));
    const score = c => {
      let s = -c.span[0] * 0.01;
      if (/^(まで(に)?|中に|までには)/.test(text.slice(c.span[1], c.span[1] + 5))) s += 100;
      const future = c.abs ? c.abs >= baseKey : c.off >= 0;
      s += future ? 40 : -60;
      return s;
    };
    kept.sort((a, b) => score(b) - score(a));
    out = kept[0]; span = out.span;
  }

  if (!out) {
    // time given with no date at all → treat as the note's own day
    if (tH != null) { out = { off: 0, prec: "day", timeOnly: true }; span = tSpan; }
    else return null;
  }

  /* 午前・午後も日付も言われていない「10時」は、12時間のどちらか分からない。
     いちばん近い「これから来る10時」を選ぶ。
     13時や21時に「10時から11時まで勉強する」と言えば、それは今夜の22時〜23時。
     どちらも過ぎていれば（23時半に「10時」）翌日の同じ時刻にする。
     日付を言われているとき（明日10時）は触らない。決めつけない。 */
  let dayShift = 0, altWhen = null;   // altWhen＝もう一方の読み方。聞き返すために持っておく
  if (bareHour && out.timeOnly && tH != null) {
    const at = (dd, hh) => zoned(bp.y, bp.mo, bp.d + dd, hh, tM, tz).getTime();
    const now = base.getTime();
    if (at(0, tH) < now) {
      // 言われたままの時刻が既に過ぎている＝どちらとも取れる。選ぶが、もう一方も覚えておく
      if (at(0, tH + 12) >= now) { altWhen = { h: tH, dd: 1 }; tH += 12; pmShift = 12; }
      else { dayShift = 1; altWhen = { h: tH + 12, dd: 1 }; }
    }
  }

  /* 日付は言われていても、午前か午後かは言われていない（v4.3）。
     「明日1時から2時まで勉強する」は、ふつう13時〜14時のこと。深夜1時ではない
     （実機で深夜1時と読み、速い返事が「明日の深夜に」と言った）。
     1〜5時は午後（13〜17時）と読む。6時はどちらとも取れるので、午前のまま置く。
     7〜11時は触らない——「明日9時」で毎回聞き返すのは、うるさいだけ。
     どちらの場合も、選ばなかったほうを返して聞き返す。黙って確定させない（決まり2）。 */
  let altShiftMin = 0;                 // もう一方の読み方は、選んだ時刻の ±12時間
  if (bareHour && !out.timeOnly && tH != null) {
    if (tH >= 1 && tH <= 5) { tH += 12; pmShift = 12; altShiftMin = -720; }
    else if (tH === 6) { altShiftMin = 720; }
  }

  // resolve to an instant
  let key;
  if (out.abs) key = out.abs;
  else key = dayKey(new Date(zoned(bp.y, bp.mo, bp.d + out.off + dayShift, 12, 0, tz)), tz);

  const [ky, km, kd] = key.split("-").map(Number);
  const hasTime = tH != null;
  const when = zoned(ky, km, kd, hasTime ? tH : 23, hasTime ? tM : 59, tz).toISOString();

  const isDeadline = /まで(に)?|締切|〆切|提出|期限/.test(text);
  const res = {
    iso: when, dayKey: key,
    precision: out.prec === "week" ? "week" : (hasTime ? "exact" : "day"),
    hasTime, vagueTime, isDeadline,
    // 日付の言葉がまったく無かった（時刻だけ）。AIが日付を足していないかの判定に使う
    timeOnly: !!out.timeOnly,
    rangeDays: out.spanDays || 0,
    span: span || tSpan
  };

  // explicit 「N時からM時まで」 range → an event
  /* 範囲の**両側**に、午前・午後の言葉が付くことがある（v4.3）。
     「夜11時から深夜1時までゼミ」は、から のあとに「深夜」が挟まるので、
     以前の正規表現では範囲として拾えず、終わりが1時間の仮置きになっていた。 */
  const PERIOD = "(午前|午後|朝|昼|夕方|夜|晩|深夜|夜中)?";
  /* 左側の「時」は省かれる（「6〜9時」「6-9時」「6から9時」）。実機でこう書かれた。
     右側には必ず「時」か「:」が要るので、「3から5個」のような数え方には当たらない。 */
  let rr = text.match(new RegExp(
    PERIOD + "\\s*(\\d{1,2})\\s*(?:[:：時](?!間)(\\d{1,2})?\\s*分?(半)?)?\\s*(から|〜|～|-|–)\\s*"
    + PERIOD + "\\s*(\\d{1,2})\\s*[:：時](?!間)(\\d{1,2})?\\s*分?(半)?"));
  /* **終わりの「時」を省いた言い方**（「8時から10まで」）も読む（v8.6・実機で報告）。
     左の「時」は前から省略できたのに、右だけ必須で**非対称**だった。そのせいで
     「5時から7時まで勉強して8時から10まで予定を埋めて」の**後半がまるごと消えた**（実測）。
     **ただし左に「時」か「:」があるときだけ**許すこと。両方省けるようにすると
     「3から5個」「5から7まで」（ページ数・個数）まで時刻になる。
     さらに右の数字の直後に「まで」を求める——`(?=…まで)` は読まないので、
     見出しから時刻を落とすときに「まで」が残り、既存の助詞の掃除がそれを片付ける。
     捕まえる組は上と同じ並びにしておく（分と「半」は無いので 8・9 は undefined）。 */
  if (!rr) rr = text.match(new RegExp(
    PERIOD + "\\s*(\\d{1,2})\\s*[:：時](?!間)(\\d{1,2})?\\s*分?(半)?\\s*(から|〜|～|-|–)\\s*"
    + PERIOD + "\\s*(\\d{1,2})\\s*(?=\\s*まで)"));
  if (rr) {
    let h1 = +rr[2], h2 = +rr[7];
    const m1 = rr[3] ? +rr[3] : (rr[4] ? 30 : 0), m2 = rr[8] ? +rr[8] : (rr[9] ? 30 : 0);
    // 「午後」がこの正規表現の外にあるときは、開始側をずらしたぶんを終わりにも効かせる。
    // これが無いと「午後10時から11時まで」が 10:00〜11:00 になる。
    // 「深夜」「夜中」は 12 を足さない（1時は1時）。日をまたぐぶんは下の終わり側で解く。
    const PM = /^(午後|夜|晩|夕方)$/;
    if (PM.test(rr[1] || "")) { if (h1 < 12) h1 += 12; }
    else if (pmShift && h1 < 12) h1 += 12;
    if (PM.test(rr[6] || "")) { if (h2 < 12) h2 += 12; }
    else if (!rr[6] && pmShift && h2 < 12) h2 += 12;
    if (h1 <= 23 && h2 <= 23) {
      res.start = zoned(ky, km, kd, h1, m1, tz).toISOString();
      /* 終わりが始まりより前なら、まず午後（＋12時間）で解けるか見る。
         解けないなら**日をまたいでいる**（v4.3）。
         ここで一律に ＋12 すると「23時から1時まで」が 23:00〜13:00 の14時間になる。 */
      const sMs = new Date(res.start).getTime();
      let endAt = zoned(ky, km, kd, h2, m2, tz);
      if (endAt.getTime() <= sMs) {
        /* `h2 + 12` が **24**（＝翌日の0:00）になる場合も許すこと（v5.3・実機で報告）。
           `<= 23` で切っていたので、夜に「11時から12時まで」と言うと終わりだけ
           午後シフトから漏れ、**翌日の12:00＝13時間**の枠になっていた。
           `zoned` は 24時をそのまま翌日0:00として扱う。 */
        const pm = zoned(ky, km, kd, h2 + 12, m2, tz);
        endAt = (h2 + 12 <= 24 && pm.getTime() > sMs) ? pm : zoned(ky, km, kd + 1, h2, m2, tz);
      }
      res.end = endAt.toISOString();
      res.precision = "exact"; res.hasTime = true;
      /* 日付の言葉が無いときは、**範囲ぜんぶ**を「時刻の言葉」として覚える（v4.6）。
         時刻ひとつ（「9時」）だけを覚えていると、見出しを掃除したときに
         「6〜」が取り残される（実機で「6〜 勉強する」になった）。 */
      if (span === tSpan) res.span = [rr.index, rr.index + rr[0].length];
    }
  } else if (hasTime) {
    res.start = when;
  }

  /* 午前とも午後とも読める時刻だった。選んだほうと、もう一方を両方返す。
     どちらか決めるのは本人。こちらは黙って確定させない（決まり2）。 */
  if (altWhen && res.start) {
    const aStart = zoned(bp.y, bp.mo, bp.d + altWhen.dd, altWhen.h, tM, tz);
    res.altStart = aStart.toISOString();
    res.altDayKey = dayKey(aStart, tz);
    if (res.end) {
      const span = new Date(res.end) - new Date(res.start);       // 長さはそのまま持ち越す
      res.altEnd = new Date(aStart.getTime() + span).toISOString();
    }
  }
  /* 何日も続く予定（v4.3）。「14日から16日まで旅行」「明日から3日間、出張」。
     1日目しか出ないと、残りの日が空いている扱いのままになり、そこへ作業が積まれる。 */
  {
    const spanM = text.match(/(\d{1,2})\s*日\s*(?:から|〜|～|-|–)\s*(\d{1,2})\s*日(?:\s*まで)?/);
    const daysM = text.match(/(\d{1,3})\s*日間/);
    if (spanM) {
      const e = dayInMonth(0, +spanM[2]);
      if (e && e >= key) res.spanEndKey = e;
    } else if (daysM) {
      const n = clamp(+daysM[1], 1, 60);
      if (n > 1) res.spanEndKey = dayKey(new Date(keyToDate(key, tz).getTime() + (n - 1) * 86400000), tz);
    }
  }

  /* 日付つきの裸の時刻。もう一方は同じ日の ±12時間。範囲なら終わりも同じだけ動かす
     （「明日1時から2時」の裏は「明日13時から14時」ではなく「明日1時から2時」側）。 */
  if (altShiftMin && res.start) {
    const a = new Date(new Date(res.start).getTime() + altShiftMin * 60000);
    res.altStart = a.toISOString();
    res.altDayKey = dayKey(a, tz);
    if (res.end) res.altEnd = new Date(new Date(res.end).getTime() + altShiftMin * 60000).toISOString();
  }

  /* 「6時から9時の**間に** 30分 勉強する」（v4.5）。
     これは3時間の予定ではない。**その3時間のどこかで30分**という意味。
     範囲のあとに「の間に」が続いていたら、予定ではなく**置いてよい時間帯**として返す。
     ここを見落とすと、18:00〜21:00 の3時間がまるごと固定予定になる（実際そうなっていた）。 */
  if (res.start && res.end && /(の)?\s*(間|あいだ)\s*(に|で)/.test(text.slice((rr && rr.index != null ? rr.index + rr[0].length : 0)))) {
    res.between = { from: minOfDay(res.start, tz), to: minOfDay(res.end, tz) };
    if (res.between.to <= res.between.from) res.between = null;
  }
  return res;
}

/* 所要時間は 1分〜24時間に収める（v4.1）。
   「999時間かかる」で 59,940分、「0分」で 0分 がそのまま入っていた。
   0分は幅ゼロの枠を作り、巨大な値は毎日「入りきらない」と言い続ける。 */
function parseDuration(rawText) {
  const text = halfWidth(rawText);
  const cap = v => clamp(Math.round(v), 1, 1440);
  let m = text.match(/(\d+)\s*時間\s*(半|(\d+)\s*分)?/);
  if (m) { let v = +m[1] * 60; if (m[2] === "半") v += 30; else if (m[3]) v += +m[3]; return cap(v); }
  m = text.match(/(\d+)\s*分(くらい|ほど|程度)?/);
  if (m) return cap(+m[1]);
  if (/半日/.test(text)) return 240;
  return null;
}

/* =======================================================================
   文 → 項目（ルール抽出）
   ======================================================================= */
const RE_TASK  = /(ないといけない|なければならない|なきゃいけない|しなきゃ|しないと|ないとまずい|ねばならない|必要がある|todo|やること|タスク|忘れてた|忘れずに|忘れないように)/i;
/* 意志形（送ろう・やろう）も動詞として拾う。話し言葉ではこちらの方が多い。 */
const RE_VERB  = /(する|しよ|やる|やら|やり|やろ|作る|作ら|作り|作ろ|書く|書か|書き|書け|書こ|送る|送ら|送り|送ろ|送信|出す|出さ|出し|出そ|提出|買う|買わ|買い|買お|予約|準備|連絡|返信|読む|読ま|読み|読も|確認|申し込|片付け|まとめ|調べ|練習|掃除|洗濯|支払|登録|予習|復習|行く|行か|行こ|会う|会い|会お|電話|メール)/;
const RE_EVENT = /(会議|ミーティング|打ち合わせ|打合せ|面談|商談|授業|講義|ゼミ|アポ|診察|受診|通院|歯医者|歯科|病院|クリニック|健診|検診|予防接種|整体|接骨|整骨|リハビリ|カウンセリング|美容院|美容室|床屋|理容|面接|試験|ライブ|試合|出発|集合|飲み会|説明会|発表|銀行|役所|郵便局|ジム|レッスン|教習|面会|デート|内見|引っ越し|納品|搬入|出社|登校|健康診断|人間ドック|定期健診|説明|授与|式)/;
/* 時刻が言われていて「〜に行く／向かう／予約」なら、単語リストに無くても固定の予定として扱う。
   「明日の5時に○○に行く」が予定にならないのは、秘書として使い物にならないため。 */
const RE_GOTO  = /([にへ])\s*(行く|行き|いく|向かう|向かい|寄る|寄り|入る|集合|到着)|(予約(が|を|は|し)|アポ|待ち合わせ)/;
/* 食事は言い方がばらばらで（ご飯・昼飯・ランチ…）、ひらがなが多いので語句として拾えない。
   専用に見て、スケジュールには「昼食を食べる」のように揃えた名前で入れる。
   本人が実際に言った言葉は evidence に残るので、「根拠」を開けば元の言い方が読める。 */
const RE_MEAL = /(朝ごはん|朝ご飯|朝食|モーニング|昼ごはん|昼ご飯|昼食|昼飯|お昼|ランチ|夜ごはん|夜ご飯|夕飯|夕食|晩ごはん|晩ご飯|晩飯|ディナー|ご飯|ごはん|ごはん|食事|飯)/;
/* 食べる／行く だけでなく、作る・買う・頼むなど「その食事にまつわる行動」も含める。
   「夜ごはんは家で作る」「昼は買ってくる」も、予定としては同じ一食。 */
const RE_EAT  = /(食べ|たべ|食う|食っ|いただ|済ませ|すませ|してくる|しよう|行く|行こう|とる|取る|にする|にしよう|にしま|作る|作ろ|つくる|買う|買っ|頼む|頼も|注文|用意|準備)/;
const RE_MEAL_DONE = /(食べた|たべた|食べました|食べ終わ|済ませた|すませた|食ってきた|食べてきた|食べちゃった)/;

/* いつの食事か。言葉で分かればそれを使い、分からなければ話した時刻で決める。 */
function mealTitle(rawS, atISO, tz) {
  const s = halfWidth(rawS);
  if (!RE_MEAL.test(s) || !RE_EAT.test(s)) return null;
  if (RE_MEAL_DONE.test(s)) return null;              // 「食べた」は報告。用事ではない
  if (/(朝ごはん|朝ご飯|朝食|モーニング)/.test(s)) return "朝食を食べる";
  if (/(昼ごはん|昼ご飯|昼食|昼飯|お昼|ランチ)/.test(s)) return "昼食を食べる";
  if (/(夜ごはん|夜ご飯|夕飯|夕食|晩ごはん|晩ご飯|晩飯|ディナー)/.test(s)) return "夕食を食べる";
  const h = parts(new Date(atISO), tz).h;             // 「ご飯食べに行く」——話した時刻で決める
  if (h < 10) return "朝食を食べる";
  if (h < 15) return "昼食を食べる";
  if (h < 22) return "夕食を食べる";
  return "食事をとる";
}

/* 「移動に30分かかる」は用事ではなく、その予定に付く移動時間。
   タスクにも、予定の所要時間にもしない。 */
const RE_TRAVEL = /(移動|片道|行き|現地まで|会場まで|駅まで)[^。]{0,8}?(\d+)\s*(分|時間)/;
/* くり返しの予定（v4.3）。
   「毎週月曜10時からゼミ」が1回きりの予定になり、見出しに「毎週」が残るだけだった。
   次の月曜には出てこない——秘書がいちばん覚えておくべき予定が、全部これだった。
   **項目は1件のまま。** 日ごとに増やさず、`planFor` がその日のぶんを組み立てる。 */
const DOW_IDX = { "日": 0, "月": 1, "火": 2, "水": 3, "木": 4, "金": 5, "土": 6 };
function parseRepeat(rawText) {
  const t = halfWidth(rawText);
  let m;
  if ((m = t.match(/毎週\s*(?:の)?\s*([日月火水木金土])曜?/))) return { kind: "weekly", dow: DOW_IDX[m[1]] };
  if ((m = t.match(/毎月\s*(?:の)?\s*(\d{1,2})\s*日/))) { const d = +m[1]; return (d >= 1 && d <= 31) ? { kind: "monthly", dom: d } : null; }
  if (/隔週/.test(t)) return { kind: "biweekly" };
  if (/(毎日|まいにち|毎朝|毎晩|毎夜)/.test(t)) return { kind: "daily" };
  if (/平日(は|に|毎日)/.test(t)) return { kind: "weekday" };
  if (/毎週/.test(t)) return { kind: "weekly" };        // 曜日は最初の1回から取る
  return null;
}
function repeatJa(r) {
  if (!r) return "";
  if (r.kind === "daily") return "毎日";
  if (r.kind === "weekday") return "平日";
  if (r.kind === "biweekly") return "隔週";
  if (r.kind === "weekly") return "毎週" + (r.dow != null ? "日月火水木金土"[r.dow] : "");
  if (r.kind === "monthly") return "毎月" + (r.dom != null ? r.dom + "日" : "");
  return "";
}
/* その日にくり返しが当たるか。項目は増やさないので、ここだけが「その日の有無」を決める。 */
function occursOn(it, key, tz) {
  const r = it && it.repeat;
  if (!r) return false;
  if (it.dayKey && key < it.dayKey) return false;                 // 始まる前
  if ((it.doneDays || []).includes(key)) return false;            // その日は終わっている
  if ((it.skipDays || []).includes(key)) return false;            // その日はやらないと言われた
  const p = parts(keyToDate(key, tz), tz);
  const first = validISO(it.start) ? parts(new Date(it.start), tz) : (it.dayKey ? parts(keyToDate(it.dayKey, tz), tz) : null);
  if (r.kind === "daily") return true;
  if (r.kind === "weekday") return p.dow >= 1 && p.dow <= 5;
  if (r.kind === "weekly") return p.dow === (r.dow != null ? r.dow : (first ? first.dow : -1));
  if (r.kind === "monthly") return p.d === (r.dom != null ? r.dom : (first ? first.d : -1));
  if (r.kind === "biweekly") return it.dayKey
    ? Math.round((keyToDate(key, tz) - keyToDate(it.dayKey, tz)) / 86400000) % 14 === 0 : false;
  return false;
}
function parseTravel(s) {
  const m = halfWidth(s).match(RE_TRAVEL);
  if (!m) return null;
  const v = +m[2] * (m[3] === "時間" ? 60 : 1);
  return v > 0 && v <= 300 ? v : null;
}

/* 「自分がこれをやらないといけない」という言い方。予定か自分のタスクかを分けるのに使う。 */
/* 「やること」は入れない。「次にやることが一つ分かる方が楽」のような、
   タスクではない文まで自分の用事として拾ってしまうため。 */
const RE_SELFTASK = /[さかがらわばまなたちりえけせてねへめれ]ないと|ないといけない|なきゃ|なければ|ねばならない|必要がある|忘れ(ないよう|ずに|てた)|todo|とらないと|取らないと/i;

/* 「ずっと変わらないこと」だけを拾う。その日の状態は拾わない。
   ルールは自信のあるものだけに絞る。文章の資料からの抽出はAIの仕事。 */
const RE_PROFILE = /((が|は)\s*(苦手|得意|好き|嫌い|苦手だ|得意だ))|(昔から|ずっと|いつも|普段|たいてい|基本的に|性格的に|どちらかというと)/;
const RE_PROFILE_SELF = /(自分は|私は|僕は|俺は|自分って|自分の場合)/;
const RE_PROFILE_TREND = /(しがち|傾向がある|タイプ|性格|こだわり|主義|ポリシー|向いてない|向いていない|向いている|癖がある|になりやすい|やすい方|ほうが楽|方が楽)/;
/* 今日のことを言っているなら、それは「わたしのこと」ではない */
const RE_TODAYISH = /(今日|今|昨日|明日|今週|来週|さっき|いま|今朝|今夜|今回)/;

function profileCategory(s) {
  if (/(苦手|嫌い|できない|無理|向いてない|向いていない|制約|アレルギー|禁止)/.test(s)) return "苦手・制約";
  if (/(好き|好み|派|寄り|が良い|がいい|食べ|味|音楽|映画|服)/.test(s)) return "好み";
  if (/(仕事|職場|会社|研究|勉強|学校|大学|授業|職種|業界)/.test(s)) return "仕事・勉強";
  if (/(体|身体|睡眠|寝|腰|肩|持病|薬|花粉|運動|走|筋|健康|食事制限)/.test(s)) return "体のこと";
  if (/(大事|大切|優先|価値|信じ|ポリシー|主義)/.test(s)) return "大事にしていること";
  if (/(性格|傾向|しがち|タイプ|癖|集中|気分|落ち込|焦|怒)/.test(s)) return "性格・傾向";
  return "その他";
}

/* 会話の一文から「ずっと変わらないこと」を拾う（保守的） */
/* **「朝のほうが集中できるタイプ。」を体調にしない**（2026-09-26・「わたしのこと」の見直しで実測）。
   前は「自分は〜」が無いと傾向の言葉（タイプ・しがち…）を拾わず、「集中でき」に RE_COND が当たって
   **体調として**記録されていた——その日かぎりの話として扱われ、翌日には効かない。
   **文の終わりが傾向の言葉**のときだけ拾う。「Aタイプの資料を作る」のように途中にあるものは用事のまま。 */
const RE_PROFILE_END = /(タイプ|体質|性格|しがち|傾向がある|癖がある|になりやすい)(だ|です|なんだ|なんです|みたい|らしい)?(よね|ね|な)?[。！!…\s]*$/;
function looksDurable(s) {
  if (RE_TODAYISH.test(s)) return false;
  if (RE_PROFILE.test(s)) return true;
  if (RE_PROFILE_END.test(s)) return true;
  if (RE_PROFILE_SELF.test(s) && RE_PROFILE_TREND.test(s)) return true;
  return false;
}
const RE_GOAL  = /(目標|目指|なりたい|続けたい|習慣|毎日|週\d回|ようにしたい|していきたい)/;
const RE_COND  = /(疲れ|眠(い|く|れ)|だる|体調|調子|寝(て|た|られ)|睡眠|頭痛|元気|集中(でき|が)|しんどい|回復|風邪|むくみ|食欲)/;
/* **体の不調の言い方**（2026-09-26・本人の指示）。「頭痛」は拾えるのに「頭が痛い」が拾えず、
   「今日は少し頭が痛い。」を言っても**何も記録されなかった**。
   ただし「頭が痛いから病院に行かないと」は用事なので、自分に課す言い方・「〜に行く」があるときは
   体調にしない（体調にすると、用事が消える）。 */
const RE_PAIN = /((頭|あたま|お腹|おなか|腹|胃|腰|肩|首|背中|喉|のど|歯|目|耳|足|膝|ひざ|関節|生理)(が|も|は)?\s*(少し|ちょっと|すごく|かなり|ずっと)?\s*(痛|いた)|腹痛|胃痛|腰痛|歯痛|生理痛|肩こり|肩が凝|熱が(ある|出|高)|熱っぽ|微熱|発熱|吐き気|気持ち悪|寒気|めまい|咳が|鼻水|鼻づまり|くしゃみ|頭が重|体が重|具合が悪|気分が悪|胃もたれ)/;
const RE_DONE  = /(した$|しました|終わった|終わりました|終わり[。、]?$|終了[。、]?$|済んだ|済み[。、]?$|できた|やった$)/;

/* 行＝ひとつの話題、として扱う。話し言葉では「〜やる。15分くらい。」のように
   所要時間や日付が次の文に分かれるため、行全体から日時と所要時間を拾う。 */
function splitLines(text) {
  const out = []; let base = 0;
  for (const raw of text.split(/\r?\n/)) {
    const s = raw.trim();
    if (s.length >= 2) {
      const rel = raw.indexOf(s), st = base + (rel < 0 ? 0 : rel);
      const sentences = []; let off = 0;
      for (const c of s.split(/(?<=[。！？!?])/)) {
        const q = c.trim();
        if (q.length >= 2) { const r = c.indexOf(q); sentences.push({ text: q, start: st + off + (r < 0 ? 0 : r), end: st + off + (r < 0 ? 0 : r) + q.length }); }
        off += c.length;
      }
      out.push({ text: s, start: st, end: st + s.length, sentences: sentences.length ? sentences : [{ text: s, start: st, end: st + s.length }] });
    }
    base += raw.length + 1;
  }
  return out;
}

const MODAL_STEM = { "さ":"す", "か":"く", "が":"ぐ", "ら":"る", "わ":"う", "ば":"ぶ", "ま":"む", "な":"ぬ", "た":"つ", "ち":"つ", "り":"る", "い":"る" };
function deModal(t) {
  return t
    .replace(/(しなきゃいけない|しなければならない|しないといけない|しなきゃ|しないと)/g, "する")
    .replace(/([さかがらわばまなたちり])ないと(いけない|ダメ|まずい)?/g, (m, c) => MODAL_STEM[c] || "")
    .replace(/([えけせてねへめれべげぜでじび])ないと(いけない|ダメ|まずい)?/g, "$1る")   // まとめないと → まとめる
    .replace(/(なきゃいけない|なければならない|ないといけない|なきゃ|ないと)/g, "")
    .replace(/(忘れてた|忘れずに|忘れないように|のを忘れてた)/g, "");
}
/* 日時・所要時間を取り除いた跡地に残る助詞（「までに」「は」）も一緒に落として、
   読める見出しにする。取り除いた位置を記号で印して、その周りだけを削る。 */
/* **印そのものをファイルに直接書かない**（v8.0・公開時の警告で見つけた）。
   ここに生の NUL を1文字置いていたので、公開されたページでは **U+FFFD に化けていた**
   （たまたま同じ1文字として働いていたので気づかなかった）。`grep` にも
   「バイナリファイル」と言われ続ける。**手元と公開で中身が変わる書き方をしない。** */
const CUT = "\u0000";
/* 日付のあとに続く言葉（「来週あたり」「今週中に」）と、そのあとの助詞まで落とす。
   「14時からの打ち合わせ」のように助詞が2つ続くので、最後の「の」も見る。 */
const RE_CUT_PARTICLE = new RegExp(
  CUT + "[\\s、,]*(?:あたり|ごろ|頃)?[\\s、,]*(?:までの間に|までのあいだに|までの間で|の間に|の間で|のあいだに|間に|中までに|中まで|中に|までに|まで|から|は|が|に|を|で|の|と|も)?の?", "g");
/* くり返しの言い方（v4.3）。これを落とさないと、見出しが「毎週 ゼミ」のまま残り、
   1回きりの予定なのか毎週なのか、画面から読み取れなくなる。 */
const RE_REPEAT_WORD = /(毎週\s*(?:の)?\s*[日月火水木金土]曜?日?|毎月\s*(?:の)?\s*\d{1,2}\s*日|隔週(?:で)?|毎週|毎月|毎日|まいにち|毎朝|毎晩|毎夜|平日(?:は|に|毎日)?)/g;
/* 時間帯の言い方は1か所にまとめる（決まり7e）。
   **読み取る側（`parseIntent`）と、見出しから落とす側（`cleanTitle`）で同じものを使う。**
   長い言い方から並べること——「午前中」より先に「午前」を試すと「中」が取り残される。 */
const RE_WIN_MORNING   = /(午前中|午前|朝のうち|朝に)/;
const RE_WIN_AFTERNOON = /(午後|昼過ぎ|昼から)/;
const RE_WIN_EVENING   = /(夕方以降|夕方|夜に|晩に)/;
const RE_CUT_WINDOW = new RegExp(
  "(?:" + [RE_WIN_MORNING, RE_WIN_AFTERNOON, RE_WIN_EVENING]
    .map(r => r.source.replace(/^\(|\)$/g, "")).join("|") + ")(?:には|には|に|は|から)?", "g");

/* `opts.keepHabit`＝目標の見出し（2026-09-26・本人の指示）。「毎日30分は歩きたい」の
   **「毎日」「30分」は目標の中身そのもの**で、予定の飾りではない。予定なら「毎日」は
   くり返しの印（`repeat`）に、「30分」は所要時間に移るので落としてよいが、
   目標にはその入れ物が無い——落とすと「歩きたい」だけが残り、何を続けたいのか消える。 */
function cleanTitle(s, when, opts) {
  const keepHabit = !!(opts && opts.keepHabit);
  let t = s;
  if (when && when.span) t = t.slice(0, when.span[0]) + CUT + t.slice(when.span[1]);
  if (!keepHabit) t = t.replace(RE_REPEAT_WORD, CUT);
  /* 時間帯の希望も見出しから落とす（v4.4）。項目には「午前中に」の印が別に出るので、
     見出しに残すと「午前中に研究計画書を書く」と二度書くことになる。
     **読み取る側（`parseIntent`）と同じ言い方を使うこと**（決まり7e・2026-09-21）。
     ここだけ3語しか書いていなかったので、**「午前中」は落ちるのに
     「夕方」「午後」は見出しに残っていた**（実測）。片方だけ直される、いつもの形。 */
  t = t.replace(RE_CUT_WINDOW, CUT);
  // AM/PM も時刻の一部。落とさないと見出しが「AM 集合」になる
  const AMPM = "(午前|午後|朝|昼|夕方|夜|晩|深夜|夜中|[AaPp][Mm])?";
  // 左の「時」は省かれることがある（「6〜9時の間に」）。見出しに「6〜」が残らないように
  t = t.replace(new RegExp(AMPM + "\\s*\\d{1,2}\\s*(?:[:：時](?!間)\\s*\\d{0,2}\\s*分?半?)?\\s*(から|〜|～|-|–)\\s*" + AMPM + "\\s*\\d{1,2}\\s*[:：時](?!間)\\s*\\d{0,2}\\s*分?半?", "g"), CUT);
  t = t.replace(new RegExp(AMPM + "\\s*\\d{1,2}\\s*[:：時](?!間)\\s*\\d{0,2}\\s*分?半?", "g"), CUT);
  if (!keepHabit) t = t.replace(/(\d+\s*時間\s*半?(\d+\s*分)?|\d+\s*分)(くらい|ほど|程度)?/g, CUT);
  t = deModal(t);
  /* **落とした跡を、空白でつながない**（v6.2・実機で報告）。
     「お風呂に30分入る」の所要時間を落とすと「お風呂に 入る」になっていた。
     元の文に区切りが無かったのだから、見出しにも区切りは要らない。
     ただし **英数字が隣にいるときは空白を残す**——「AM9時に集合」で語がくっつくのを防ぐため。
     元の文に空白があったときも残る（空白は ASCII なので、下の判定で「隣は英数字」になる）。 */
  const jp = c => !!c && !/[\x00-\x7F]/.test(c);
  t = t.replace(RE_CUT_PARTICLE, (m, off, str) =>
    (jp(str[off - 1]) && jp(str[off + m.length])) ? "" : " ");
  t = t.split(CUT).join(" ");
  // 時刻を消したあとに、ぽつんと残る AM / PM（「AM9時に集合」→「AM 集合」だった）
  t = t.replace(/(^|\s)[AaPp][Mm](?=\s|$)/g, " ");
  // 話し言葉の前置き。日付を取り除いたあとに出てくることが多いのでここで落とす。
  t = t.replace(/^[\s、,]*(えーと|えっと|あの|そういえば|あと|それと|あ、|うーん|まあ|言ってた|言っていた|話してた|話していた)[、,\s]*/g, "");
  t = t.replace(/^[\s、,]*(えーと|えっと|あと|それと|言ってた|言っていた)[、,\s]*/, "");
  t = t.replace(/^[\s、。,\.]+/, "").replace(/[\s、。,\.！？!?]+$/, "");
  for (let i = 0; i < 2; i++) {
    // 「なんだ」は「んだ」より先に置く（「タイプなんだよね」→「タイプ」）
    /* 「して」はここで落とさない（v8.6）。落とすと「勉強して」が**「勉強」**で止まり、
       ほかの見出し（「勉強する」）と形がそろわない。`normalizeEnding` が言い切りに直す。
       「にして」（「14時にして」）は今までどおり落とす。 */
    t = t.replace(/(と思ってたんだった|と思っていたんだった|と思ってた|と思っていた|んだった|のだった|くらい|ぐらい|ほど|かかる|かかりそう|かかりそ|と思う|かな|よね|ね|なんだ|んだ|んです|のを|の|にして|だった|やっぱり|やはり|は)$/, "");
    t = t.replace(/[\s、。,\.]+$/, "");
  }
  t = t.replace(/\s+/g, " ").trim();
  // 読点のあとの「あとで」「そのうち」も見出しに残さない（判定から外すものと同じ一覧・決まり7e）。
  // 続けたいことでは「、30分」が中身なので外さない（決まり3d）。
  if (!keepHabit) t = stripTail(t);
  t = normalizeEnding(t);
  if (t.length > 60) t = t.slice(0, 58) + "…";
  return t || s.replace(/[。！？!?]+$/, "").slice(0, 40);
}

/* 「勉強しよう」→「勉強する」。**語尾をそろえるだけで、言い換えではない。**
   中身の語（`contentWords`）は変わらないので、あとの照合（「勉強終わった」）は外れない。
   ここはAIにやらせないこと。同じ発言が日によって違う見出しになると
   `dedupeKey` が揺れて、同じ用事が二重に入る（決まり7c の理由そのもの）。
   「出そう」は推量（「雨が降りそう」）と区別が付かないので、あえて入れていない。
   知らない語尾は触らない。落とすより、そのまま残すほうが安全。 */
const VOLITION = [
  ["しましょう", "する"], ["片付けよう", "片付ける"], ["出かけよう", "出かける"],
  ["まとめよう", "まとめる"], ["始めよう", "始める"], ["起きよう", "起きる"],
  ["食べよう", "食べる"], ["借りよう", "借りる"], ["しよう", "する"],
  ["やろう", "やる"], ["行こう", "行く"], ["いこう", "いく"], ["こよう", "来る"],
  ["作ろう", "作る"], ["つくろう", "つくる"], ["書こう", "書く"], ["送ろう", "送る"],
  ["買おう", "買う"], ["読もう", "読む"], ["見よう", "見る"], ["みよう", "みる"],
  ["寝よう", "寝る"], ["帰ろう", "帰る"], ["入ろう", "入る"], ["休もう", "休む"],
  ["走ろう", "走る"], ["会おう", "会う"], ["払おう", "払う"], ["取ろう", "取る"],
  ["撮ろう", "撮る"], ["返そう", "返す"], ["直そう", "直す"], ["探そう", "探す"],
  ["話そう", "話す"], ["待とう", "待つ"], ["選ぼう", "選ぶ"], ["運ぼう", "運ぶ"]
];
function normalizeEnding(t) {
  /* 「勉強しようかな」の「かな」も落としてから合わせる（v4.6）。
     実機で見出しが「勉強しようかな」のまま残った。
     時刻を言っているなら迷いではなく予定なので（決まり0）、語尾もそろえる。 */
  // 落とすのは「かな」だけ。「かしら」は softButTimed が予定として拾わないので触らない
  const bare = t.replace(/かな(あ)?[。、\s]*$/, "");
  for (const [from, to] of VOLITION) {
    if (bare.length > from.length && bare.endsWith(from)) return bare.slice(0, -from.length) + to;
  }
  /* 「5時から7時まで勉強して…」のように**文が続いていた**ものを切り出すと、
     見出しが「勉強して」で終わる（v8.6・実機で報告）。「して」は次へつなぐ形であって、
     言い切りではない。**漢字・カタカナが2文字以上すぐ前にあるときだけ**「する」に直す——
     「試して」「探して」「話して」を「試する」にしないため（1文字の語は触らない）。
     これも語尾をそろえるだけで中身の語は変わらない（決まり7cb）。 */
  if (/[一-鿿々ヶァ-ヴー]{2,}して$/.test(bare)) return bare.slice(0, -2) + "する";
  /* 「を」が前に付いていれば、「して」は必ずサ変（「部屋の片付けをして」「話をして」）。
     1文字の動詞と取り違える心配が無いので、こちらは前の語を問わない。 */
  if (/を\s*して$/.test(bare)) return bare.replace(/して$/, "する");
  return t;
}

/* 文の中に動詞があるだけではタスクにしない。「やると決めたこと」の言い方かを見る。
   独り言には動詞がいくらでも出てくる（「調べてたら気になって見ちゃってた」）。 */
const RE_NARRATIVE = /(てた|ていた|てる|ている|でる|でいる|ちゃった|ちゃってた|しまった|でした|だった|ました)[。、]?$/;
const RE_SOFT = /(気がする|気もする|かもしれない|かもな|かも|と思う|たい気|ような気)[。、]?$/;
const RE_ASSISTANT_REQ = /(ほしい|欲しい|してみて|にしてみて)[。、]?$/;
/* 「やめた」「中止になった」は取りやめの報告。新しい用事ではない。 */
const RE_CANCELLED = /(やめた|やめました|やめとく|(中止|キャンセル|延期|お流れ)(に(なった|なりました|なる|なりそう))?|なくなった|流れた|見送(る|った))[。、]?$/;
/* 「行かない」「やらない」は、やらないと決めたこと。
   「作らないと」（＝やらなければ）は逆の意味なので、RE_SELFTASK で必ず先に外すこと。 */
const RE_NEGATED = /(ない|ません|ぬ)[。、]?$/;
/* やると決めた言い方。動詞の言い切り・意志形・「〜ておく」・行為を表す名詞止め。 */
const RE_DECIDED = new RegExp([
  "(する|やる|作る|書く|送る|出す|買う|読む|行く|会う|返す|飲む|取る|入れる|直す|決める|調べる|試す|捨てる|運ぶ|渡す)[。、]?$",
  "(ておく|とく|ておこう|ときます|ておきたい)[。、]?$",
  "(しよう|やろう|送ろう|作ろう|書こう|買おう|行こう|出そう)",
  "(予約|提出|連絡|返信|確認|申し込|片付け|掃除|洗濯|登録|練習|まとめ|支払|振込|振り込|準備|買い物|申請|手続き|予習|復習|返却)"
].join("|"));
/* 語彙に無い動詞の言い切り。「〜そう」「〜よう」「〜だろう」は推量なので外す。
   さらに、中身のある語（漢字・カタカナ2文字以上）があるときだけ有効にする。
   そうしないと「2時間半くらいかかる。」までタスクになる。 */
const RE_VERB_END = /[^そよろっ](く|ぐ|す|つ|ぬ|ぶ|む|る)[。、]?$|(買う|会う|使う|払う|手伝う|洗う|もらう|向かう|行う|通う)[。、]?$/;
const looksDecided = s => RE_DECIDED.test(s) || (RE_VERB_END.test(s) && contentWords(s).length > 0);
/* 「明日プレゼンの準備。」のような名詞止め */
const RE_NOUN_TASK = /(準備|予約|掃除|洗濯|買い物|連絡|提出|申請|登録|練習|片付け|支払い|振込|手続き|返却|予習|復習|会計|入金)[。、]?$/;
function taskStrength(s) {
  let n = 0;
  if (RE_SELFTASK.test(s)) n += 3;              // しないと／なきゃ／忘れないように
  if (/(しておいて|しといて|やっておいて)/.test(s)) n += 2;
  if (looksDecided(s)) n += 2;
  if (RE_NOUN_TASK.test(s)) n += 2;             // 「明日プレゼンの準備。」
  if (RE_NARRATIVE.test(s)) n -= 3;             // 出来事の説明であって、やることではない
  if (RE_SOFT.test(s)) n -= 3;                  // 「〜な気がする」は決定ではない
  if (RE_ASSISTANT_REQ.test(s)) n -= 2;         // AIへの要望であって、自分のタスクではない
  if (RE_CANCELLED.test(s)) n -= 4;             // 「買い物はやめた」は取りやめの報告
  if (/(はまだ|がまだ|もまだ)[。、]?$|^まだ/.test(s)) n -= 4;   // 「友達への連絡はまだ」＝未完了の報告
  if (s.length > 60) n -= 1;                    // 長い独り言は、たいてい説明
  return n;
}

/* **読点のあとの付け足しは、種類の判定から外す**（2026-09-26・本人の指示「読点の不具合も直して」）。
   用事かどうかは「作る」「買う」のような**文の終わりの動詞**で見ている（`taskStrength` など）。
   ところが「資料を作る、1時間。」「牛乳を買う、あとで。」は文の終わりが「1時間」「あとで」になり、
   **用事と判定されず、何も記録されずに**「予定はそのままにしてある」と返っていた（決まり5「捨てるなら、言う」に反する）。
   句点で区切れば拾えていたので、**読点1つで結果が変わっていた**。
   外すのは**所要時間・日付・時刻・時間帯・「あとで」だけ**の付け足し。中身のある語は外さない。
   **判定だけに使う。** 原文・根拠・所要時間・日時の読み取りは、元の文のまま（`parseDuration` / `parseWhen` は行全体を読む）。 */
const RE_TAIL_ADD = /[、,，]\s*(?:(?:\d+\s*時間\s*半?(?:\d+\s*分)?|\d+\s*分|半日)(?:くらい|ぐらい|ほど|程度)?(?:かかる|かかりそう|かな|で)?|あとで|後で|そのうち|今日中に?|明日中に?|今週中に?|来週中に?|今日|明日|明後日|あさって|今夜|今晩|午前中に?|午後に?|夕方に?|夜に?|朝に?|\d+\s*時(?:\d+\s*分|半)?(?:から|まで|に|頃|ごろ)?)[。．.!！\s]*$/;

function classify(rawS, lineWhen) {
  /* 付け足しを外すと**問いかけの形**になる（「散歩しようかな、30分。」→「散歩しようかな」）ときは外さない。
     外すと質問として捨てられ、前は「気になっていること」として残っていたものが消える（外して測って見つけた）。 */
  const full = halfWidth(rawS), cut = stripTail(full);
  const asks = x => RE_QUESTION_END.test(x) || RE_ASK.test(x);
  const s = asks(cut) && !asks(full) ? full : cut;
  const isCond = RE_COND.test(s) || (RE_PAIN.test(s) && !RE_SELFTASK.test(s) && !RE_GOTO.test(s));
  const isGoal = RE_GOAL.test(s);
  const isEvent = RE_EVENT.test(s) || RE_GOTO.test(s);
  const isTask = RE_TASK.test(s) || RE_VERB.test(s) || RE_NOUN_TASK.test(s);
  /* 「10時から11時まで勉強しようかな」——ここまで具体的に時刻を言うのは、迷いではない。
     日本語の「〜しようかな」は、やると決めたことを柔らかく言うときにも使う。
     **時刻が言われているときだけ**、問いかけ・迷いの扱いから外して予定にする。
     時刻が無ければ今までどおり（「散歩するか迷ってる」は気になっていること）。
     「いいかな？」のような同意を求める形は、volitional（〜よう／〜こう）ではないので外れる。 */
  const softButTimed = !!(lineWhen && lineWhen.hasTime)
    && /(うかな(あ)?|しようか|やろうか)[。、\s]*$/.test(s);
  // 質問はタスクにしない。答えるのは reply 側の仕事。
  if (RE_QUESTION_END.test(s) && !softButTimed) return null;
  // RE_ASK にも「かな$」が入っているので、ここも同じ例外を通す。
  // 片方だけ直すと「〜しようかな。」（句点あり）だけ通って、句点なしが落ちる。
  if (RE_ASK.test(s) && !RE_TASK.test(s) && !softButTimed) return null;
  // 「今日はジムに行かない」を予定にしない。取りやめの報告も用事にしない。
  // どちらも記録は残す（memo）。何が取り消されたかの照合はAIに任せる。
  if (isEvent && RE_NEGATED.test(s) && !RE_SELFTASK.test(s)) return "memo";
  if (RE_CANCELLED.test(s) && !RE_SELFTASK.test(s)) return "memo";
  if (isEvent && lineWhen && lineWhen.hasTime) return "event";
  /* 「1時から2時まで勉強する」——**始まりと終わりの両方**を言っているなら、
     語彙に無くても予定にする（v4.3）。用事(task)にすると所要時間だけが残り、
     `planFor` が空いている場所へ勝手に置く（言った時刻に置かれない）。
     単独の時刻（「明日10時に勉強する」）はここに入れない。締切として扱う今までどおり。 */
  // 「6時から9時の間に30分」は範囲ではなく「置いてよい時間帯」。予定にしない（v4.5）
  if (lineWhen && lineWhen.start && lineWhen.end && !lineWhen.between && !RE_SELFTASK.test(s)
      && !RE_DONE.test(s) && !looksDurable(s) && !RE_COND.test(s) && !RE_GOAL.test(s)) return "event";

  // 入っていたら false を返すので、その日の話はここをすり抜けて condition になる。
  if (looksDurable(s)) return "profile";
  /* 「集中できるタイプになりたい」「よく眠れるようになりたい」は、**なりたい姿**であって今日の体調ではない
     （2026-09-26・「わたしのこと」の見直しで実測）。体調にすると翌日には効かず、続けたいことにも出ない。 */

     `RE_GOAL` に「毎日」が入っているので、時刻まで言っていてもここまで来ると goal になる。
     時刻つきのくり返しは、予定表に置けるものとして扱う。 */
  if (lineWhen && lineWhen.hasTime && parseRepeat(s) && !RE_SELFTASK.test(s)) return "event";
  /* 「14日から16日まで旅行」「明日から3日間、出張」は、用事ではなく**その期間そのもの**。
     task にすると所要時間だけが残り、残りの日が空いている扱いになる（v4.3）。 */
  if (lineWhen && lineWhen.spanEndKey && !RE_SELFTASK.test(s) && !RE_DONE.test(s)
      && !isCond && !isGoal && !looksDurable(s)) return "event";
  if (isGoal) return "goal";
  // 「来週の水曜に美容院の予約」は予定。「歯医者の予約を取らないと」は自分がやること。
  // 違いは「〜ないと／なきゃ／忘れてた」のような、自分に課している言い方があるかどうか。
  if (isEvent && !RE_SELFTASK.test(s)) return "event";
  // 「迷っている」「いつか」「面白そう」は、やると決めたことではない。
  // ただし時刻まで言っているなら別（上の softButTimed）。
  if (RE_MAYBE.test(s) && !RE_SELFTASK.test(s) && !softButTimed) return "idea";
  // 「牛乳を買っておく」のように語彙リストに無い言い方も、言い切りなら拾う
  if ((isTask || looksDecided(s)) && taskStrength(s) >= 2) return "task";
  if (isEvent) return "event";
  return null;
}

function extractByRule(note, settings) {
  const tz = settings.timezone;
  const items = [];
  const noteDayKey = dayKey(new Date(note.capturedAt), tz);
  // 読み取りは半角にそろえた文で行い、根拠と引用は原文から取る（位置は1対1なのでずれない）
  for (const line of splitLines(halfWidth(note.text))) {
    const rawLine = note.text.slice(line.start, line.end);
    // 日時と所要時間は行全体から拾う（「今日中にやる。15分くらい。」に対応）
    const when = parseWhen(line.text, note.capturedAt, tz);
    // 所要時間は、移動時間の文を除いた部分から拾う
    // （「移動に30分かかる」の30分を、予定の長さにしない）
    const dur = parseDuration(line.sentences.filter(s => parseTravel(s.text) == null).map(s => s.text).join(""));

    // 同じ行・同じ種類はひとつにまとめる（1行＝1話題）
    const picked = {}, order = [], extraDur = {};
    let travelMin = null;
    for (const sen of line.sentences) {
      if (RE_DONE.test(sen.text) && !RE_TASK.test(sen.text)) continue;
      // 「移動に30分かかる」——これは用事でも所要時間でもない。予定に付ける。
      const tv = parseTravel(sen.text);
      if (tv != null) { travelMin = tv; continue; }
      const k = classify(sen.text, when);
      if (k) { if (!picked[k]) { picked[k] = sen; order.push(k); } continue; }
      // 「2時間くらい。」のような、それだけの文。直前に拾ったものの所要時間として扱う。
      const d = parseDuration(sen.text);
      if (d != null && order.length) extraDur[order[order.length - 1]] = d;
    }
    const single = order.length === 1;   // 1行に1話題のときだけ、行全体の日時・所要時間を使う
    const usedSen = new Set();

    for (const kind of order) {
    let sen = picked[kind];
    // 「忘れないようにしておいて」のような、中身の無い文が選ばれたときは、
    // 同じ行の前の文から見出しを取る（「友達にAIの構想を送ろう」）。
    const reminderOnly = /(忘れないように|忘れずに|覚えておいて|メモしておいて|残しておいて)/.test(sen.text);
    if (kind === "task" && (reminderOnly || !contentWords(sen.text).length)) {
      const better = line.sentences.filter(x => x.start < sen.start && contentWords(x.text).length && !usedSen.has(x.start)).pop();
      if (better) sen = better;
      // 同じ文を別の種類（思いつき等）が既に使っているなら、重ねて作らない
      if (usedSen.has(sen.start)) continue;
    }
    usedSen.add(sen.start);
    const s = sen.text;
    const senWhen = parseWhen(s, note.capturedAt, tz);
    // 1行に複数の話題があるときは、行全体の日時を他の話題に持ち込まない。
    // （「来週の水曜に美容院。今年は走る習慣をつけたい。」の目標に水曜の期限を付けない）
    /* **目標は、別の文の日付を借りない**（2026-09-26・本人の指示）。

       「9/26 まで」と出ていた。行全体の日付を使うのは「〜やる。15分くらい。」のように
       **1つの用事が文をまたいでいる**ときのためで、続けたいことに締切は付かない。
       その文の中で言った日付（「来月までに5kg」）は今までどおり使う。 */

    // 同じ行に期限らしい日付があるときは、そちらを採る。

      id: uid(), noteId: note.id, kind,
      title: cleanTitle(s, kind === "condition" ? null : senWhen, { keepHabit: kind === "goal" }),
      evidence: { text: rawLine, start: line.start, end: line.end },

    if ((kind === "task" || kind === "event") && !contentWords(base.title).length && /\d/.test(base.title)) {

    }

    if (kind === "condition") {
      /* 1行に別の話題もあるときは、**体調の文だけ**を本人の言葉として残す（2026-09-26）。
         行ごと入れると「今日は少し頭が痛い。夜は予定を入れないで。毎日30分は歩きたい。」が
         まるごと体調の申告になっていた。言い換えはしない——原文の切り出しのまま（決まり3）。 */
      const said = single ? rawLine : note.text.slice(sen.start, sen.end);
      base.title = said.length > 60 ? said.slice(0, 58) + "…" : said;
      base.reportedAt = note.capturedAt;      // 出典の日時。現在の事実として扱わない
      base.selfReport = said;                 // 本人の言葉そのまま（全角も原文のまま）
    } else if (kind === "event" && !w) {
      // 日付も時刻も言っていない「郵便局に行く」は予定ではなく用事。
      // ここで捨てると、発言がまるごと消えてしまう。
      // ただし「いつか旅行に行きたい」は、やると決めたことではない。

      base.kind = (RE_MAYBE.test(halfWidth(s)) && !RE_SELFTASK.test(halfWidth(s))) ? "idea" : "task";
      base.fixed = false;

      base.dueIsDeadline = false; base.estimateMin = d;
      base.preferWindow = parseIntent(line.text).window;
      const mtF = base.kind === "task" ? mealTitle(s, note.capturedAt, tz) : null;   // 「ご飯食べに行く」がここへ来た場合も揃える
      if (mtF) {
        base.title = mtF; base.isMeal = true;
        if (base.estimateMin == null) base.estimateMin = 30;

      }
    } else if (kind === "event") {
      base.fixed = true;
      base.timeUnknown = !(w && w.hasTime);   // 時刻を言っていない予定は時間割に置かない
      base.start = w.start ? w.start : w.iso;
      base.end = w.end ? w.end : new Date(new Date(base.start).getTime() + (d || 60) * 60000).toISOString();
      // 終わりの時刻を言われていないときの60分はこちらの仮置き。事実として出さない

      base.duePrecision = w.precision;

      /* 何日も続く予定（v4.3）。時刻を言われていなければ「終日」にする。
         終日の枠は**作業時間をふさがない**（旅行中でも読書はできる）。
         ふさいでほしいときは「その日は予定を入れないで」と言えば止まる。 */
      if (w.spanEndKey) {
        const [ey, em, ed] = w.spanEndKey.split("-").map(Number);
        base.spanEndKey = w.spanEndKey;
        base.allDay = !w.hasTime;
        base.end = zoned(ey, em, ed, 23, 59, tz).toISOString();
        base.endUnknown = false;
        if (base.allDay) {
          const [sy, sm, sd] = base.dayKey.split("-").map(Number);
          base.start = zoned(sy, sm, sd, 0, 0, tz).toISOString();
          base.timeUnknown = false;
        }
      }
      const mtE = mealTitle(s, note.capturedAt, tz);   // 「12時からランチ」も名前を揃える
      if (mtE) { base.title = mtE; base.isMeal = true; }
    } else if (kind === "task") {
      base.fixed = false;
      base.due = w ? w.iso : null;
      base.dayKey = w ? w.dayKey : null;
      base.duePrecision = w ? w.precision : "none";
      base.dueIsDeadline = w ? !!w.isDeadline : false;
      base.estimateMin = d;
      if (w && w.altStart) base.whenAlt = { start: w.altStart, end: w.altEnd || null, dayKey: w.altDayKey };
      { const rep = parseRepeat(s) || parseRepeat(line.text); if (rep && base.dayKey) base.repeat = rep; }
      // 食事は揃えた名前にして、その日の予定として置く
      const mt = mealTitle(s, note.capturedAt, tz);
      if (mt) {
        base.title = mt; base.isMeal = true;
        if (base.estimateMin == null) base.estimateMin = 30;
        if (!base.dayKey) {
          base.dayKey = noteDayKey;
          base.due = zoned(...noteDayKey.split("-").map(Number), 23, 59, tz).toISOString();
          base.duePrecision = "day";
        }
      }
      // 「6時から9時の間に」＝置いてよい時間帯。予定表はこの中で場所を探す（v4.5）
      if (w && w.between) {
        base.winFrom = w.between.from; base.winTo = w.between.to;
        base.duePrecision = "day";
        base.due = zoned(...w.dayKey.split("-").map(Number), 23, 59, tz).toISOString();
      }
      // 締切（dayKey）とは別に、いつ手を付けたいか（targetDay / preferWindow）
      const intent = parseIntent(line.text);
      base.preferWindow = intent.window;
      if (intent.wantToday && base.dayKey && base.dayKey > noteDayKey) base.targetDay = noteDayKey;
      // 「今日絶対じゃない」「急がない」は、今日を締切にしない
      if (/(絶対じゃない|絶対ではない|今日じゃなくて(も)?いい|急がない|急ぎじゃない|いつでもいい|そのうちで)/.test(line.text)) {
        base.notUrgent = true;
        if (base.dayKey === noteDayKey) { base.dayKey = null; base.due = null; base.duePrecision = "none"; base.dueIsDeadline = false; }
      }
      if (/(もうちょっと|もう少し|かかるかも|かかりそう|くらいかかる)/.test(line.text)) base.estimateUncertain = true;

    } else if (kind === "goal") {

      base.duePrecision = w ? w.precision : "none";
    } else if (kind === "profile") {
      base.category = profileCategory(s);
      base.statedAt = note.capturedAt;   // いつ言ったか。古くなったら本人が直す。
    }

}

/* 同じ発言から、ルールとAIが同じ用事を別の言い方で作ることがある。
   （「資料を作る」と「打ち合わせ資料の作成」）。見出しが違っても、
   同じ発言・同じ種類で中身の語が重なるなら、同じものとして扱う。
   別の発言どうしは重ねない——言い換えの偶然で別の用事を潰さないため。 */
function findSimilar(it) {
  const w = contentWords(it.title);
  if (!w.length || !it.noteId) return null;
  return state.items.find(x =>
    x.id !== it.id && x.kind === it.kind && x.noteId === it.noteId && x.status !== "dropped" &&
    contentWords(x.title).some(t => w.includes(t))) || null;
}

/* 残す方に、足りない情報だけを移す。本人が言った見出しの方を優先して残す。 */
async function mergeInto(keep, incoming, changes, tz) {
  const add = [];
  if (keep.estimateMin == null && incoming.estimateMin != null) { keep.estimateMin = incoming.estimateMin; add.push("所要時間"); }
  if (!keep.dayKey && incoming.dayKey) { keep.dayKey = incoming.dayKey; keep.due = incoming.due; keep.duePrecision = incoming.duePrecision; add.push("期限"); }
  if (!keep.targetDay && incoming.targetDay) { keep.targetDay = incoming.targetDay; add.push("実行日"); }
  if (!keep.preferWindow && incoming.preferWindow) { keep.preferWindow = incoming.preferWindow; add.push("時間帯"); }
  if (!keep.travelMin && incoming.travelMin) { keep.travelMin = incoming.travelMin; add.push("移動"); }
  if (!add.length) return;
  keep.dedupeKey = dedupeKey(keep);
  note2(keep, "同じ発言の読み取りを1つにまとめた：" + add.join("・"));
  await putItem(keep);
  changes.push(`${keep.title}：${add.join("・")}を補いました`);
}

function dedupeKey(it) {
  if (it.kind === "profile") return "profile|" + norm(it.title).slice(0, 40);
  /* **日付は「その人の日」で取る。ISO文字列を切らない**（v7.5・実機で報告）。
     `(it.due || "").slice(0, 10)` は **UTCの日付**なので、日本時間の朝は前日になる。
     同じ 9/15 でも **午前9時より前は "2026-09-14"、9時以降は "2026-09-15"** と割れ、
     同じ日の同じ用事なのに別物として扱われた。実機では、組み立て直したときに
     **「お風呂に入る」が 08:35 と 09:10 に二重に入った**（実測）。
     決まり4「日付に触るときは必ず `zoned` / `parts` / `dayKey` を通す」そのもの。 */
  const d = it.kind === "event"
