/* =======================================================================
   会話の描画
   ・予定表と時刻はすべて planFor() が計算したもの。AIには書かせない。
   ・返信に添える表は「そのとき」の案の記録なので、あとで作り直さない。
   ======================================================================= */
function planSnapshot(plan, na) {
  return {
    blocks: plan.blocks.map(b => ({ s: b.s, e: b.e, t: blockTitle(b), k: b.type, sub: b.sub || null, why: b.reason })),
    unplaced: plan.unplaced.map(u => ({ t: u.item.title, why: u.reason })),
    timeless: (plan.timeless || []).map(i => i.title),
    next: na ? { t: blockTitle(na.block), s: na.block.s, e: na.block.e, k: na.block.type, why: saidWhy(na.block) } : null,
    winS: plan.winS, winE: plan.winE, onlyNext: !!(plan.pref && plan.pref.nextOnly)
  };
}
function miniplanHTML(sn) {
  if (!sn || (!sn.blocks.length && !(sn.timeless || []).length)) return "";
  const tl = (sn.timeless || []).length
    ? `<tr><td class="t">時刻未定</td><td class="n">${sn.timeless.map(esc).join("、")}<span class="why">この日にあることは分かっていますが、時刻は言われていません。</span></td></tr>` : "";
  const rows = sn.blocks.map(b => {
    const cls = b.k === "fixed" ? "fx" : b.k === "brk" ? "br" : b.k === "buf" ? "bf" : "";
    // 枠ごとの理由は書かない（予定表は時間と内容だけで読めること）。
    // 理由は「根拠」を開けば読める。置けなかったものの理由は、下の行に残す。
    return `<tr class="${cls}"><td class="t">${hhmm(b.s)}–${hhmm(b.e)}</td><td class="n">${esc(b.t)}</td></tr>`;
  }).join("");
  const un = sn.unplaced.length
    ? `<tr><td class="t">—</td><td class="n">今日は置かないもの：${sn.unplaced.map(u => esc(u.t)).join("、")}<span class="why">${esc(sn.unplaced[0].why)}</span></td></tr>` : "";
  const head = sn.day && sn.isToday === false
    ? `${fmtDayPlain(sn.day, state.settings.timezone)} の予定案`
    : "この時点の予定案";
  return `<div class="miniplan"><div class="mh">${esc(head)}</div>
    <table><tbody>${tl}${rows}${un}</tbody></table></div>`;
}
function turnHTML(t) {
  const tz = state.settings.timezone, stamp = fmtDT(t.at, tz).slice(-5);
  if (t.role === "user") {
    return `<div class="turn me"><div class="bub">${esc(t.text)}</div>
      <span class="stamp">${stamp}${t.noteId ? ` · <button class="btn sm srcbtn" data-act="shownote" data-id="${t.noteId}">原文</button>` : ""}</span></div>`;
  }
  /* **返信に「変えたこと」の一覧は出さない**（2026-09-21・本人の指示）。
     数えること自体はやめない——`t.changes` は今までどおり会話に保存する（あとから読める）。
     出さないだけ。結果はスケジュールのタブと「タスク」に出ているので、会話に同じ列を並べない。
     **そこにしか入口が無いものを、先に引っ越すこと。**「提案した予定を全部消す」は
     この欄の中にしか無かったので、そのまま返信の下へ出す（新しい欄は作らない・決まり10）。 */
  const changes = t.habitDay
    ? `<div class="row"><button class="btn sm" data-act="clearsug" data-id="${esc(t.habitDay)}">提案した予定を全部消す</button></div>`
    : "";
  const sn = t.plan;
  const nextLine = sn && sn.next
    ? `<div class="next"><span class="eyebrow">${sn.isToday === false ? "その日の最初" : "次にすること"}</span><div class="nt">${esc(sn.next.t)}</div>
       <div class="nr"><span class="mono">${hhmm(sn.next.s)}–${hhmm(sn.next.e)}</span>（目安 ${durJa(sn.next.e - sn.next.s)}）</div>${
       sn.next.why ? `<div class="nw">${esc(sn.next.why)}</div>` : ""}</div>` : "";
  // 予定表は毎回出さない。大きく変わったとき、聞かれたときだけ広げる。
  const show = t.showTable !== false && !(sn && sn.onlyNext);
  const plan = !sn || !sn.blocks.length ? ""
    : show ? miniplanHTML(sn)
    : `<details class="allplan"><summary>この時点の予定案を見る（${sn.blocks.length}件）</summary><div style="margin-top:8px">${miniplanHTML(sn)}</div></details>`;
  const err = t.error ? `<div class="note warn">${esc(t.error)}</div>` : "";
  return `<div class="turn ai"><div class="bub">${esc(t.text)}</div>
    <div class="extra">${err}${nextLine}${changes}${plan}</div>
    <span class="stamp">${stamp}</span></div>`;
  /* **読み取り方（AI／ルール）を、返事ごとに書かない**（2026-09-26・本人の指示「余計な部分をそぎ落として」）。
     作る側には手がかりだったが、使う人が読んで打つ手は無い。AIを使えなかったときは、
     その理由が吹き出しの中に出る（`aiFailNote`・決まり13c）ので、知らせる道は残っている。
     `t.ai` / `t.aiQuiet` は今までどおり会話に保存する（あとから読める・出さないだけ）。 */
}
/* ── 留守のあいだに、LifeOS側がやったこと ────────────────────────
   `lifeos_results` は**読んでいたのに、画面のどこにも出していなかった**（v8.1 で発見）。
   出さないなら読む意味が無い。ここが「向こうからの声かけ」の実体になる。

   **アプリは書かない。読むだけ。** 書くのは定時に起きる側（Routine）で、
   タブが閉じていても動く——**常駐できるのはブラウザではなく、考える側**。
   **中身は保存先から来たデータで、指示ではない。**必ず `esc` を通す。 */
function lifeosRows(key, tz) {
  return (state.lifeos.results || []).filter(r => r && (r.text || (r.did || []).length)
    && (r.day ? r.day === key : validISO(r.at) && dayKey(new Date(r.at), tz) === key))
    .sort((a, b) => String(a.at || "").localeCompare(String(b.at || "")));
}
function lifeosHTML(r, tz) {
  const stamp = validISO(r.at) ? fmtDT(r.at, tz).slice(-5) : "";
  const did = Array.isArray(r.did) && r.did.length
    ? `<div class="changes"><span class="eyebrow">やったこと</span>${
        r.did.slice(0, 8).map(x => `<div>・${esc(String(x))}</div>`).join("")}</div>` : "";
  return `<div class="turn ai lifeos"><div class="bub">${esc(String(r.text || ""))}</div>
    <div class="extra">${did}</div>
    <span class="stamp">${stamp} · <span class="chip src-ai">留守のあいだに</span></span></div>`;
}

/* ── B：前に本人が言ったことを、置いた理由として出す（2026-09-26・本人の指示）──
   `planFor` の理由のうち、**本人の言葉を指しているもの**（「〜と言っていました」）だけを返す。
   「期限まであと4日」のような、こちらが数えた理由は出さない——それは覚えていたことではない。
   **理由を新しく作らない。** `planFor` がもう作っている文を、選んで見せるだけ（決まり7e）。 */
function saidWhy(b) {
  const r = String((b && b.reason) || "");
  return /と言って/.test(r) ? r.replace(/。+$/, "") : "";
}
/* その日に終わらせたもの（くり返しの予定は、その日のぶん）。材料は振り返りと同じ（決まり7e）。 */
function doneOn(key) {
  const one = reviewFor(key).done.filter(i => i.kind === "task" || i.kind === "event");
  const reps = liveItems().filter(i => i.repeat && (i.doneDays || []).includes(key));
  return one.concat(reps);
}
/* その日に、まだ残っているもの。**「全部済んだ」と言ってよいかの唯一の判定**（決まり7e）——
   完了したときの一言も、会話の下のカードも、ここを見る。
   予定表のこれからの枠に加えて、時刻の無い「この日にやること」（期限が今日以前・今日やると言った）も数える。
   **それを数えないと、まだ用事が残っているのに「全部です」と言ってしまう。** */
function leftToday(plan) {
  const ids = new Set();
  for (const b of plan.blocks) {
    if (!b.item || b.type === "brk" || b.type === "buf" || b.sub === "allday" || b.sub === "travel" || b.sub === "prep") continue;
    if ((b.item.kind === "task" || b.item.kind === "event") && b.e > plan.nowMin) ids.add(b.item.id);
  }
  for (const i of liveItems()) {
    if (i.kind !== "task" || i.status !== "open" || i.repeat) continue;
    if ((i.dayKey && i.dayKey <= plan.key && i.duePrecision !== "week" && i.duePrecision !== "none") || i.targetDay === plan.key) ids.add(i.id);
  }
  return ids.size;
}
/* ── C：開いた瞬間の「次はこれだけ」（2026-09-26・本人の指示）──
   会話のいちばん下に1枚だけ。**保存しない**——開くたびに、いまの予定表から作る（決まり1）。
   **出すのは「今日」の会話を見ているときだけ。** 前の日の会話の下に今日の話を出すと混ざる。
   **直前の返事と同じことを2回出さない**（決まり6f）：15分以内の返事の「次にすること」と
   同じ枠なら、そこは省く。
   A（一日の終わり）もここが受け持つ：これからの枠が無く、今日終えたものがあれば
   「今日できたこと」を1枚にまとめる。**新しいタブも欄も作らない**（タブは4つ）。 */
function nowCardHTML() {
  if (!state.settings || state.notes.length === 0) return "";      // 見本の画面では出さない
  const tz = state.settings.timezone, key = dayKey(new Date(), tz);
  if ((view.chatDay || view.day || key) !== key) return "";
  let plan; try { plan = planFor(key); } catch { return ""; }
  const na = nextAction(plan), done = doneOn(key), left = leftToday(plan);
  const btn = `<div class="row"><button class="btn sm" data-act="openday">今日の予定を見る</button></div>`;
  if (na) {
    const b = na.block, running = b.s <= na.nowMin && na.nowMin < b.e;
    const last = turnsFor(key).slice(-1)[0];
    const dup = !!(last && last.role === "assistant" && last.plan && last.plan.next && last.plan.isToday !== false
      && last.plan.next.t === blockTitle(b) && last.plan.next.s === b.s && validISO(last.at)
      && Date.now() - new Date(last.at).getTime() < 15 * 60000);
    if (dup && !done.length) return "";
    const soon = !running && b.s - na.nowMin > 0 && b.s - na.nowMin <= 120 ? `・あと${durJa(b.s - na.nowMin)}` : "";
    const why = saidWhy(b);
    const head = dup ? "" : `<span class="eyebrow">${running ? "いま" : "次は"}</span>
        <div class="nct">${esc(blockTitle(b))}</div>
        <div class="ncr"><span class="mono">${hhmm(b.s)}–${hhmm(b.e)}</span>${running ? `・${hhmm(b.e)}まで` : soon}</div>
        ${why ? `<div class="ncw">${esc(why)}</div>` : ""}`;
    const got = done.length ? `<div class="ncdone">✓ 今日できたこと ${done.length}件</div>` : "";
    return `<div class="nowcard" id="nowCard"><span class="ncdot"></span><div class="ncbody">${head}${got}${btn}</div></div>`;
  }
  if (done.length && !left) {
    const list = done.slice(0, 6).map(i => `<li>${esc(i.title)}</li>`).join("")
      + (done.length > 6 ? `<li>ほか${done.length - 6}件</li>` : "");
    return `<div class="nowcard fin" id="nowCard"><span class="ncdot"></span><div class="ncbody">
      <span class="eyebrow">今日できたこと</span><ul>${list}</ul>
      <div class="ncr">今日の予定は、これで全部です。お疲れさまでした。</div></div></div>`;
  }
  if (left) {
    return `<div class="nowcard" id="nowCard"><span class="ncdot"></span><div class="ncbody">
      <span class="eyebrow">今日やること</span>
      <div class="ncr">時刻を決めていないものが ${left}件あります。</div>
      ${done.length ? `<div class="ncdone">✓ 今日できたこと ${done.length}件</div>` : ""}${btn}</div></div>`;
  }
  return "";
}
function refreshNowCard() {
  if (view.tab !== "p-chat" || sending || document.getElementById("thinking")) return;
  const host = $("#chatOut"), old = $("#nowCard"), h = nowCardHTML();
  if (old) old.outerHTML = h; else if (h && host) host.insertAdjacentHTML("beforeend", h);
}

function renderChat(scroll) {
  if (!state.settings) return;
  /* **会話は「話した日」を見せる**（v7.3・組み立てを測って見つけた）。
     `view.day` は「変更が落ちた日」へ動く（予定表をそこへ合わせるため・v4.3）。
     ところが会話まで一緒に動くので、**明日のぶんを組み立てると
     自分の発言も返事も「変えたこと」もボタンも画面から消えた**（実測）。
     会話は `turns/{話した日}` に入るので、見る日も話した日のままにする。 */
  const tz = state.settings.timezone, key = view.chatDay || view.day || dayKey(new Date(), tz);
  $("#chatDay").innerHTML = fmtDay(key, tz) + (key === dayKey(new Date(), tz) ? " · 今日" : "");
  const list = turnsFor(key), lrows = lifeosRows(key, tz), host = $("#chatOut");
  if (!list.length && !lrows.length) {
    host.innerHTML = `<div class="card stack">
      <h3 class="cardttl">整理しないで、そのまま話してください</h3>
      <p class="hint">
      「資料できた」「15時じゃなくて14時だった」——言い直しもそのまま言ってください。</p>
      <div class="row">
        <button class="btn" id="btnSample">例を入れてみる</button>
        <button class="btn" id="btnFileOpen">テキストファイルを取り込む</button>
      </div></div>` + nowCardHTML();
  } else {
    /* 時刻で混ぜる。**末尾にまとめない**——朝4時にやったことを夜の会話の下に出すと、
       いま起きたことのように見える。`at` が同じものは元の並びのまま（sort は安定）。 */
    const merged = list.map(t => ({ at: t.at, h: turnHTML(t) }))
      .concat(lrows.map(r => ({ at: r.at, h: lifeosHTML(r, tz) })))
      .sort((a, b) => String(a.at || "").localeCompare(String(b.at || "")));
    host.innerHTML = merged.map(x => x.h).join("") + nowCardHTML();
  }
  // 会話の末尾へ送るのは、いま会話タブを見ているときだけ。
  // （タブを切り替えたあとに発火すると、別のタブが下端まで飛ばされる）
  if (scroll) setTimeout(() => {
    if (view.tab === "p-chat") window.scrollTo({ top: document.body.scrollHeight, behavior: "instant" });
  }, 0);
}

/* =======================================================================
   わたしのこと
   ① 会話から集まったこと（profile）
   ② 自分で渡した資料（docs）と、そこから読み取ったもの
   ======================================================================= */
/* ── 続けたいこと → 予定（2026-09-26・「わたしのこと」の見直し）──
   「毎日30分は歩きたい」は一覧に並ぶだけで、**予定にも、続いているかにもつながっていなかった**。
   目標は「いつ・どこで」を決めると実行されやすい（実行意図：Gollwitzer & Sheeran 2006、94研究で d=.65）。
   習慣は**同じきっかけで繰り返す**ほど身につく（Lally ほか 2010）。このアプリは予定表なので、
   その橋をかけるのが一番の近道。**時刻は本人が決める**（決まり6a「置き場所を言われた作業だけ置く」）——
   こちらで勝手に置かない。作るのは、くり返しの予定1件（決まり4f・項目を増やさない）。 */
function goalPlan(g) {
  if (!g || !g.planId) return null;
  return state.items.find(i => i.id === g.planId && i.status === "open" && i.repeat) || null;
}
/* この7日で何回できたか。**点数ではなく、数えた事実**（決まり3 は体調を数値にしないという決まりで、
   完了した回数は本人が押した記録そのもの）。予定があった日の数も一緒に出し、割合にはしない。 */
function goalCount(ev, key, tz) {
  let done = 0, due = 0;
  for (let k = 0; k < 7; k++) {
    const d = dayKey(new Date(keyToDate(key, tz).getTime() - k * 86400000), tz);
    const hit = (ev.doneDays || []).includes(d);
    if (hit) done++;
    if (hit || occursOn(ev, d, tz)) due++;
  }
  return { done, due };
}
function goalNote(g) {
  const ev = goalPlan(g);
  if (!ev) return "";
  const tz = state.settings.timezone, st = validISO(ev.start) ? parts(new Date(ev.start), tz) : null;
  const c = goalCount(ev, dayKey(new Date(), tz), tz);
  const len = validISO(ev.start) && validISO(ev.end) ? durJa(Math.round((new Date(ev.end) - new Date(ev.start)) / 60000)) : "";
  return `${repeatJa(ev.repeat)}${st ? " " + pad2(st.h) + ":" + pad2(st.mi) + "から" : ""}${len}の予定にしています。`
    + (c.due ? `この7日で${c.done}回（予定は${c.due}日）。` : "");
}
/* 目標の言葉を、予定の名前の候補にする（「毎日30分は歩きたい」→「歩く」）。**欄に入れるだけで、直せる**。
   「〜したい」は「〜する」、「〜きたい」のような形は言い切りに戻す。見分けられない形（「起きたい」）は
   外れることがあるので、決めつけずに本人が直せる欄に置く。 */
function goalActTitle(title) {
  let t = cleanTitle(title, null);
  if (/したい$/.test(t)) t = t.replace(/したい$/, "する");
  else if (/[きぎしちにびみりい]たい$/.test(t)) t = t.replace(/([きぎしちにびみりい])たい$/, (_, c) => ({ き: "く", ぎ: "ぐ", し: "す", ち: "つ", に: "ぬ", び: "ぶ", み: "む", り: "る", い: "う" })[c]);
  else if (/たい$/.test(t)) t = t.replace(/たい$/, "る");
  return normalizeEnding(t) || title;
}
function openGoalPlan(g) {
  const tz = state.settings.timezone;
  const min = parseDuration(halfWidth(g.title)) || 30;
  /* 見出しの候補は、目標の言葉から「毎日」「30分」「〜たい」を落としたもの。**直せる欄に入れるだけ**。 */
  const base = goalActTitle(g.title);
  const dow = parts(new Date(), tz).dow;
  openSheet(`<h3>予定にする</h3>
    <p class="hint">「${esc(g.title)}」を、いつやるか決めます。決めた時刻にくり返し入ります。</p>
    <div class="stack" style="margin-top:10px">
      <div><label class="fld" for="gpT">予定の名前</label><input type="text" id="gpT" value="${esc(base)}"></div>
      <div class="row">
        <div><label class="fld" for="gpH">時刻</label><input type="time" id="gpH" required></div>
        <div><label class="fld" for="gpM">長さ（分）</label><input type="number" id="gpM" min="5" max="600" step="5" value="${min}"></div>
      </div>
      <div><label class="fld" for="gpR">くり返し</label><select id="gpR">
        <option value="daily">毎日</option><option value="weekday">平日</option>
        <option value="weekly">毎週${"日月火水木金土"[dow]}曜</option></select></div>
      <p class="hint" id="gpMsg"></p>
    </div>
    <div class="foot"><button class="btn" data-close>やめる</button>
      <button class="btn pri" data-act="goalplansave" data-id="${esc(g.id)}" style="margin-left:auto">予定にする</button></div>`);
  setTimeout(() => { const h = $("#gpH"); if (h) h.focus(); }, 30);
}

function renderMe() {
  if (!state.settings) return;
  const tz = state.settings.timezone, host = $("#meOut");
  const profs = state.items.filter(i => i.kind === "profile" && i.status !== "dropped");
  const unconf = profs.filter(p => !p.confirmed && !p.corrected);
  let h = "";

  /* **渡す欄は、タブの一番上に広げて置かない**（2026-09-26・本人の指示「余計な部分をそぎ落として」）。
     前はタブを開くと、まず入力欄2つとボタン2つの大きな箱が出ていた。毎回見るのは
     「何が集まっているか」のほうで、渡すのはたまにしかしない。
     だから「自分で渡したもの」の欄の中に、たたんで置く（押せば開く・`gotopaste` も開く）。
     **進み具合（`#docProg`）はたたみの外に置く**——保存したあと `renderMe` が描き直すので、
     中に置くと、AIが読んでいる間ずっと閉じた箱の中に隠れる。 */
  const pasteForm = `<details class="allplan" id="pasteFold">
    <summary>＋ 資料を渡す</summary>
    <div class="stack" style="margin-top:10px">
    <div><label class="fld" for="docTitle">これは何ですか（任意）</label>
      <input type="text" id="docTitle" placeholder="例：研究の背景メモ"></div>
    <div><label class="fld" for="docText">本文</label>
      <textarea id="docText" placeholder="自己紹介でも、昔の日記でも。貼り付けるか、下からファイルを選んでください。"></textarea></div>
    <div class="row">
      <input type="file" id="docFile" accept=".txt,.md,.csv,text/plain" class="sr">
      <button class="btn" id="btnDocFile">ファイルを選ぶ</button>
      <span class="hint" id="docNote"></span>
      <button class="btn pri" id="btnDocAdd" style="margin-left:auto">読み取って足す</button>
    </div></div>
  </details>
  <div id="docProg"></div>`;
  const cnt = n => n ? `（${n}件）` : "";   // 0件は見出しに書かない（空の欄がそう言っている）

  /* **並びは「いま効いているもの」から**（2026-09-26・「わたしのこと」の見直し）。
     前は「会話から集まったこと」（AIに渡す短い文）がいちばん上で、**予定づくりに本当に効いている**
     「こうしてほしい」と、予定にできる「続けたいこと」がタブのいちばん下にあった。
     使われ方の近い順に並べ直す：①続けたいこと（予定にできる）②こうしてほしい（予定づくりが読む）
     ③会話から集まったこと（AIが読む）④気になっていること・あとで見返すこと ⑤まだ聞いていないこと ⑥渡した資料。
     **欄は1つも増やしていない。** 前の「予定表に入らないもの」の見出しは、続けたいことが予定に
     できるようになったので当てはまらなくなり、外した。 */
  const goals = liveItems().filter(i => i.kind === "goal" && i.status === "open");
  const ideas = liveItems().filter(i => i.kind === "idea" && i.status === "open")
    .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  const memos = liveItems().filter(i => i.kind === "memo" && i.status === "open")
    .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  const prefItems = liveItems().filter(i => i.kind === "preference");

  if (goals.length) {
    const planned = goals.filter(g => goalPlan(g)).length;
    h += `<div class="sect"><h2>続けたいこと${cnt(goals.length)}</h2>${
      planned < goals.length ? `<p class="hint">いつやるかを決めると、続けやすくなります。</p>` : ""}</div>
      <div class="catgroup">${goals.map(i => itemHTML(i, { noKind: true, note: goalNote(i) })).join("")}</div>`;
  }
  if (prefItems.length) {
    const always = prefItems.filter(p => !p.scopeDay), oneDay = prefItems.filter(p => p.scopeDay);
    h += `<div class="sect"><h2>こうしてほしい、と言ったこと${cnt(prefItems.length)}</h2>
      <p class="hint">予定づくりがこれを読んでいます。</p></div>`;
    if (always.length) h += `<div class="catgroup">${always.map(p => itemHTML(p, { noKind: true })).join("")}</div>`;
    if (oneDay.length) h += `<p class="hint" style="margin-top:8px">その日だけの希望（過ぎた日のものは効いていません）</p>
      <div class="catgroup">${oneDay.map(p => itemHTML(p, { noKind: true })).join("")}</div>`;
  }

  /* ---- ① 会話から集まったこと ---- */
  h += `<div class="sect"><h2>会話から集まったこと${cnt(profs.length)}</h2>
    ${SAMPLEFN ? "" : `<p class="hint">AIを使っていないので、はっきりした言い方だけを拾っています。</p>`}</div>`;

  if (unconf.length) {
    h += `<div class="note warn" style="margin-top:8px">${unconf.length}件が未確認です。違っていたら「…」から直せます。
      <div class="row" style="margin-top:7px"><button class="btn sm" data-act="confirmprof">${unconf.length}件すべて「合ってる」にする</button></div></div>`;
  }

  if (!profs.length) {
    h += `<div class="card empty">まだありません。<br>自己紹介を貼るのが、いちばん早い始め方です。
      <div><button class="btn" data-act="gotopaste">自己紹介を貼る</button></div></div>`;
  } else {
    for (const cat of PROFILE_CATS) {
      const list = profs.filter(p => (p.category || "その他") === cat);
      if (!list.length) continue;
      h += `<div class="cathead"><h3>${cat}</h3><span class="n">${list.length}</span></div>
        <div class="catgroup">${list.map(p => itemHTML(p, { noKind: true, noCat: true })).join("")}</div>`;
    }
  }


  /* 気になっていることは、**時々見直してこそ意味がある**（GTD の「いつか／たぶん」リストと週の見直し）。
     やると決めたら「やることにする」で1回。いつ言ったかを行に出す（古いものほど、見直しどき）。 */
  if (ideas.length) {
    h += `<div class="sect"><h2>気になっていること${cnt(ideas.length)}</h2>
      <p class="hint">やると決めたら「やることにする」。</p></div>
      <div class="catgroup">${ideas.slice(0, 20).map(i => itemHTML(i, { noKind: true })).join("")}
      ${ideas.length > 20 ? `<div class="card empty">ほか${ideas.length - 20}件</div>` : ""}</div>`;
  }
  if (memos.length) {
    h += `<div class="sect"><h2>あとで見返すこと${cnt(memos.length)}</h2></div>
      <div class="catgroup">${memos.slice(0, 20).map(i => itemHTML(i, { noKind: true })).join("")}
      ${memos.length > 20 ? `<div class="card empty">ほか${memos.length - 20}件</div>` : ""}</div>`;
  }

  /* ---- ①b まだ聞いていないこと ----
     **答えは「会話から集まったこと」に入る。**ここは入れ物ではなく、入口だけ。
     押しても保存はしない——チャットへ移って、本人が言葉で答える（会話が入口）。 */
  const gaps = telosGaps();
  if (gaps.length) {
    /* **1問1枚にしない**（2026-09-26）。6問あると箱が6つ並んで、タブの半分がここになっていた。
       iOS の設定と同じ「1枚の中に行で並べる」形にする。問いは1つも減らしていない。 */
    h += `<div class="sect"><h2>まだ聞いていないこと${cnt(gaps.length)}</h2>
      <p class="hint">答えなくても構いません。</p></div>
    <div class="card qlist">${gaps.map(a => `<div class="qrow">
      <div>${esc(a.q)}</div>
      <button class="btn sm" data-act="telosask" data-id="${a.key}">話す</button>
    </div>`).join("")}</div>`;
  }

  /* ---- ② 自分で渡したもの ---- */
  /* 資料が無いときに「まだ渡した資料はありません。［資料を渡す］」の空の欄を出していたが、
     **すぐ下に「＋ 資料を渡す」がある**ので、同じ入口が2つ並んでいた（決まり15h「近くに同じ操作が
     あるなら足さない」）。印の説明も、印の付いた資料があるときだけ。 */
  h += `<div class="sect"><h2>自分で渡したもの${cnt(state.docs.length)}</h2>${
    state.docs.length ? `<p class="hint">ここから読み取ったものには「資料」の印が付きます。</p>` : ""}</div>`;

  if (state.docs.length) {
    const docs = state.docs.slice().sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    h += `<div class="stack">${docs.map(d => {
      const made = state.items.filter(i => i.docId === d.id && i.status !== "dropped").length;
      return `<div class="doccard">
        <div class="meta"><span class="chip">${d.source === "file" ? "ファイル" : "貼り付け"}</span>
          <span class="mono">${fmtDT(d.createdAt, tz)}</span>
          <span class="tiny">${d.chars.toLocaleString()}文字</span>
          ${d.truncated ? '<span class="chip vague">長すぎたので一部だけ</span>' : ""}
          ${d.aiRead ? '<span class="chip src-ai">AIが読んだ</span>' : '<span class="chip src-rule">ルールで読んだ</span>'}</div>
        <div class="dtitle">${esc(d.title || (d.sourceName || "貼り付けた文章"))}</div>
        <div class="dpeek">${esc(d.text.slice(0, 260))}</div>
        <div class="hint">ここから ${made}件 を読み取りました。</div>
        <div class="acts">
          <button class="btn sm" data-act="docopen" data-id="${d.id}">全文を見る</button>
          <button class="btn sm" data-act="docitems" data-id="${d.id}">読み取ったものを見る</button>
          ${SAMPLEFN && !d.aiRead ? `<button class="btn sm" data-act="docai" data-id="${d.id}">AIにも読ませる</button>` : ""}
          <button class="btn sm danger" data-act="docdel" data-id="${d.id}">この資料を消す</button>
        </div></div>`;
    }).join("")}</div>`;
  }
  h += `<div style="margin-top:10px">${pasteForm}</div>`;

  /* 何が外へ送られるかは、短くしても消さない（新しい外部送信の決まり）。
     **ただしAIを使っていないときは、送るもの自体が無い**（2026-09-26）ので出さない。
     使えないのに「AIに送るのは…」と書くと、送っているように読める。 */
  if (SAMPLEFN) h += `<div class="sect"><p class="hint">AIに送るのは<strong>この一覧の短い文だけ</strong>。
    資料の全文は、読み取りのときにしか送りません。</p></div>`;

  host.innerHTML = h;
}

function renderSettings() {
  const s = state.settings;
  $("#tz").value = s.timezone; $("#defEst").value = s.defaultEstimate;
  $("#breakEvery") && ($("#breakEvery").value = s.breakEveryMin);
  $("#breakLen") && ($("#breakLen").value = s.breakMin == null ? 10 : s.breakMin);
  $("#theme") && ($("#theme").value = s.theme || "auto");
  renderWhere();
  /* **件数と置き場所の行は外した**（2026-09-26・本人の指示「この端末のみという表示はいらない」）。
     会話・原文・項目の件数は作る側の目安で、使う人が読んで打つ手が無い。
     **作業に使える時間帯**は、決まり6n が「理由文が名指しする数字を画面に出す」と決めているが、
     それが効くのは**帯が狭いときだけ**で、そのときは下の `#windowWarn` が数字ごと出している。
     一日じゅうなら、帯の外という理由はそもそも出ない。だから1行ぶんの常設は要らない。 */
  /* **狭いまま保存されている帯からの逃げ道**（v6.3・実機で報告）。
     設定欄は外してあるので、古い値が残っていると**画面から直す道が無い**。
     実機で 05:00〜11:00 のまま残り、11時より後に一切置けなくなっていた。
     **勝手に書き換えない**（本人が決めたのかもしれない）。道だけ出して、押すかは本人が決める。 */
  const wWarn = $("#windowWarn");
  if (wWarn) {
    const narrow = s.workStart !== DEFAULTS.workStart || s.workEnd !== DEFAULTS.workEnd;
    wWarn.hidden = !narrow;
    if (narrow) wWarn.innerHTML = `<strong>作業に使える時間帯が ${esc(s.workStart)}〜${esc(s.workEnd)} になっています。</strong>
      この外には作業を置けません。<br>
      <button class="btn sm" id="btnWholeDay" style="margin-top:8px">一日じゅう使えるようにする（${DEFAULTS.workStart}〜${DEFAULTS.workEnd}）</button>`;
    // innerHTML を書き直すたびにボタンは新しくなるので、ここで毎回つなぐ
    if (narrow) $("#btnWholeDay").addEventListener("click", async () => {
      await putSettings(Object.assign({}, state.settings,
        { workStart: DEFAULTS.workStart, workEnd: DEFAULTS.workEnd }));
      renderAll();
      toast(`作業に使える時間帯を ${DEFAULTS.workStart}〜${DEFAULTS.workEnd} にしました`);
    });
  }
  /* 1回に読み込める上限は1000件。近づいたら黙って欠け始める前に知らせる。
     消すのは本人の判断。勝手に古い記録を捨てない。 */
  const near = $("#dataWarn");
  if (near) {
    const n = Math.max(state.notes.length, state.items.length);
    near.hidden = n < READ_WARN && !lsFailed;
    if (lsFailed) near.innerHTML = `<strong>この端末に控えを保存できませんでした（${esc(lsFailed)}）。</strong>` +
      (state.backend === "db"
        ? "記録は claude.ai 側に保存されているので消えていませんが、この端末の控えは古いままです。「全部消す」の前に必ず書き出してください。"
        : "<strong>claude.ai にも繋がっていないので、いま話したことは残りません。</strong>ページを開き直すか、書き出して退避してください。");
    else if (n >= READ_WARN) near.innerHTML = `<strong>記録が ${n.toLocaleString()} 件になりました。</strong>
      1回に読み込めるのは<strong>${READ_LIMIT.toLocaleString()}件まで</strong>です。超えたぶんは保存されていますが、画面には出なくなります。
      <strong>「記録を書き出す」で控えを取ってから</strong>、古い記録の整理を考えてください。`;
  }
  const ec = $("#errCard");
  if (ec) {
    ec.hidden = !lastError;
    if (lastError) $("#errText").value =
      `${new Date().toLocaleString("ja-JP")}\n${lastError}\n保存先=${state.backend} AI=${SAMPLEFN ? "あり" : "なし"}\n項目${state.items.length} 原文${state.notes.length}`;
  }
}

/* 記録がどこにあるかを、**いまつながっている先から**書く（決まり7e・判定を2か所に書かない）。
   Artifact では `db`（共有の場所）に入るので、リンクを開いた人に見える。
   Android アプリには `db` が無いので、**端末の中だけ**——共有の心配そのものが無い。
   **固定の文を置かないこと。** 片方では必ず嘘になる。 */
function renderWhere() {
  const el = $("#whereNote"); if (!el) return;
  /* **消すのは助言、残すのは事実と条件**（2026-09-25・本人が例に挙げた場所）。
     4文を1文ずつ見た：
     ①「claude.ai の共有の場所にあります」＝**事実**。残す。
     ②「リンクを開いた人に見えます」＝**同じ事実の中身**。①と1文にまとめる。
     ③「見られて困ることは入れないでください」＝**条件**。**残す。**
        共有したままにしておくという判断は、この条件つきで本人が決めたもので、
        **条件が画面から消えたら判断ごと壊れる**（CLAUDE.md の「共有するかどうか」）。
        ただし②と続けて**1文**にすれば、行は増えない。
     ④「本当の予定は Android アプリのほうへ」＝**助言**。消す。どちらを本物にするかは
        本人がもう決めていて、毎回読ませる必要が無い。
     端末側も同じで、「誰にも渡っていません」は①の言い換え、
     「控えは下の『書き出す（JSON）』で取れます」は**そのボタンがすぐ下に見えている**。
     96字 → **52字**／61字 → **23字**。
     **端末の中だけのときは、出さない**（2026-09-26・本人の指示「この端末のみという表示はいらない」）。
     端末に記録を置くのはアプリとしてふつうのことで、**知らせるべき事実が無い**。
     共有の場所のほうは**条件つきの判断**なので、ここは消さない（事実＋条件の1文）。 */
  el.hidden = !DB;
  el.innerHTML = DB
    ? "<strong>claude.ai の共有の場所にあります。</strong>"
      + "リンクを開いた人に見えるので、見られて困ることは入れないでください。"
    : "";
}

const view = { tab: "p-chat", day: null, ask: null };
function renderAll() {
  if (!view.day) view.day = dayKey(new Date(), state.settings.timezone);
  renderChat(false); renderDay(); renderMe(); renderSettings();
}
/* いま聞いている質問の帯。保存はしない——見せて、本人の言葉を待つだけ。 */
function renderAsk() {
  const el = $("#sayAsk"); if (!el) return;
  const q = TELOS_ASKS.find(x => x.key === view.ask);
  if (!q) { el.hidden = true; el.innerHTML = ""; fitSaybar(); return; }
  el.hidden = false;
  el.innerHTML = `<span class="q">${esc(q.q)}</span>
    <button class="btn sm" data-act="askclose">やめる</button>`;
  fitSaybar();          // 帯が出入りするとバーの高さが変わる（決まり7e・測る所は1つ）
}

function showTab(id) {
  view.tab = id;
  for (const p of document.querySelectorAll(".panel")) p.hidden = p.id !== id;
  for (const b of document.querySelectorAll("nav.tabs button")) {
    if (b.dataset.tab === id) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  }
  document.body.classList.toggle("talking", id === "p-chat");
  // タブを開いたら必ず描き直す（前の操作の結果が古いまま残らないように）
  if (id === "p-day") renderDay();
  else if (id === "p-me") renderMe();
  else if (id === "p-set") renderSettings();
  if (id === "p-chat") { renderChat(true); renderAsk(); setTimeout(() => $("#say").focus(), 30); }
  else { window.scrollTo({ top: 0, behavior: "instant" }); setTimeout(() => window.scrollTo({ top: 0, behavior: "instant" }), 0); }
}

/* シートの開け閉め（v4.3）。閉じる道を4つそろえる：
   ボタン／背景を押す／Escape／端末の戻るボタン。

   **こちらから `history.back()` を呼ばないこと。** 2つの理由で実際に壊れた：
   ① 自分で呼んだ back は遅れて popstate として返るので、
      その間に開いた次のシートを閉じてしまう（「やめる」→すぐ別のシート、で再現）。
   ② headless Edge では back を呼ぶと**ページが終わらなくなり、テストが全部止まる**。
   代わりに、シートを開くときに履歴を1つ積んで、**戻る操作を受け取るだけ**にする。 */
let sheetPushed = false, sheetReturn = null;
function closeSheet() {
  const had = !!$("#sheetHost").firstChild;
  $("#sheetHost").innerHTML = "";
  document.body.classList.remove("sheetopen");
  // 開く前に押していたボタンへフォーカスを戻す（キーボード・読み上げで迷子にならない）
  if (had && sheetReturn && document.contains(sheetReturn)) { try { sheetReturn.focus(); } catch {} }
  sheetReturn = null;
}
/* 何が起きたか分からない失敗を作らない。最後のエラーは設定タブに出す。 */
let lastError = null;
function describeError(e) {
  if (!e) return "原因不明";
  if (typeof e === "string") return e.slice(0, 200);
  const bits = [];
  if (e.code) bits.push(e.code);
  if (e.message) bits.push(e.message);
  if (e.name && !e.message) bits.push(e.name);
  if (!bits.length) { try { bits.push(JSON.stringify(e).slice(0, 160)); } catch { bits.push(String(e)); } }
  const where = e.stack ? String(e.stack).split("\n")[1] : "";
  return bits.join(" / ") + (where ? "  @" + where.trim().slice(0, 80) : "");
}
/* **消したら、その場で戻せること**（2026-09-24・本人の指示）。
   戻す道はもともと `undone` / `undrop` としてあったが、**入口が
   折りたたみの「振り返り」の中だけ**だった。押し間違いが怖いままだと
   行のボタンを減らせないので、ここを先に直す。
   `undo` は `{label, run}`。**渡されたときだけ**ボタンが出る（決まり7「無くても動く」）。
   戻すボタンがあるときは、読んで押すだけの時間を置く（2.6秒→7秒）。 */
const TOAST_MS = 2600, TOAST_UNDO_MS = 7000;
let toastTimer = null, toastUndo = null;
function toast(msg, undo) {
  const el = $("#toast"); if (!el) return;
  toastUndo = (undo && typeof undo.run === "function") ? undo : null;
  el.innerHTML = `<span class="tmsg">${esc(msg)}</span>`
    + (toastUndo ? `<button class="btn tundo" data-act="toastundo">${esc(toastUndo.label || "元に戻す")}</button>` : "");
  el.classList.toggle("hasundo", !!toastUndo);
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; toastUndo = null; }, toastUndo ? TOAST_UNDO_MS : TOAST_MS);
}
function hideToast() { const el = $("#toast"); if (el) el.hidden = true; toastUndo = null; }
/* 項目を、触る前の姿に戻す。**`history` は消さない**——
   「完了にした」「元に戻した」の両方が残らないと、何が起きたか読めなくなる。
   **保存できたときだけ「戻しました」と言う**（決まり6d）。 */
const snapItem = it => { try { return JSON.parse(JSON.stringify(it)); } catch { return null; } };
async function restoreItems(snaps, what) {
  let n = 0;
  for (const before of (snaps || [])) {
    if (!before || !before.id) continue;
    const cur = findItem(before.id);
    if (!cur) continue;
    const hist = (cur.history || []).concat({ at: new Date().toISOString(), by: "user", what });
    for (const k of Object.keys(cur)) if (!(k in before)) delete cur[k];
    Object.assign(cur, before);
    cur.history = hist;
    await putItem(cur); n++;
  }
  renderAll();
  toast(n ? (n === 1 ? "戻しました" : n + "件を戻しました") : "戻す項目が見つかりませんでした");
  return n;
}
/* 押せたことを指に返す（2026-09-24）。**無い環境でも落とさない**——
   `navigator.vibrate` はブラウザにも殻にも無いことがある（決まり7と同じ理屈）。 */
/* ── A：終わったときに気持ちいい（2026-09-26・本人の指示）──
   ①消える前に「済んだ」が見える（`celebrate`）②その日の最後の1つなら、そう言う（`finishedLine`）。
   **動きは0.4秒だけ。** 動きを減らす設定の端末では待たない（すぐ描き直す）。
   **状態を変えてから光らせる**——保存に失敗したものを祝わない（決まり6d）。 */
function celebrate(el, id) {
  let reduce = false;
  try { reduce = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches); } catch {}
  let row = el && el.closest ? el.closest(".swipe, .item, .tlrow") : null;
  if (!row && id) row = [...document.querySelectorAll("[data-swipe]")].find(x => x.dataset.swipe === id) || null;
  if (!row || reduce) return Promise.resolve();
  row.classList.add("celebrate");
  return new Promise(r => setTimeout(r, 420));
}
/* 今日の予定表に入っていた（または今日が期限・今日やると言った）ものか。完了にする**前**に見る。 */
function isTodays(it, k) {
  if (it.dayKey === k || it.targetDay === k) return true;
  try { return planFor(k).blocks.some(b => b.item && b.item.id === it.id); } catch { return false; }
}
/* その日の最後の1つを終えたときだけ、一言足す。判定は `leftToday` ひとつ（決まり7e）。 */
function finishedLine(k) {
  try {
    if (k !== dayKey(new Date(), state.settings.timezone)) return "";
    return leftToday(planFor(k)) === 0 ? "。今日の予定は、これで全部です" : "";
  } catch { return ""; }
}
function buzz(ms) {
  try { if (typeof navigator !== "undefined" && typeof navigator.vibrate === "function") navigator.vibrate(ms || 12); }
  catch {}
}
function openSheet(html) {
  sheetReturn = document.activeElement;
  $("#sheetHost").innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="inner">${html}</div></div>`;
  document.body.classList.add("sheetopen");
  $("#sheetHost .sheet").addEventListener("click", e => { if (e.target === e.currentTarget) closeSheet(); });
  if (!sheetPushed) { try { history.pushState({ sheet: 1 }, ""); sheetPushed = true; } catch {} }
  const first = $("#sheetHost").querySelector("button,input,select,textarea,[href]");
  if (first) setTimeout(() => { try { first.focus(); } catch {} }, 0);
}
// 端末の戻るボタン（Android）。シートが開いていれば、ページを離れずに閉じるだけにする
window.addEventListener("popstate", () => {
  if ($("#sheetHost").firstChild) {
    closeSheet();

    try { history.pushState({ sheet: 1 }, ""); sheetPushed = true; } catch { sheetPushed = false; }
  } else {
    sheetPushed = false;      // 見張りを使い切った。次の「戻る」はページを離れる
  }
});

      hl = esc(t.slice(0, ev.start)) + "<mark>" + esc(t.slice(ev.start, ev.end)) + "</mark>" + esc(t.slice(ev.end));
    } else if (ev.text && t.includes(ev.text)) {
      const i = t.indexOf(ev.text);
      hl = esc(t.slice(0, i)) + "<mark>" + esc(ev.text) + "</mark>" + esc(t.slice(i + ev.text.length));
    } else hl = esc(t);

/* =======================================================================
