   ======================================================================= */
function findItem(id) { return state.items.find(i => i.id === id); }
function note(it, what) { it.history = (it.history || []).concat({ at: new Date().toISOString(), by: "user", what }); }

async function act(a, id, el) {
  const tz = state.settings.timezone;
  /* トーストの「元に戻す」。**いちばん上で処理して return する**——
     下の `findItem` の門は項目のidを前提にしていて、ここは項目のidを持たない
     （決まり「note の id を渡す操作は guard より上で処理する」と同じ理屈）。 */
  /* **空の欄から、その場で始められること**（2026-09-24・案③）。
     「まだありません。」だけで終わらせない。行き先は**上の貼り付け欄ひとつ**なので、
     新しい画面も欄も作らない（決まり「タブは4つ」「欄を増やさない」と同じ理屈）。
     `findItem` の門より上に置くこと——下だと「項目が見つかりません」で黙って終わる。 */
  /* C：会話の下のカードから、今日の予定表へ。**`findItem` の門より上**に置く（id を持たない）。 */
  if (a === "openday") {
    view.day = dayKey(new Date(), tz);
    showTab("p-day");
    return;
  }
  if (a === "gotopaste") {
    showTab("p-me");
    const el = $("#docText");
    if (!el) { toast("貼り付ける欄が見つかりませんでした"); return; }
    // 渡す欄はたたんである（2026-09-26）。**開いてから**でないと、焦点を当てられない
    const fold = el.closest("details"); if (fold) fold.open = true;
    el.scrollIntoView({ block: "center" });   // 動かさない（動きを減らす設定を尊重する）
    el.focus();
    return;
  }
  if (a === "toastundo") {
    const u = toastUndo;
    hideToast();
    if (!u) { toast("戻せるものがありません"); return; }
    await u.run();
    return;
  }
  /* **提案した予定は、1手で全部消せること**（v6.5）。こちらが足したものなので、
     1件ずつ消させない。本人が言ったものには触らない。 */
  if (a === "clearsug") {
    const hit = state.items.filter(i => i.suggested && i.dayKey === id && i.status === "open");
    if (!hit.length) { toast("消す提案がありません"); return; }
    const yes = await askConfirm({ title: "提案した予定を消しますか？",
      body: `アプリが提案して入れた <strong>${hit.length}件</strong>を消します。<br>あなたが言った予定は残します。`,
      yes: `${hit.length}件を消す`, danger: true });
    if (!yes) return;
    const snaps = hit.map(snapItem);
    for (const i of hit) { i.status = "dropped"; i.updatedAt = new Date().toISOString();
      i.history = (i.history || []).concat({ at: i.updatedAt, by: "user", what: "提案をまとめて取り消した" });
      await putItem(i); }
    renderAll();
    toast(`提案した${hit.length}件を消しました`,
      { label: "元に戻す", run: () => restoreItems(snaps, "まとめて消したのを元に戻した") });
    return;
  }
  if (a === "goalplan") { const g = findItem(id); if (!g) { toast("この項目が見つかりませんでした"); return; } openGoalPlan(g); return; }
  if (a === "goalplansave") {
    const g = findItem(id); if (!g) { toast("この項目が見つかりませんでした"); return; }
    const t = ($("#gpT").value || "").trim(), h = $("#gpH").value, m = Math.round(+$("#gpM").value);
    /* **時刻は本人が決める**（決まり6a）。空のまま押されたら、こちらで決めずに言う。 */
    if (!t) { $("#gpMsg").textContent = "予定の名前を入れてください。"; return; }
    if (!/^\d{1,2}:\d{2}$/.test(h || "")) { $("#gpMsg").textContent = "時刻を選んでください。"; return; }
    if (!(m >= 5 && m <= 600)) { $("#gpMsg").textContent = "長さは5〜600分で入れてください。"; return; }
    const kind = ["daily", "weekday", "weekly"].includes($("#gpR").value) ? $("#gpR").value : "daily";
    const today = dayKey(new Date(), tz), [y, mo, dd] = today.split("-").map(Number), [hh, mm] = h.split(":").map(Number);
    const st = zoned(y, mo, dd, hh, mm, tz), nowISO = new Date().toISOString();
    const repeat = { kind };
    if (kind === "weekly") repeat.dow = parts(new Date(), tz).dow;
    const ev = {
      id: uid(), noteId: g.noteId || null, kind: "event", title: t, origin: "user", corrected: false, confirmed: true,
      status: "open", evidence: g.evidence || { text: g.title }, createdAt: nowISO, updatedAt: nowISO,
      history: [{ at: nowISO, by: "user", what: `続けたいこと「${g.title}」から予定にした` }],
      dayKey: today, duePrecision: "exact", fixed: true, start: st.toISOString(),
      end: new Date(st.getTime() + m * 60000).toISOString(), repeat, goalId: g.id
    };
    ev.dedupeKey = dedupeKey(ev);
    const gBefore = snapItem(g);
    await putItem(ev);
    g.planId = ev.id; note(g, `予定にした：${repeatJa(repeat)} ${h}から${durJa(m)}`); await putItem(g);
    closeSheet(); renderAll();
    toast(`予定にしました：${repeatJa(repeat)} ${h}から「${t}」`,
      { label: "元に戻す", run: () => restoreItems([gBefore, Object.assign(snapItem(ev), { status: "dropped" })], "予定にしたのを元に戻した") });
    return;
  }
  if (a === "ideatask") {
    const it = findItem(id); if (!it) { toast("この項目が見つかりませんでした"); return; }
    if (it.kind !== "idea") { toast("これは気になっていることではありません"); return; }
    const before = snapItem(it);
    it.kind = "task"; it.confirmed = true; it.duePrecision = it.duePrecision || "none";
    if (it.note && !it.title) it.title = it.note;
    note(it, "気になっていることから、やることにした");
    it.dedupeKey = dedupeKey(it);
    await putItem(it); renderAll();
    toast(`やることにしました：${it.title}（スケジュールの「タスク」）`,
      { label: "元に戻す", run: () => restoreItems([before], "やることにしたのを元に戻した") });
    return;
  }
  if (a === "addmanual") {
    const t = $("#mT").value.trim(); if (!t) return;
    const kind = $("#mK").value, d = $("#mD").value, h = $("#mH").value || "09:00", e = +$("#mE").value || 60;
    const [y, mo, dd] = d.split("-").map(Number); const [hh, mm] = h.split(":").map(Number);
    const start = zoned(y, mo, dd, hh, mm, tz).toISOString();
    const it = {
      id: uid(), noteId: null, kind, title: t, origin: "user", corrected: false, confirmed: true,
      status: "open", evidence: { text: "（手入力）" }, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
      history: [{ at: new Date().toISOString(), by: "user", what: "手入力で追加" }], dayKey: d, duePrecision: "exact"
    };
    if (kind === "event") { it.fixed = true; it.start = start; it.end = new Date(zoned(y, mo, dd, hh, mm, tz).getTime() + e * 60000).toISOString(); }
    else { it.fixed = false; it.due = start; it.estimateMin = e; it.dueIsDeadline = true; }
    it.dedupeKey = dedupeKey(it);
    await putItem(it); closeSheet(); renderAll(); return;
  }
  if (a === "blk") {                       // 枠をたたむ・開く
    const row = el && el.closest(".tlrow");
    if (row) { const open = row.classList.toggle("open"); el.setAttribute("aria-expanded", open ? "true" : "false"); }
    /* 一度開けたら、案内はもう要らない（2026-09-25）。
       **ここで描き直さないこと**——開いたばかりの枠が、その場で閉じる。
       次にこのタブを開いたときに消える。 */
    markTip("openblk");
    return;
  }
  /* まだ聞いていないことを、会話で聞く。**ここでは何も保存しない**——
     質問を出して入力欄へ移すだけで、答えはふつうの読み取りが「わたしのこと」にする。 */
  if (a === "telosask") {
    if (!TELOS_ASKS.some(x => x.key === id)) { toast("この質問は見つかりませんでした"); return; }
    view.ask = id;
    showTab("p-chat");
    return;
  }
  if (a === "askclose") { view.ask = null; renderAsk(); return; }
  if (a === "confirmprof") {
    const list = state.items.filter(i => i.kind === "profile" && i.status === "open" && !i.confirmed && !i.corrected);
    for (const x of list) { x.confirmed = true; note(x, "まとめて確認した"); await putItem(x); }
    toast(`${list.length}件を確認済みにしました`); renderAll(); return;
  }
  if (a === "docopen") {
    const d = state.docs.find(x => x.id === id);
    if (!d) { toast("この資料は見つかりませんでした"); return; }
    openSheet(`<h3>${esc(d.title || d.sourceName || "渡した資料")}</h3>
      <p class="hint">${fmtDT(d.createdAt, tz)} に渡したもの・${d.chars.toLocaleString()}文字${d.truncated ? "（長すぎたため先頭だけ保存しています）" : ""}</p>
      <div class="evid" style="white-space:pre-wrap;max-height:48vh;overflow:auto">${esc(d.text)}</div>
      <div class="foot"><button class="btn pri" data-close style="margin-left:auto">閉じる</button></div>`);
    return;
  }
  if (a === "docitems") {
    const d = state.docs.find(x => x.id === id);
    const made = state.items.filter(x => x.docId === id);
    openSheet(`<h3>この資料から読み取ったもの</h3>
      <p class="hint">${esc((d && (d.title || d.sourceName)) || "資料")} から ${made.length}件。合っていないものは「…」から直せます。</p>
      <div class="stack">${made.length ? made.map(x => itemHTML(x)).join("") : '<div class="card empty">まだ何も読み取れていません。</div>'}</div>
      <div class="foot"><button class="btn pri" data-close style="margin-left:auto">閉じる</button></div>`);
    return;
  }
  if (a === "docai") {                       // 全文を送る前に、必ず確認を出す（v5.8）
    const d = state.docs.find(x => x.id === id);
    if (!d) { toast("この資料は見つかりませんでした"); return; }
    if (await confirmDocAI(d, "資料そのものと、ルールで読み取ったもの")) await runDocAI(id);
    return;
  }
  if (a === "docdel") {
    const d = state.docs.find(x => x.id === id);
    if (!d) { toast("この資料は見つかりませんでした"); return; }
    const made = state.items.filter(x => x.docId === id && x.status !== "dropped").length;
    const yes = await askConfirm({
      title: "この資料を消しますか？",
      body: `「${esc(d.title || d.sourceName || "渡した資料")}」を消します。<br>
        ここから読み取った<strong>${made}件は残ります</strong>が、元の文章に戻って確かめられなくなります。`,
      yes: "資料を消す", danger: true
    });
    if (!yes) return;
    if (!await delDoc(id)) {
      renderSettings(); toast("保存先から消せませんでした。設定の「最後に起きた不具合」を見てください");
      return;
    }
    toast("資料を消しました"); renderAll(); return;
  }
  /* 会話の「原文」から開くシート。**原文を消す唯一の入口でもある**
     （2026-09-20）。設定タブの「保存されている原文」を外したとき、
     「この原文を消す」がそこにしか無かったので、ここへ引っ越した。
     決まり「画面から何かを消すときは、そこにしか入口が無いものを先に探して引っ越す」。 */
  if (a === "shownote") {
    const n = state.notes.find(x => x.id === id);
    const derived = state.items.filter(x => x.noteId === id);
    openSheet(`<h3>この発話から作られたもの</h3>
      ${n ? `<div class="evid" style="white-space:pre-wrap">${esc(n.text).replace(/\n/g, "<br>")}</div>
      <p class="hint">記録日時 <span class="mono">${fmtDT(n.capturedAt, tz)}</span>（${esc(tz)}基準）</p>` : `<div class="note info">原文が見つかりません。</div>`}
      <div class="stack">${derived.length ? derived.map(x => itemHTML(x)).join("") : '<div class="card empty">この発話からは何も作られていません。</div>'}</div>
      <div class="foot">
        ${n ? `<button class="btn danger" data-act="delnote" data-id="${n.id}">この原文を消す</button>` : ""}
        <button class="btn pri" data-close style="margin-left:auto">閉じる</button></div>`);
    return;
  }
  // ↓ ここから下は「項目」のid。原文(note)のidを渡す操作は、必ずこの上で処理して return すること。
  //    （delnote は note の id なので、findItem では見つからず黙って何もしない状態になっていた）
  if (a === "delnote") {
    const n = state.notes.find(x => x.id === id);
    if (!n) { toast("この原文は見つかりませんでした"); return; }
    const made = state.items.filter(x => x.noteId === id).length;
    const yes = await askConfirm({
      title: "この発言の原文を消しますか？",
      body: `消すと、ここから作られた${made}件の項目の「根拠」がたどれなくなります。項目そのものは残ります。<br><br><span class="quote">${esc(n.text.slice(0, 120))}</span>`,
      yes: "原文を消す", danger: true
    });
    if (!yes) return;
    if (!await deleteFromStore("notes/" + id)) {     // 消せていないなら手元も消さない（戻ってくるため）
      renderSettings(); toast("保存先から消せませんでした。設定の「最後に起きた不具合」を見てください");
      return;
    }
    state.notes = state.notes.filter(x => x.id !== id); lsWrite();
    closeSheet();                      // 消した原文の画面を開いたままにしない
    toast("原文を消しました");
    renderAll();
    return;
  }

  const it = findItem(id);
  if (!it) { toast("この項目が見つかりませんでした。画面を開き直してください。"); return; }

  /* くり返しの予定は「その日のぶん」だけを終わりにする（v4.3）。
     status を done にすると**シリーズごと消える**（来週のゼミまで無くなる）。 */
  if ((a === "done" || a === "skipday") && it.repeat) {
    const snapBefore = snapItem(it);
    const d = (el && el.dataset && el.dataset.day) || view.day || dayKey(new Date(), tz);
    const f = a === "done" ? "doneDays" : "skipDays";
    if (!(it[f] || []).includes(d)) it[f] = (it[f] || []).concat(d).slice(-400);
    note(it, `${d} の分を${a === "done" ? "終わりにした" : "やらないことにした"}`);
    await putItem(it);
    const fin = a === "done" ? finishedLine(d) : "";
    if (a === "done") await celebrate(el, id);
    buzz(fin ? [12, 60, 24] : undefined); closeSheet();
    toast(`${d.slice(5).replace("-", "/")} の分だけ${a === "done" ? "終わりにしました" : "外しました"}：${it.title}${fin}`,
      { label: "元に戻す", run: () => restoreItems([snapBefore], "その日の分を元に戻した") });
    renderAll(); return;
  }
  if (a === "skipday") { toast("これはくり返しの予定ではありません"); return; }
  if (a === "more") { openMore(it); return; }
  /* **消えたように見える操作には、必ず「元に戻す」を添える**（2026-09-24）。
     触る前の姿をここで写しておく。`putItem` が成功してから知らせる（決まり6d）。 */
  const before = snapItem(it);
  const undoOf = what => ({ label: "元に戻す", run: () => restoreItems([before], what) });
  if (a === "done") {
    const k = dayKey(new Date(), tz);
    const forToday = isTodays(it, k);
    it.status = "done"; it.completedAt = new Date().toISOString(); note(it, "完了にした"); await putItem(it);
    const fin = forToday ? finishedLine(k) : "";
    await celebrate(el, id);
    buzz(fin ? [12, 60, 24] : undefined);
    toast(`完了にしました：${it.title}${fin}`, undoOf("完了を元に戻した"));
  }
  else if (a === "undone") { it.status = "open"; delete it.completedAt; note(it, "未完了に戻した"); await putItem(it); toast("未完了に戻しました"); }
  else if (a === "confirm") { it.confirmed = true; note(it, "読み取り結果を確認した"); await putItem(it); toast("確認済みにしました"); }
  else if (a === "drop") {
    it.status = "dropped"; it.confirmed = true; note(it, "取り消した"); await putItem(it); closeSheet();
    toast(`取り消しました：${it.title}`, undoOf("取り消しを元に戻した"));
  }
  else if (a === "undrop") { it.status = "open"; note(it, "取り消しを戻した"); await putItem(it); toast("戻しました"); }
  else if (a === "delitem") {
    /* 1件だけ、記録ごと消す（v4.3）。
       今までは「取り消す」しか無く、記録は残り続けて件数の上限を食っていた。
       これは戻せないので、「取り消す」との違いをはっきり書いてから消す。 */
    const yes = await askConfirm({
      title: "この項目を完全に消しますか？",
      body: `「${esc(it.title)}」を記録ごと消します。<strong>取り消せません</strong>（「取り消す」なら振り返りから戻せます）。<br>
        原文は残るので、同じことを話すとまた読み取られます。`,
      yes: "完全に消す", danger: true
    });
    if (!yes) return;
    if (!await deleteFromStore("items/" + it.id)) {  // 消せていないなら手元も消さない
      closeSheet(); renderSettings();
      toast("保存先から消せませんでした。設定の「最後に起きた不具合」を見てください");
      return;
    }
    state.items = state.items.filter(x => x.id !== it.id); lsWrite();
    closeSheet(); toast(`完全に消しました：${it.title}`); renderAll(); return;
  }
  else if (a === "defer") {
    const cur = it.dayKey || dayKey(new Date(), tz);
    const nxt = dayKey(new Date(keyToDate(cur, tz).getTime() + 86400000), tz);
    const [y, mo, d] = nxt.split("-").map(Number);
    const old = it.due ? parts(new Date(it.due), tz) : null;
    it.due = zoned(y, mo, d, old && it.duePrecision === "exact" ? old.h : 23, old && it.duePrecision === "exact" ? old.mi : 59, tz).toISOString();
    it.dayKey = nxt; it.corrected = true; it.confirmed = true;
    it.dedupeKey = dedupeKey(it);
    note(it, `${cur} から ${nxt} へ延期した`);
    await putItem(it);
    buzz();
    toast(`${nxt.slice(5).replace("-", "/")} に移しました：${it.title}`, undoOf("延期を元に戻した"));
  }
  else if (a === "est") { openEst(it); return; }
  else if (a === "setest") {
    const m = +el.dataset.min; const old = it.estimateMin;
    it.estimateMin = m; it.corrected = true; it.confirmed = true;
    note(it, `所要時間を ${old == null ? "未設定" : old + "分"} → ${m}分 に直した`);
    await putItem(it); closeSheet();
    toast(`${durJa(m)}に直して、計画を作り直しました`);
  }
  else if (a === "usealt") {
    // 午前／午後のもう一方を選んだ。こちらの推測ではなく本人が決めたことになる
    if (!it.whenAlt) { toast("この項目に、もう一方の読み方はありません"); return; }
    const alt = it.whenAlt, was = fmtDT(it.start || it.due, tz);
    if (it.kind === "event") {
      it.start = alt.start;
      it.end = alt.end || new Date(new Date(alt.start).getTime() +
        ((it.end && it.start ? (new Date(it.end) - new Date(it.start)) / 60000 : 60)) * 60000).toISOString();
    } else {
      it.due = alt.start;
    }
    it.dayKey = alt.dayKey;
    it.whenAlt = null; it.corrected = true; it.confirmed = true;
    it.dedupeKey = dedupeKey(it);
    note(it, `時刻を ${was} → ${fmtDT(alt.start, tz)} に直した（午前/午後の読み違い）`);
    await putItem(it);
    toast(`${fmtDT(alt.start, tz)} に直しました`);
  }
  else if (a === "evid") { openEvidence(it); return; }
  else if (a === "edit") { openEdit(it); return; }
  else if (a === "save") {
    const changes = [];
    const nt = $("#eT").value.trim(); if (nt && nt !== it.title) { changes.push(`内容「${it.title}」→「${nt}」`); it.title = nt; }
    const nk = $("#eK").value; if (nk !== it.kind) { changes.push(`種類 ${KIND_JA[it.kind]}→${KIND_JA[nk]}`); it.kind = nk; }
    const d = $("#eD").value, h = $("#eH").value, prec = $("#eP").value;
    if (d) {
      const [y, mo, dd] = d.split("-").map(Number);
      const [hh, mm] = (h || "23:59").split(":").map(Number);
      const iso = zoned(y, mo, dd, hh, mm, tz).toISOString();
      if (it.kind === "event") { it.start = iso; it.end = new Date(new Date(iso).getTime() + ((+$("#eE").value || 60) * 60000)).toISOString(); it.fixed = true; }
      else it.due = iso;
      it.dayKey = d; changes.push(`日付を ${d}${h ? " " + h : ""} に`);
    } else if (prec === "none") { it.due = null; it.dayKey = null; changes.push("期限をなしに"); }
    it.duePrecision = prec;
    const ev = $("#eE").value; const nv = ev === "" ? null : +ev;
    if (it.kind === "task" && nv !== it.estimateMin) { changes.push(`所要時間 ${it.estimateMin == null ? "未設定" : it.estimateMin + "分"}→${nv == null ? "未設定" : nv + "分"}`); it.estimateMin = nv; }
    if (it.kind === "event") it.timeUnknown = !h;     // 時刻を入れたら時間割に載せる
    it.corrected = true; it.confirmed = true; it.whenAlt = null; it.dedupeKey = dedupeKey(it);
    note(it, "訂正：" + (changes.join(" / ") || "変更なし"));
    await putItem(it); closeSheet();
    toast(changes.length ? "直しました：" + changes.join(" / ") : "変更はありませんでした");
  }
  renderAll();
}

/* サンドボックス内では window.confirm が表示されず false になる。
   確認は必ずこのページ内のシートで行う。ブラウザのダイアログを使わない。 */
/* `alt` を渡すと3つ目の道が出る（返り値は `"alt"`）。**渡さなければ今までどおり** true/false。
   「全部足す／一部だけ足す／やめる」のように、**やめる以外の逃げ道**が要るときだけ使う。 */
function askConfirm({ title, body, yes, danger, alt }) {
  return new Promise(resolve => {
    let done = false;
    const finish = v => { if (done) return; done = true; closeSheet(); resolve(v); };
    openSheet(`<h3>${esc(title)}</h3><p class="hint">${body}</p>
      <div class="foot">
        <button class="btn ${danger ? "danger" : "pri"} wide" id="cfYes">${esc(yes)}</button>
        ${alt ? `<button class="btn" id="cfAlt">${esc(alt)}</button>` : ""}
        <button class="btn" id="cfNo" style="margin-left:auto">やめる</button>
      </div>`);
    $("#cfYes").addEventListener("click", () => finish(true));
    if (alt) $("#cfAlt").addEventListener("click", () => finish("alt"));
    $("#cfNo").addEventListener("click", () => finish(false));
    $("#sheetHost .sheet").addEventListener("click", e => { if (e.target === e.currentTarget) finish(false); });
  });
}

/* =======================================================================
   発話 → 操作（ops）→ 適用
   AIが使えないときはルールだけで同じ流れが成立する。
   ops はすべて検証してから適用する。AIの言い値では書き換えない。
   ======================================================================= */
const OPS = ["add", "update", "done", "defer", "drop", "prefer", "memo", "condition", "profile", "progress", "idea"];
const PREF_KEYS = ["nextOnly", "buffer", "noEveningWork", "noSuggest", "free"];
/* 「夜は予定を入れないで」の既定＝18:00（分）。**3か所に同じ数字が散っていた**（v6.0・5周目）。
   ルールが作る値・検算のフォールバック・`prefs` の読み取り、その全部でこれを使う。
   **`WINDOWS.afternoon` の `18 * 60` とは別物**——あちらは「午後の終わり」で、意味が違う。
   同じ数字でも意味が違うものは、まとめてはいけない。 */
const EVENING_DEFAULT_MIN = 18 * 60;
const isDate = s => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
const isTime = s => typeof s === "string" && /^\d{1,2}:\d{2}$/.test(s);
const num = (v, lo, hi) => (typeof v === "number" && isFinite(v)) ? clamp(Math.round(v), lo, hi) : null;

function isoFrom(dateStr, timeStr, tz) {
  const [y, mo, d] = dateStr.split("-").map(Number);
  const [h, mi] = (isTime(timeStr) ? timeStr : "23:59").split(":").map(Number);
  return zoned(y, mo, d, h, mi, tz).toISOString();
}
function evidenceOf(note, quote) {
  const q = typeof quote === "string" ? quote.trim() : "";
  const i = q ? note.text.indexOf(q) : -1;
  return i >= 0 ? { text: q, start: i, end: i + q.length } : { text: q || note.text.slice(0, 60), start: null, end: null };
}

/* 発話から、その場で確定できる更新をルールだけで拾う */
const RE_FINISH = /(できた|出来た|終わった|終わりました|終えた|送った|送信した|提出した|済んだ|済ませた|完了|やった(よ|わ)?$)/;
const RE_NEXTONLY = /((一つ|ひとつ|1つ)(だけ)?|次にやること(だけ)?).{0,12}(分かる|わかる|表示|出して|教えて|の方が|でいい|にして)/;
const RE_BUFFER = /(詰めすぎ|詰め込ま|余裕を持|余裕がほしい|余裕が欲しい|ゆとり)/;
const RE_NOEVENING = /(夜まで.{0,6}(したくない|やりたくない|作業)|早めに寝|早く寝|夜は.{0,6}(やらない|入れない)|寝る前に.{0,8}始めないように)/;
const RE_KEEP = /(見返せる|見返し|残しておき|残しておいて|あとで読|後で読|メモしておいて)/;
/* 家にあるもの・食材の話。あとで「何を食べよう」と聞かれたときに参照する。 */
const RE_PANTRY = /(冷蔵庫|家にある|うちにある|家にあった|残ってる|残っている|ストック|買っておいた|買ってある)/;
const RE_RESTATE = /(じゃなくて|ではなく|やっぱり|やっぱ|に変更|変えて|あと\s*\d+\s*(分|時間)|もう少しかか|もうちょっとかか|思ったより|かかってる|かかりそう|延ばして|後ろに|遅らせ)/;
/* 言い直しかどうかの判定は **1か所にまとめる**（v5.4）。
   ルールの中に同じ判定が2つあり、幅が違っていたので取りこぼした。 */
const looksRestating = t => RE_RESTATE.test(t)
  || /にして[。、]?$|に変えて|じゃなくて|ではなく|さっきの|さっき言った/.test(t);

/* --- 発言の意図を分ける。全部をタスクにしないための入口 --- */
// 質問・相談。タスクを作らず、いまの状態から答える。
const RE_ASK = /[?？]$|(どうしよう|どうしたら|どうすれば|何しないといけな|何をすれば|何かある|何がある|何を後回し|後回しにできる|削れる|減らせる|どれ(が|を)|何(が|を)いい|教えて|どう思う|いいかな$|かな[?？]?$)/;
/* 文が「問いかけ」で終わっているか。タスクの言い方（〜しないといけない）を含んでいても、
   問いかけならタスクにしない。「今日何しないといけなかったっけ」はタスクではなく質問。 */
const RE_QUESTION_END = /([?？]|っけ[。、\s]*$|かな[。、\s]*$|かなあ[。、\s]*$|どうしよう|どうしたら|どうすれば|何を後回し|後回しにできる|いいかな)/;
// 迷い・思いつき。決定でも実行許可でもない。
const RE_MAYBE = /(迷って|どうしようかな|しようかな|しよかな|かもしれない|かもな|いつか|そのうち|できたら|面白そう|考えてみたい|気になる|やってみたい(な|なあ)?$|したいな)/;
// 進捗の申告。完了ではない。
const RE_PROGRESS = /(進んでない|進んでいない|あまり進ま|全然進ま|途中|まだ終わ|まだ半分|半分くらい|半分まで|思ったより時間|時間かかってる|あと\s*\d+\s*(分|時間))/;
// 気持ちだけの発言。行動提案を押し付けない。
const RE_FEELINGONLY = /^(そっか|うーん|はぁ|疲れた|しんどい|眠い|だるい|つらい|楽しかった|よかった|まあよかった)[。、！!…\s]*$/;

/* 「できれば今日」「午前中に」——締切とは別の、実行したい時期 */
function parseIntent(text) {
  const t = halfWidth(text);
  const out = { window: null, wantToday: false, wantTomorrow: false };
  if (RE_WIN_MORNING.test(t)) out.window = "morning";
  else if (RE_WIN_AFTERNOON.test(t)) out.window = "afternoon";
  else if (RE_WIN_EVENING.test(t)) out.window = "evening";
  if (/(できれば|できたら|なるべく|可能なら|今日中に|今日のうちに)\s*.{0,6}(今日|きょう)?/.test(t) && /(今日|きょう|午前|午後)/.test(t)) out.wantToday = true;
  if (/(今日|きょう)(中)?に?(は)?(進め|やっ|終わら|送っ|片付け)/.test(t)) out.wantToday = true;
  return out;
}

/* 見出しの「中身の語」（漢字・カタカナ・英字の2文字以上のかたまり）だけで照合する。
   「資料できた」→「言ってた資料を作る」に当てられるが、助詞では当たらない。 */
function contentWords(s) {
  return String(s || "").match(/[一-鿿々ヶ]{2,}|[ァ-ヴー]{2,}|[A-Za-z]{2,}/g) || [];
}
/* 同じ用事を指しているか。「打ち合わせ」のように漢字とひらがなが交互だと
   contentWords では拾えないので、正規化した見出しの包含も見る。 */
function sameTopic(a, b) {
  const x = norm(a), y = norm(b);
  if (x.length < 2 || y.length < 2) return false;
  if (x.includes(y) || y.includes(x)) return true;
  const w = contentWords(a);
  return w.length > 0 && contentWords(b).some(t => w.includes(t));
}
function matchOpenTask(text) {
  const open = liveItems().filter(i => i.kind === "task" && i.status === "open");
  const hits = open.filter(t => contentWords(t.title).some(w => text.includes(w)));
  return hits.length === 1 ? hits[0] : null;
}

function ruleOps(note) {
  const ops = [], text = halfWidth(note.text), raw = note.text, q = raw.slice(0, 60);
  /* **「組み立てて」は用事でも目標でもない**（v6.5）。ふつうの読み取りへ流すと、
     依頼文が `goal` として保存され、活動は「その間にお風呂とご飯それぞれずつ使う」の
     ような1件のゴミ見出しになる（実測）。専用の道で受ける。 */
  const dayReq = parseDayRequest(note, state.settings.timezone);
  if (dayReq) {
    const out = [{ op: "buildday", req: dayReq, quote: q }];
    /* **組み立ての時間帯より前に言ったことは、捨てない**（v8.6・実機で報告）。
       「5時から7時まで勉強して8時から10まで適当に予定を埋めて」の**前半**は、
       埋める中身ではなく**それ自体が予定**。組み立てだけを返していたので消えていた。
       原文の先頭からの切り出しなので、根拠の位置は元のままずれない。 */
    if (dayReq.headLen > 0) {
      const head = Object.assign({}, note, { text: note.text.slice(0, dayReq.headLen) });
      for (const it of extractByRule(head, state.settings)) {
        if (it.kind === "condition") { out.push({ op: "condition", text: it.selfReport, quote: it.evidence.text }); continue; }
        out.push({ op: "add", _built: it, quote: it.evidence.text });
      }
    }
    return out;
  }
  /* **頼まれたのに組み立てられなかったことを、黙らない**（v6.8・決まり5 と同じ理屈）。
     「9時から12時の間で」を17時に言うと 21:00〜翌0:00 と読めてしまい、時間帯が決まらない。
     何も言わないと、依頼文が目標として保存されるだけで**組み立てられなかったことが分からない**。 */
  if (RE_BUILD_DAY.test(text) && /\d{1,2}\s*時/.test(text)) ops.push({ op: "buildfail" });
  // 「明日の打ち合わせ、14時にして」は言い直し。ルールでは対象を決められないが、
  // だからといって新しい予定を作ってはいけない（同じ用事が二重になる）。
  const restating = looksRestating(text);
  let needsAi = false;
  /* **「片付けは提案しないで」は用事ではない**（v7.1・決まり0「AIへの要望は用事にしない」）。
     先に拾っておいて、その文から作られた項目は捨てる。
     これをしないと「タスクを追加：片付けは提案しないで」が予定表に並ぶ（実測）。 */
  const wishSents = [];
  for (const l of splitLines(text)) for (const st of l.sentences) {
    if (suggestKeyIn(st.text) && (RE_NO_SUGGEST.test(st.text) || RE_YES_SUGGEST.test(st.text)))
      wishSents.push(st.text);
  }
  const inWish = t => wishSents.some(sx => sx.includes(t) || t.includes(sx));
  for (const it of extractByRule(note, state.settings)) {
    if (it.evidence && inWish(it.evidence.text)) continue;
    if (it.kind === "condition") { ops.push({ op: "condition", text: it.selfReport, quote: it.evidence.text }); continue; }
    const twin = restating && state.items.find(x =>
      x.status === "open" && x.kind === it.kind && sameTopic(x.title, it.title));
    if (twin) { needsAi = true; continue; }       // 既にあるものの言い直し。作らずに本人へ伝える
    ops.push({ op: "add", _built: it, quote: it.evidence.text });
  }
  if (needsAi) ops.push({ op: "_needs_ai" });
  /* 完了・進捗・延期は「文ごと」に見る。
     「資料できた。友達への連絡はまだ。」を、資料だけ完了として扱うため。 */
  const sents = [];
  for (const l of splitLines(text)) for (const s of l.sentences) sents.push(s.text);
  const NOTYET = /(まだ|これから|していない|してない|できてない|残ってる|残っている)/;
  const doneIds = new Set(), mentioned = new Set();

  for (const s of sents) {
    const t0 = matchOpenTask(s); if (t0) mentioned.add(t0.id);
    // 「お昼食べた」——その日の食事の用事があれば完了にする（語句では照合できないため専用）
    if (RE_MEAL.test(s) && RE_MEAL_DONE.test(s) && !NOTYET.test(s)) {
      const day = dayKey(new Date(note.capturedAt), state.settings.timezone);
      const want = mealTitle(s.replace(RE_MEAL_DONE, "食べる"), note.capturedAt, state.settings.timezone);
      const hit = liveItems().filter(i => i.isMeal && i.status === "open" && i.dayKey === day && (!want || i.title === want));
      if (hit.length === 1 && !doneIds.has(hit[0].id)) {
        ops.push({ op: "done", id: hit[0].id, quote: s.slice(0, 60) }); doneIds.add(hit[0].id);
      }
      continue;
    }
    if (!RE_FINISH.test(s) || NOTYET.test(s)) continue;
    const t = matchOpenTask(s);
    if (t && !doneIds.has(t.id)) { ops.push({ op: "done", id: t.id, quote: s.slice(0, 60) }); doneIds.add(t.id); }
  }
  if (RE_FINISH.test(text) && !doneIds.size) ops.push({ op: "_ambiguous_done" });

  // 進捗（完了にしたものは対象外）
  let progTarget = null, rem = null;
  for (const s of sents) {
    if (!RE_PROGRESS.test(s)) continue;
    const t = matchOpenTask(s);
    if (t && !doneIds.has(t.id)) progTarget = progTarget || t;
    const m = halfWidth(s).match(/あと\s*(\d+)\s*(分|時間)/);
    if (m) rem = m[2] === "時間" ? +m[1] * 60 : +m[1];
  }
  // 「請求書、まだ半分。あと40分かかりそう。」——時間だけの文には名前が無いので、
  // 同じ発話の中で触れた、完了していないタスクが1つならそれに付ける。
  if (!progTarget && rem != null) {
    const cands = [...mentioned].filter(id => !doneIds.has(id));
    if (cands.length === 1) progTarget = findItem(cands[0]);
  }
  if (progTarget) ops.push({ op: "progress", id: progTarget.id, remainingMin: rem, quote: q });
  else if (rem != null && !doneIds.size) ops.push({ op: "_needs_ai" });

  // 「明日以降に回したい」——この発話で触れたもののうち、完了していないものが1つなら延期
  if (/(明日以降|明日に回|明日でいい|後回しに(したい|する)|先送り|翌日に)/.test(text)) {
    const cands = [...mentioned].filter(id => !doneIds.has(id));
    if (cands.length === 1) ops.push({ op: "defer", id: cands[0], toDate: null, quote: q });
    else if (cands.length > 1) ops.push({ op: "_ambiguous_done" });
  }

  // 冷蔵庫にあるもの、家にあるもの。あとで参照できるように残す（断定はしない）
  for (const s of sents) {
    if (!RE_PANTRY.test(s)) continue;
    ops.push({ op: "memo", text: s.slice(0, 160), uncertain: /(と思う|たぶん|はず|かも)/.test(s), quote: s.slice(0, 60) });
  }
  // 「今日は」で始まる希望はその日限り。「しばらく」「これから」はずっと。
  const oneDay = /(今日|今夜|今晩|今の)/.test(text) && !/(しばらく|これから|ずっと|いつも|今後|毎日|基本的に)/.test(text);
  const scope = oneDay ? dayKey(new Date(note.capturedAt), state.settings.timezone) : null;
  if (RE_NEXTONLY.test(text)) ops.push({ op: "prefer", key: "nextOnly", value: true, scopeDay: scope, text: "次にやることを一つだけ見せてほしい", quote: q });
  if (RE_BUFFER.test(text)) ops.push({ op: "prefer", key: "buffer", value: true, scopeDay: scope, text: "予定を詰めすぎず、余裕を持たせてほしい", quote: q });
  if (RE_NOEVENING.test(text)) ops.push({ op: "prefer", key: "noEveningWork", value: EVENING_DEFAULT_MIN, scopeDay: scope, text: "夜は作業を入れないでほしい", quote: q });
  /* 「片付けは提案しないで」「片付けも提案して」（v7.1）。**文ごとに**見る——
     1回の発言で2つ外すことがあるし、他の話題を巻き込まないため。 */
  for (const sx of sents) {
    const k = suggestKeyIn(sx); if (!k) continue;
    const ja = (DAY_FILL.find(f => f.key === k) || {}).title || k;
    if (RE_YES_SUGGEST.test(sx)) ops.push({ op: "unsuggest", key: k, ja, quote: sx.slice(0, 60) });
    else if (RE_NO_SUGGEST.test(sx)) ops.push({ op: "prefer", key: "noSuggest", value: k, scopeDay: null,
      text: `「${ja}」は提案しないでほしい`, quote: sx.slice(0, 60) });
  }
  if (RE_KEEP.test(text)) ops.push({ op: "memo", text: raw.slice(0, 200), quote: q });
  // 言い直し・見積もり直しは、ルールだけでは「どれのことか」を決められない。黙って無視せず伝える。
  // ただし、その発話から実際に何か作れているなら言い直しではないので黙っている。
  /* **上の `restating` と同じ幅で見ること**（v5.4・実機で報告）。
     ここだけ `RE_RESTATE` の狭いほうを使っていたので、
     「さっきの勉強、23時からにして」が **どこにも引っかからず、まるごと黙って消えた**
     （ops 0件・変更0件・知らせ0件）。判定が2か所に分かれると、必ず片方だけ直す。 */
  if (looksRestating(text) && !ops.some(o => ["done", "update", "add"].includes(o.op))) ops.push({ op: "_needs_ai" });
  /* **時間帯を2つ言われたのに1つしか使えなかったら、黙らない**（v8.6・実機で報告・決まり5）。
     「5時から7時まで勉強して8時から10まで散歩する」のように句点が無いと、
     行ぜんぶで1つの話題として読むので、**後ろの範囲がまるごと消える**。
     画面には何も出ないので、本人からは「聞いてもらえなかった」ようにしか見えない。
     数えるのは `rangeSpans` ひとつ（決まり7e）。作れた枠の数と突き合わせる。 */
  const spans = rangeSpans(text);
  if (spans.length >= 2) {
    const made = ops.filter(o => o.op === "add" && o._built && o._built.start && o._built.end).length;
    if (made < spans.length) ops.push({ op: "_lost_range", have: made, said: spans.length });
  }
  return ops;
}

async function applyOps(rawOps, note) {
  const tz = state.settings.timezone, changes = [], asks = [], days = [], kinds = [];
  let habitDay = null;                              // 組み立てた日（まとめて消す道に渡す）
  /* AIが考えた「提案の札」。**先に全部読んでから組み立てる**——
     ops の並び順に頼ると、AIが順番を変えただけで効かなくなる（決まり9）。 */
  const aiFill = [];
  for (const o of rawOps || []) {
    if (!o || o.op !== "dayfill" || !Array.isArray(o.blocks)) continue;
    for (const b of o.blocks) {
      if (aiFill.length >= 9) break;                             // 多すぎる札は受け取らない
      const t = cleanTitle(String((b && b.title) || "").trim(), null).slice(0, 20);
      if (t.length < 2) continue;                                // 名前になっていないものは捨てる
      if (aiFill.some(x => x.title === t)) continue;              // 同じ名前を2つ入れない
      const slot = FILL_SLOTS[String((b && b.slot) || "").trim()] || FILL_SLOTS.middle;
      aiFill.push({
        title: t,
        min: num(b && b.min, 5, 120) || 20,                       // 5〜120分に収める
        w: slot.w, drop: slot.drop,
        why: String((b && b.why) || "").slice(0, 60), key: null, mine: false
      });
    }
  }
  // 用事が1件だけのときに限り、ルールが読んだ日時をAIの項目へ足してよい（v5.5）
  const soleAdd = (Array.isArray(rawOps) ? rawOps : []).filter(o => o && o.op === "add").length === 1;
  const touch = k => { if (k && days.indexOf(k) < 0) days.push(k); };
  /* **どの項目を触ったかも覚えておく**（2026-09-21・実機で報告）。
     「別の日に入れた」と言うときに、**その日に本当に置かれたのか**を確かめるため。
     日付だけ見ていると、締切が明日なだけの用事を「明日の予定に入れた」と言ってしまう。 */
  const touched = [];
  const touchId = it => { if (it && it.id && touched.indexOf(it.id) < 0) touched.push(it.id); };
  for (const o of (Array.isArray(rawOps) ? rawOps : [])) {
    if (!o || typeof o !== "object") continue;
    if (o.op === "_ambiguous_done") { asks.push("どれが終わったのか特定できませんでした。「スケジュール」タブの項目から「完了」を押してください。"); continue; }
    /* 時間帯を2つ言われたのに、1つしか読み取れなかった（v8.6・決まり5「捨てるなら、言う」）。 */
    if (o.op === "_lost_range") {
      asks.push(`時刻の範囲を${o.said}つ言っていますが、${o.have}つしか読み取れませんでした。`
        + "行を分けて（改行して）言うと、両方とも入ります。");
      continue;
    }
    /* 1日を組み立てる（v6.5）。**言われたものを言われた長さで置き、空いた所に提案を足す。**
     提案は `suggested:true` を立てる——こちらが決めたものと本人が言ったものを混ぜない（決まり2）。 */
    /* **外した提案を戻せること**（v7.1）。片道だけ作らない——
       「やっぱり入れて」と言われたときに、画面のどこからも戻せないのは最悪。 */
    if (o.op === "unsuggest") {
      const hit = liveItems().filter(i => i.kind === "preference" && i.preferKey === "noSuggest"
        && i.preferValue === o.key);
      if (!hit.length) { asks.push(`「${o.ja}」はもともと外していません。`); continue; }
      for (const i of hit) {
        i.status = "dropped"; i.updatedAt = new Date().toISOString();
        i.history = (i.history || []).concat({ at: i.updatedAt, by: "user", what: "また提案してよいことにした" });
        await putItem(i);
      }
      changes.push(`「${o.ja}」をまた提案するようにしました`);
      continue;
    }
    if (o.op === "buildfail") {
      asks.push("組み立てを頼まれましたが、どの時間帯かを読み取れませんでした。"
        + "「夜6時から11時半までの間で」のように、始まりと終わりの両方を言ってください。");
      continue;
    }
    if (o.op === "buildday") {
      const req = o.req, plan = buildDayPlan(req, state.settings, aiFill);
      /* **持ち札に戻ったことを黙らない**（v7.4・実機で報告）。
         AIがオンなのに `dayfill` が返らないと、決まった9つから選ぶ。画面には
         **前とまったく同じ顔ぶれ**が出るので、本人からは「直っていない」ようにしか見えない
         （実際にそう報告された）。理由が分かれば、もう一度言えば済む。決まり5と同じ理屈。 */
      if (SAMPLEFN && !aiFill.length) {
        asks.push("提案の中身がAIから返ってこなかったので、決まった顔ぶれから選びました。"
          + "もう一度同じことを言うと、その人に合わせたものが出ることがあります。");
      }
      const [ky, km, kd] = req.dayKey.split("-").map(Number);
      const made = [], dupes = [], moved = [];
      /* **もう一度組み立てたら、その日を組み直す**（v7.5・実機で報告）。
         前は「同じものがある」で**足さずに飛ばす**だけだったので、こうなった（実測）：
         ① 本人が言ったぶん（勉強・ご飯・お風呂）が飛ばされて **「言われた0件」**
         ② 並びは飛ばす前に決めてあるので、**飛ばした場所が穴になる**
            （06:10〜06:15 のあと、次が 07:15。その1時間に何も無い）
         ③ 前の組み立ての提案がそのまま残り、新しい提案と重なる
         組み立て直しは「その時間帯をやり直す」ことなので、**前のぶんを片付けてから置く**。
         触るのは**この時間帯にある・前の組み立てが作ったもの**だけ。
         手で入れた予定や、別の時間帯のものには触らない（決まり2）。 */
      const winOfDay = x => {
        if (!validISO(x.due) || x.dayKey !== req.dayKey) return false;
        const m = minOfDay(x.due, tz);
        return m >= req.win[0] && m < req.win[1];
      };
      /* 前の組み立てが作ったものか。`built` は今回から付ける印で、
         それ以前に作られたものは `history` の文言で見分ける（古い記録も組み直せるように）。 */
      const fromBuild = x => !!(x.built || x.suggested
        || (x.history || []).some(h => h && h.what === "組み立ての依頼から作った"));
      for (const r of plan.rows) {
        const at = new Date(zoned(ky, km, kd, 0, 0, tz).getTime() + r.s * 60000);
        // 食事は、置かれた枠の時刻で朝食／昼食／夕食を決め直す（決まり6i・v6.9）
        const title = r.mealWord
          ? (mealTitle(r.mealWord + "を食べる", at.toISOString(), tz) || r.title) : r.title;
        const it = {
          id: uid(), noteId: note ? note.id : null, kind: "task", title,
          evidence: { text: (o.quote || req.wants.map(w => w.title).join("・")), start: 0, end: 0 },
          origin: "rule", confirmed: false, corrected: false, status: "open",
          dayKey: req.dayKey, duePrecision: "exact", due: at.toISOString(),
          estimateMin: r.min, suggested: !r.mine, suggestWhy: r.why || null,
          createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
          history: [{ at: new Date().toISOString(), by: r.mine ? "rule" : "app",
            what: r.mine ? "組み立ての依頼から作った" : "アプリが提案して入れた" }]
        };
        it.dedupeKey = dedupeKey(it);
        it.built = true;                      // 次に組み直すとき、動かしてよい印
        /* 同じ時間帯に、前の組み立てが作った同じものがある＝**組み立て直し**。
           足さずに飛ばすと穴が空くので、**その枠へ動かして使う**。 */
        const same = state.items.find(x => x.dedupeKey === it.dedupeKey
          && x.status === "open" && fromBuild(x) && winOfDay(x));
        if (same) {
          same.due = it.due; same.estimateMin = it.estimateMin;
          same.duePrecision = "exact"; same.built = true;
          same.updatedAt = new Date().toISOString();
          same.history = (same.history || []).concat({ at: same.updatedAt, by: "app",
            what: "組み立て直しで時間を動かした" });
          await putItem(same);
          moved.push({ id: same.id, title: same.title, mine: !same.suggested });
          continue;
        }
        /* **消したものに、言ったことを塞がせない**（v7.6・実機で報告）。
           決まり5は「突き合わせに完了・取り消し済みも含める」——**完了した用事を
           こちらから再提案しない**ための決まり。ところが組み立ては**本人が名指しで
           頼んでいる**ので、同じ規則を当てると逆に働く。実機ではこうなった：
           ① 組み立てる → ②「さっきの話を全部消して」で10件が取り消し →
           ③ もう一度同じことを言う → **勉強・ご飯・お風呂が「もう入っています」で
           飛ばされ**、「言われた0件」。消したのに、消したものが邪魔をしていた。
           **本人が「これをやる」と言っている場面では、開いているものだけを見る。** */
        if (state.items.some(x => x.dedupeKey === it.dedupeKey && x.status === "open")) {
          dupes.push(it.title); continue;                 // **黙って捨てない**（決まり5）
        }
        made.push(it);
      }
      for (const it of made) await putItem(it);
      /* 新しい並びに入らなかった**前の組み立ての提案**だけを外す。
         **順番が肝心**：先に外すと、外したものが「取り消し済み」として重複判定に残り
         （決まり5「完了・取り消し済みも含める」）、**同じ提案を足し直せなくなる**
         ——直した直後に実測して、提案が0件になった。置き終えてから片付けること。 */
      const keep = new Set(made.map(i => i.id).concat(moved.map(m => m.id)));
      let cleared = 0;
      for (const x of liveItems()) {
        if (x.status !== "open" || !x.suggested || keep.has(x.id) || !winOfDay(x)) continue;
        x.status = "dropped"; x.updatedAt = new Date().toISOString();
        x.history = (x.history || []).concat({ at: x.updatedAt, by: "app",
          what: "組み立て直したので外した" });
        await putItem(x); cleared++;
      }
      days.push(req.dayKey); kinds.push("task");
      const mineN = made.filter(i => !i.suggested).length + moved.filter(m => m.mine).length;
      const sugN = made.filter(i => i.suggested).length + moved.filter(m => !m.mine).length;
      changes.push(`${hhmm(req.win[0])}〜${hhmm(req.win[1])}で1日を組み立てました（言われた${mineN}件＋提案${sugN}件）`);
      if (dupes.length) asks.push(`${dupes.join("・")}は、もう同じものが入っていたので足していません。`);
      if (cleared || moved.length) asks.push("この時間帯は前にも組み立てていたので、組み直しました"
        + `（${moved.length ? `${moved.length}件を置き直し` : ""}`
        + `${moved.length && cleared ? "、" : ""}`
        + `${cleared ? `前の提案${cleared}件を外しました` : ""}）。`);
      if (plan.dropped.length) asks.push(`時間が足りないので、提案のうち${plan.dropped.join("・")}は入れませんでした。`);
      if (plan.short > 0) asks.push(`言われたぶんだけで${durJa(plan.short)}はみ出しています。どれかを短くするか、時間帯を広げてください。`);      /* **寄せたなら、そう言う**（決まり4b「選んだだけで終わらせない」）。
         黙って今日へ寄せると、明日のつもりだった人には理由が分からない。 */
      /* 寄せたこと・頭を切ったことは、**1文にまとめて1回だけ**言う（決まり6d「返事は軽く」）。
         2つに分けると、20時に言ったとき同じ時刻が3回出て読めなくなった（作った直後に実測）。 */
      if (req.startedAt != null || req.movedFrom) {
        const alt = req.movedFrom
          ? `明日の朝${Math.floor(req.movedFrom[1][0] / 60)}時からのことなら、「明日の朝${Math.floor(req.movedFrom[1][0] / 60)}時から」と言い直してください。`
          : "";
        asks.push(req.startedAt != null
          ? `${hhmm(req.startedAt)}からの話でしたが、いまは${hhmm(req.win[0])}なので、そこから${hhmm(req.win[1])}までで組み立てました。${alt}`
          : `今日の${hhmm(req.win[0])}〜${hhmm(req.win[1])}として組み立てました。${alt}`);
      }
      /* **習慣の提案はコードで作らない**（v6.7・本人の指示）。
         決まった持ち札から選ぶと、毎回同じ4つが出る。**その都度AIに考えさせ、
         返事の文の中で1つだけ**言ってもらう（`buildPrompt` に書いてある）。
         ここが持つのは「どの日を組み立てたか」だけ——まとめて消す道に要る。 */
      habitDay = req.dayKey;
      continue;
    }
    if (o.op === "_needs_ai") {
      asks.push(SAMPLEFN
        ? "言い直しのようですが、うまく読み取れませんでした。「スケジュール」タブの「所要時間を直す」から直してください。"
        : "いまAIを使っていないので、言い直し（時刻や所要時間の変更、完了）は自動で反映できません。「スケジュール」タブの項目の「…」→「訂正」から直してください。");
      continue;
    }
    if (!OPS.includes(o.op)) continue;
    const target = o.id ? findItem(String(o.id)) : null;
    if (["update", "done", "defer", "drop", "progress"].includes(o.op) && !target) {
      asks.push("言い直された用事が特定できませんでした。「スケジュール」タブの項目の「…」→「訂正」で直してください。");
      continue;
    }

    if (o.op === "add") {
      let it = o._built;
      if (!it) {
        const kind = ["task", "event", "goal"].includes(o.kind) ? o.kind : "task";
        /* AIが付けた見出しにも、**こちらと同じ掃除**を通す（v4.6）。
           実機で「勉強しようかな」「30分勉強する」がそのまま見出しになった。
           これは言い換えではない——時刻や所要時間や語尾をそろえるだけで、
           中身の語は変わらないので `dedupeKey` も照合も揺れない（決まり7cb）。 */
        const title = typeof o.title === "string" ? cleanTitle(o.title.trim(), null, { keepHabit: kind === "goal" }).slice(0, 80) : "";
        /* 見出しが空になったら黙って捨てない（v5.2・実機で報告）。
           画面には何も出ないので、本人からは「送れていない」ようにしか見えない。 */
        if (!title) { asks.push("いまの話から用事の名前を取り出せませんでした。「スケジュール」タブの「＋ 自分で足す」から入れてください。"); continue; }
        it = {
          id: uid(), noteId: note.id, kind, title,
          evidence: evidenceOf(note, o.quote),
          origin: "ai", corrected: false, confirmed: false, status: "open",
          createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), history: []
        };
        applyFields(it, o, tz, note, { soleAdd });
      }
      // AIが「ご飯食べに行こうかな」のような言い方で返してきても、食事は名前を揃える
      const mt = mealTitle(it.title, note.capturedAt, tz) || mealTitle(o.quote || "", note.capturedAt, tz);
      if (mt && it.kind === "task") {
        it.title = mt; it.isMeal = true;
        if (it.estimateMin == null) it.estimateMin = 30;
      }
      it.dedupeKey = dedupeKey(it);
      /* 同じものを二重に作らない（決まり5）。ただし **黙って捨てない**（v5.2・実機で報告）。
         `changes` にも `asks` にも何も入らないので、画面はまったく変わらず、
         本人からは「**追加すらされなかった**」ようにしか見えない。
         突き合わせは完了・取り消し済みも含めるので、**前に終わらせたものと同じ名前**でも
         ここに落ちる。何とぶつかったのかを言って、足す道も示すこと。 */
      const dup = state.items.find(x => x.dedupeKey === it.dedupeKey);
      if (dup) { asks.push(dupeAsk(dup, tz)); continue; }
      const twin = findSimilar(it);
      if (twin) { await mergeInto(twin, it, changes, tz); continue; }      // 言い換えちがいの二重登録を防ぐ
      await putItem(it);
      touch(it.dayKey);
      touch(it.targetDay);   // 締切が明日でも、手を付けるのが今日なら今日の案を見せる
      touchId(it);
      changes.push(`${KIND_JA[it.kind]}を追加：${it.title}${describeWhen(it, tz)}`);
      // 午前とも午後とも読める時刻だった。選んだほうを書いて、もう一方を出して聞き返す
      if (it.whenAlt) {
        asks.push(`「${it.title}」は ${fmtDT(it.start || it.due, tz)} と読みました。`
          + `${fmtDT(it.whenAlt.start, tz)} のことなら、項目の「${fmtDT(it.whenAlt.start, tz)}にする」を押してください。`);
      }
    }
    else if (o.op === "update") {
      const before = { title: target.title, day: target.dayKey, est: target.estimateMin, start: target.start };
      applyFields(target, o, tz, note);
      if (typeof o.title === "string" && o.title.trim()) target.title = cleanTitle(o.title.trim(), null, { keepHabit: target.kind === "goal" }).slice(0, 80);
      target.corrected = true; target.confirmed = true; target.whenAlt = null;   // 本人が決めたので、もう一方は要らない
      target.dedupeKey = dedupeKey(target);
      const d = [];
      if (before.title !== target.title) d.push(`「${before.title}」→「${target.title}」`);
      if (before.start !== target.start && target.start) d.push(`時刻を ${fmtDT(target.start, tz)} に`);
      if (before.day !== target.dayKey && target.dayKey) d.push(`日付を ${target.dayKey.slice(5).replace("-", "/")} に`);
      if (before.est !== target.estimateMin) d.push(`所要時間を ${before.est == null ? "未設定" : before.est + "分"}→${target.estimateMin == null ? "未設定" : target.estimateMin + "分"} に`);
      if (o.travelMin != null) d.push(`移動 ${target.travelMin}分を確保`);
      if (o.prepMin != null) d.push(`準備 ${target.prepMin}分を確保`);
      if (o.targetDate) d.push(`${target.targetDay.slice(5).replace("-", "/")}までに終えたい、として扱う`);
      note2(target, "訂正：" + (d.join(" / ") || "変更なし"));
      await putItem(target);
      touch(target.dayKey); touch(before.day); touchId(target);
      changes.push(`${target.title}：${d.join(" / ") || "変更なし"}`);
    }
    else if (o.op === "done") {
      target.status = "done"; target.completedAt = new Date().toISOString(); target.confirmed = true;
      note2(target, "完了にした"); await putItem(target);
      changes.push(`完了：${target.title}`);
    }
    else if (o.op === "defer") {
      const cur = target.dayKey || dayKey(new Date(note.capturedAt), tz);
      const to = isDate(o.toDate) ? o.toDate : dayKey(new Date(keyToDate(cur, tz).getTime() + 86400000), tz);
      const old = target.due ? parts(new Date(target.due), tz) : null;
      const [y, mo, d] = to.split("-").map(Number);
      const keepTime = old && target.duePrecision === "exact";
      target.due = zoned(y, mo, d, keepTime ? old.h : 23, keepTime ? old.mi : 59, tz).toISOString();
      target.dayKey = to; target.targetDay = null; target.corrected = true; target.confirmed = true;
      target.dedupeKey = dedupeKey(target);
      note2(target, `${cur} から ${to} へ延期した`); await putItem(target);
      touch(cur); touch(to); touchId(target);
      changes.push(`後ろへ：${target.title}（${to.slice(5).replace("-", "/")}以降）`);
    }
    else if (o.op === "drop") {
      target.status = "dropped"; target.confirmed = true;
      note2(target, "取り消した"); await putItem(target);
      changes.push(`やめる：${target.title}`);
    }
    else if (o.op === "prefer") {
      const key = PREF_KEYS.includes(o.key) ? o.key : "free";
      const text = typeof o.text === "string" && o.text.trim() ? o.text.trim().slice(0, 120) : String(o.quote || "").slice(0, 120);
      if (!text) continue;
      const scopeDay = isDate(o.scopeDay) ? o.scopeDay : null;
      /* 値の検算は**1か所**（v5.9・4周目の調査で発見）。
         新しく作るときだけ検算していて、**既にある希望を更新する道は素通し**だった。
         `noEveningWork` は「分」として `planFor` に効くので、`0` が入ると
         **その日が丸ごと使えなくなる**（実測でそうなった）。決まり9そのもの。 */
      const value = key === "noEveningWork"
        ? (num(o.value, 12 * 60, 23 * 60) || EVENING_DEFAULT_MIN)   // 12:00〜23:00 に収める
        : key === "noSuggest"
        ? (DAY_FILL.some(f => f.key === o.value) ? o.value : null)  // 持ち札の名前以外は受け取らない
        : (o.value !== false);
      if (key === "noSuggest" && !value) { asks.push("どの提案を外すのか分かりませんでした。"); continue; }
      /* `noSuggest` は**1件ずつ別の希望**なので、値まで見て突き合わせる（v7.1）。
         key だけで見ると、2つ目を言ったときに1つ目が上書きされて消える。 */
      const existing = liveItems().find(i => i.kind === "preference" && i.preferKey === key && key !== "free"
        && (i.scopeDay || null) === scopeDay
        && (key !== "noSuggest" || i.preferValue === value));
      if (existing) { existing.preferValue = value; existing.title = text; existing.updatedAt = new Date().toISOString(); note2(existing, "言い直しで更新"); await putItem(existing); }
      else {
        await putItem({
          id: uid(), noteId: note.id, kind: "preference", title: text, preferKey: key, scopeDay,
          preferValue: value,
          evidence: evidenceOf(note, o.quote), origin: "user", corrected: false, confirmed: true, status: "open",
          createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), history: [],
          dedupeKey: "pref|" + key + (key === "noSuggest" ? "|" + value : "") + "|" + (scopeDay || "always")
        });
      }
      changes.push(scopeDay ? `今日の出し方：${text}` : `これからの出し方：${text}`);
    }
    else if (o.op === "memo") {
      const text = typeof o.text === "string" ? o.text.trim().slice(0, 500) : "";
      if (!text) continue;
      const it = {
        id: uid(), noteId: note.id, kind: "memo", title: text, evidence: evidenceOf(note, o.quote),
        uncertain: o.uncertain === true,     // 「〜と思う」＝あると断定できない
        origin: "ai", corrected: false, confirmed: false, status: "open",
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), history: []
      };
      it.dedupeKey = dedupeKey(it);
      if (state.items.some(x => x.dedupeKey === it.dedupeKey)) continue;
      await putItem(it); changes.push(`あとで見返せるように残しました`);
    }
    else if (o.op === "progress") {
      // 進んでいない／あと◯分 は「完了」ではない。残り時間と進捗メモだけ更新する。
      const rem = num(o.remainingMin, 5, 600);
      const bits = [];
      if (rem != null) { target.remainingMin = rem; bits.push(`残り${durJa(rem)}`); }
      if (typeof o.note === "string" && o.note.trim()) { target.progressNote = o.note.trim().slice(0, 120); bits.push(o.note.trim().slice(0, 40)); }
      if (!bits.length) bits.push("進み具合を記録");
      target.corrected = true; target.confirmed = true;
      note2(target, "進捗：" + bits.join(" / "));
      await putItem(target); touch(target.dayKey); touchId(target);
      changes.push(`${target.title}：${bits.join(" / ")}`);
    }
    else if (o.op === "idea") {
      const text = typeof o.text === "string" ? o.text.trim().slice(0, 200) : "";
      if (!text) continue;
      const it = {
        id: uid(), noteId: note.id, kind: "idea", title: text, note: text,
        evidence: evidenceOf(note, o.quote), origin: "ai", corrected: false, confirmed: false,
        status: "open", createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), history: []
      };
      it.dedupeKey = dedupeKey(it);
      if (state.items.some(x => x.dedupeKey === it.dedupeKey)) continue;
      await putItem(it);
      changes.push(`気になっていることとして残しました：${text.slice(0, 24)}`);
    }
    else if (o.op === "profile") {
      const it = profileItemFrom(o, { noteId: note.id, origin: "ai", at: note.capturedAt, evidence: evidenceOf(note, o.quote) });
      if (!it) continue;
      if (state.items.some(x => x.dedupeKey === it.dedupeKey)) continue;
      await putItem(it);
      changes.push(`わたしのことに追加：${it.title}`);
    }
    else if (o.op === "condition") {
      const text = typeof o.text === "string" ? o.text.trim().slice(0, 300) : "";
      if (!text) continue;
      const it = {
        id: uid(), noteId: note.id, kind: "condition", title: text.slice(0, 60),
        selfReport: text, reportedAt: note.capturedAt,     // 本人の言葉と日時だけ。点数は作らない。
        evidence: evidenceOf(note, o.quote),
        origin: "rule", corrected: false, confirmed: false, status: "open",
        createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), history: []
      };
      it.dedupeKey = dedupeKey(it);
      if (state.items.some(x => x.dedupeKey === it.dedupeKey)) continue;
      await putItem(it); kinds.push("condition");
      changes.push(`体調のことを記録（${fmtDT(note.capturedAt, tz)}時点の申告）`);
    }
    kinds.push(o.op);
  }
  return { changes, asks: [...new Set(asks)], days, touched, kinds, habitDay };
}

/* AIが日付を付けてきたとき、その発言に**日付の言葉**が本当にあったかを確かめる。
   **時刻を言っただけでは「日付を言った」ことにならない**（v4.7・実機で報告）。
   ここが `!!parseWhen(...)` だったため、「6〜9時の間に30分勉強する」に時刻があるだけで
   「日付を言った」と判定され、AIが足した「明日」がそのまま通っていた。
   本人は今日のつもりだったのに、明日の予定になった。 */
/* 「日付の言葉があったか」の判定は **1か所**（決まり7e・v5.7）。
   v5.3 で `applyFields` に同じ式を書いてしまい、アプリは `dateWasSpoken` を
   呼ばなくなっていた。**テストだけが生きている関数を測っている**状態で、
   片方を直してももう片方が変わらない。今日それで何度も壊した。 */
const dateSpokenIn = w => !!(w && !w.timeOnly);
function dateWasSpoken(note, tz) {
  if (!note || !note.text) return true;
  const w = parseWhen(note.text, note.capturedAt || new Date().toISOString(), tz);
  return dateSpokenIn(w);
}

/* AIが付けた日付を引き戻したことは、**返事では知らせない**（2026-09-21・本人の指示
   「日付は言っていなかったので〜などの文章はいらない」）。
   引き戻しそのものは今までどおり行う（決まり7d）——消したのは文章だけ。
   直した日付は項目の行（「9/21 12:30」）に出ていて、そこから直せる。
   本体AIの文章はもう受け取らないので（決まり7b）、v5.1 が心配した
   「予定表は今日なのに返事だけ明日」のズレは、そもそも起きようがない。
   引き戻した事実は `it.dateInferred` に残る（`srcChip()` の由来の印と同じ役目）。 */
function applyFields(it, o, tz, note, opts) {
  /* 同じ発言を、ルールでも読んでおく。AIの読み違いを見つけるための「もう一つの目」。 */
  const rw = (note && note.text)
    ? parseWhen(note.text, note.capturedAt || new Date().toISOString(), tz) : null;

  /* **時刻を言っているのにAIが落としたら、ルールの読み取りで埋める**（v5.5・実機で報告）。
     「11時から12時まで勉強する」が **時刻の無いタスク**になった。
     時刻の範囲を言われたら予定（event）にする、が決まり4e。タスクにすると
     所要時間だけが残り、`planFor` が空いている場所へ勝手に置く（言った時刻に置かれない）。
     **足すのは、そのAIが `add` を1件しか返していないときだけ。**
     1回の発言に用事が複数あるとき（「11時から勉強。あと牛乳を買う」）、
     関係ない方にまで同じ時刻を付けてしまうため（決まり「1行に複数の話題があるとき、
     日時と所要時間を他の話題に持ち込まない」と同じ理屈）。 */
  /* **「6時から9時の間に30分」は除く**（決まり6k）。あれは予定ではなく「置いてよい時間帯」で、
     固定の予定にすると3時間まるごとふさぐ。時間帯は AI の `window` が受け取る。 */
  if (opts && opts.soleAdd && rw && rw.hasTime && rw.start && !rw.between && !isTime(o.dueTime)) {
    o = Object.assign({}, o, {
      dueDate: dayKey(new Date(rw.start), tz),
      dueTime: hhmm(minOfDay(rw.start, tz)),
      duePrecision: "exact"
    });
    if (rw.end) {                                  // 範囲を言っている＝固定の予定
      it.kind = "event";
      o.estimateMin = clamp(Math.round((new Date(rw.end) - new Date(rw.start)) / 60000), 5, 600);
    }
  }
  if (isDate(o.dueDate) && note && !dateSpokenIn(rw)) {
    /* 本人は日付を言っていない。**AIが足した日付は採らない**（v4.7）。
       - 言い直しなら、いまの日付を保つ（「14時にして」で今日へ動かさない）
       - 時刻だけ言われたなら、**話した日**（ルールで読んだときと同じ）
       - どちらも無ければ日付なし。「そのうち」を明日の期限にしない */
    /* 時刻を言っているなら、**ルールが決めた日**を使う（v5.3）。
       話した日をそのまま使うと、決まり4b が翌日へ送った分（22時の「10時から」＝翌朝）
       まで今日へ引き戻して、もう過ぎた時刻に置いてしまう。 */
    const w = rw;
    const spoken = (w && w.hasTime && (w.start || w.iso))
      ? dayKey(new Date(w.start || w.iso), tz) : null;
    const day = it.dayKey || spoken || null;
    o = Object.assign({}, o, {

  if (clock && rw && rw.hasTime && (rw.start || rw.iso)) {

    const aiMin = (+clock.slice(0, 2)) * 60 + (+clock.slice(3, 5));

function dupeAsk(dup, tz) {
  const when = describeWhen(dup, tz);
  const state_ja = dup.status === "done" ? "もう完了にしてある"
    : dup.status === "dropped" ? "取り消してある" : "もう入っている";
  return `「${dup.title}」${when}が${state_ja}ので、足さなかったよ。`
    + `別のものなら「スケジュール」タブの「＋ 自分で足す」から入れてね。`;
}
function describeWhen(it, tz) {
  if (it.kind === "event" && it.start) {
    return it.timeUnknown ? `（${it.dayKey ? it.dayKey.slice(5).replace("-", "/") : fmtDT(it.start, tz).slice(0, 5)}・時刻未定）` : `（${fmtDT(it.start, tz)}）`;
  }
  // 締切と、いつ手を付けるかを分けて見せる
  if (it.kind === "task" && it.targetDay && it.dayKey && it.targetDay !== it.dayKey) {
    return `（締切 ${it.dayKey.slice(5).replace("-", "/")}・${it.targetDay.slice(5).replace("-", "/")}に進める）`;
  }
  if (it.due) return `（${it.duePrecision === "exact" ? fmtDT(it.due, tz) : fmtDT(it.due, tz).slice(0, 5) + (it.duePrecision === "week" ? "ごろ" : "まで")}）`;
  return "";
}
function note2(it, what) { it.history = (it.history || []).concat({ at: new Date().toISOString(), by: "user", what }); }

/* =======================================================================
   資料を受け取って「わたしのこと」にする
   ======================================================================= */
function profileItemFrom(o, src) {
  const title = typeof o.text === "string" ? o.text.trim().replace(/[。．\s]+$/, "").slice(0, 100) : "";
  if (!title) return null;
  const it = {
    id: uid(), kind: "profile", title,
    category: PROFILE_CATS.includes(o.category) ? o.category : profileCategory(title),
    noteId: src.noteId || null, docId: src.docId || null,
    evidence: src.evidence || { text: (o.quote || title).slice(0, 200), start: null, end: null },
    origin: src.origin || "ai", corrected: false, confirmed: false, status: "open",
    statedAt: src.at || new Date().toISOString(),
    createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(), history: []
  };
  it.dedupeKey = dedupeKey(it);
  return it;
}

/* 資料からルールで拾う。文章の資料では取りこぼすのが普通なので、AIの前段という位置づけ。 */
function profilesByRule(doc) {
  const out = [];
  for (const line of splitLines(halfWidth(doc.text))) {
    for (const sen of line.sentences) {
      if (!looksDurable(sen.text)) continue;
      const raw = doc.text.slice(sen.start, sen.end);
      const it = profileItemFrom({ text: raw }, {
        docId: doc.id, origin: "rule", at: doc.createdAt,
        evidence: { text: raw, start: sen.start, end: sen.end }
      });
      if (it) out.push(it);
    }
  }
  return out;
}

async function saveProfiles(list) {
  const added = [];
  for (const it of list) {
    if (state.items.some(x => x.dedupeKey === it.dedupeKey)) continue;   // 取り消し済みも含めて突き合わせる
    await putItem(it); added.push(it);
  }
  return added;
}

async function aiReadDoc(doc, onProgress) {
  const text = doc.text;
  const chunks = [];
  for (let i = 0; i < text.length && chunks.length < AI_MAX_CHUNKS; i += AI_CHUNK) chunks.push(text.slice(i, i + AI_CHUNK));
  const found = [];
  for (let i = 0; i < chunks.length; i++) {
    onProgress && onProgress(i, chunks.length);
    const arr = await SAMPLEFN.json(PROFILE_PROMPT_HEAD + chunks[i] + '\n"""', { modelTier: "default", cache: false });
    if (!Array.isArray(arr)) continue;
    for (const o of arr.slice(0, 20)) {
      if (!o || typeof o !== "object") continue;
      const q = typeof o.quote === "string" ? o.quote : "";
      const at = q ? text.indexOf(q) : -1;
      const it = profileItemFrom(o, {
        docId: doc.id, origin: "ai", at: doc.createdAt,
        evidence: at >= 0 ? { text: q, start: at, end: at + q.length } : { text: q || String(o.text || ""), start: null, end: null }
      });
      if (it) found.push(it);
    }
  }
  onProgress && onProgress(chunks.length, chunks.length);
  return found;
}

async function aiTurn(note) {
  const cx = contextForAI(note);
  const g = aiSignal(AI_TIMEOUT_MAIN);
  let out;
  try { out = await SAMPLEFN.json(buildPrompt(note, cx), { modelTier: "default", cache: false, signal: g.signal }); }
  finally { g.done(); }
  // 形が違うなら、黙って「何もしない」で終わらせずにルールへ戻す
  if (!out || typeof out !== "object" || !Array.isArray(out.ops)) throw { code: "invalid_json", message: "返事の形が違います" };
  /* **`reply` は受け取らない**（2026-09-21・本人の指摘「2回目のAIが1回目と同じことを話す」）。
     本体のAIが文章まで書くと、速い返事・「変えたこと」・「次にすること」を
     言い換えただけの段落が挟まる（実測：本体の3文が、コードが数えた5件の言い換えだった）。
     受け取るのは **習慣の提案（habit）だけ**（`ask` は 2026-09-21 に本人の指示で外した）。
     **注意書きで禁じるのではなく、返す形から外す**——禁じただけで守られたと思わない（決まり9）。 */
  const one = v => (typeof v === "string" ? v.trim().slice(0, 200) : "");
  return { ops: out.ops, habit: one(out.habit) };
}

/* 速い返事に渡す「時間帯」。ルール抽出は一瞬で終わるので、AIより先に答えを出せる。
   これが無いと「10時から」を勝手に朝と決めつけて、あとから出る予定表と食い違う
   （「朝の勉強時間ですね」→「今夜22時から23時で入れました」が実際に起きた）。
   数字は返さない。速い返事に数字を書かせないため（決まり7b）。 */
const WHEN_WORD = h => h < 5 ? "深夜" : h < 11 ? "朝" : h < 14 ? "昼" : h < 17 ? "午後"
  : h < 20 ? "夕方" : "夜";
function quickWhenHint(note, tz) {
  let items = [];
  try { items = extractByRule(note, state.settings) || []; } catch { return ""; }
  const noteKey = dayKey(new Date(note.capturedAt), tz);
  for (const it of items) {
    const iso = it.start || (it.kind === "task" && it.duePrecision === "exact" ? it.due : null);
    if (!iso || it.timeUnknown) continue;
    const p = parts(new Date(iso), tz);
    const k = dayKey(new Date(iso), tz);
    const day = k === noteKey ? "今日" : k > noteKey ? "明日以降" : "過ぎた日";
    return (day === "今日" ? "" : day + "の") + WHEN_WORD(p.h);
  }
  return "";
}

/* ---- 速い返事だけを先に作る（1〜2秒）----
   予定は動かさない。数字も出さない。受け止めて、ひとこと返すだけ。
   丁寧な読み取りは、このあと裏で走る。 */
function quickPrompt(note, cx) {
  const tz = state.settings.timezone;

  return `あなたは本人専属の秘書です。相手は整理せずに独り言を話します。
いま言われたことを受け止めて、**1〜2文**だけ返してください。

【守ること】
- 1〜2文。長くしない。

- **「朝」「昼」「夜」などの時間帯に触れてよいのは、【この発話の時間帯】に書いてあるときだけ。**
  そのときは、書いてある言葉に必ず合わせる。書いていなければ時間帯に触れない。
  「10時」のような言い方から、自分で朝か夜かを決めないこと（あとで出る予定表と食い違う）。

- 疲れ・眠気・落ち込みには、まず受け止める。原因を尋ねない。説教しない。
- 質問で終わらせない。
- 迷っているだけのときは、決めさせようとしない。

"""
